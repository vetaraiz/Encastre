function VistaConversor(){
  const [convF,setConvF]=useState({valor:"",unidad:"cm"});
  return(
    <div style={S.card}>
      <div style={S.cardTitle}>📐 Conversor de medidas</div>
      <div style={S.row}>
        <div style={S.col()}><label style={S.label}>Valor</label><input type="number" value={convF.valor} onChange={e=>setConvF(f=>({...f,valor:e.target.value}))} style={S.input} placeholder="0"/></div>
        <div style={S.col()}><label style={S.label}>Unidad</label>
          <select value={convF.unidad} onChange={e=>setConvF(f=>({...f,unidad:e.target.value}))} style={S.input}>
            {[["cm","Centímetros"],["mm","Milímetros"],["in","Pulgadas"],["ft","Pies"]].map(([v,l])=><option key={v} value={v}>{l}</option>)}
          </select>
        </div>
      </div>
      {convF.valor&&(()=>{
        const v=parseFloat(convF.valor);
        const cm=convF.unidad==="cm"?v:convF.unidad==="mm"?v/10:convF.unidad==="in"?v*2.54:v*30.48;
        return(
          <div style={{marginTop:14,background:C.suave,borderRadius:0,padding:16,border:`1px solid ${C.borde}`}}>
            <div style={S.row}>
              {[["cm",cm.toFixed(2)],["mm",(cm*10).toFixed(0)],["pulgadas",(cm/2.54).toFixed(3)],["pies",(cm/30.48).toFixed(3)]].map(([u,val])=>(
                <div key={u} style={{flex:1,textAlign:"center",padding:"10px 0",borderRight:`1px solid ${C.borde}`}}>
                  <div style={{fontFamily:"'Lato',sans-serif",fontSize:21,fontWeight:700,color:C.marron}}>{val}</div>
                  <div style={{fontSize:17,color:C.textoSuave,textTransform:"uppercase",letterSpacing:.8}}>{u}</div>
                </div>
              ))}
            </div>
          </div>
        );
      })()}
    </div>
  );
}

function VistaFlete({usuario,notif}){
  const esFlete=usuario.tipo==="flete";
  const [archivadosCotFlete,setArchivadosCotFlete]=useState(new Set());
  useEffect(()=>{(async()=>{
    try{
      const a=await db.select("elementos_archivados",`?usuario_id=eq.${usuario.id}&tipo_elemento=eq.cotizacion&select=elemento_id`);
      setArchivadosCotFlete(new Set((a||[]).map(x=>x.elemento_id)));
    }catch{}
  })();},[usuario.id]);
  const archivarCotFlete=async(ct)=>{
    try{
      await db.insertMin("elementos_archivados",{usuario_id:usuario.id,tipo_elemento:"cotizacion",elemento_id:ct.id});
      setArchivadosCotFlete(prev=>new Set(prev).add(ct.id));
      if(selPedido) setMisPedidos(ps=>ps.map(p=>p.id===selPedido.id?{...p,_cantCot:Math.max(0,(p._cantCot||0)-1)}:p));
      notif("Cotización archivada");
    }catch(e){ notif("No se pudo archivar"); }
  };

  // ---- Lado fletero: recibe pedidos y cotiza ----
  const [pedidos,setPedidos]=useState([]);
  const [sel,setSel]=useState(null);
  useEffect(()=>{const h=()=>setSel(null);window.addEventListener("encastre-ir-principal",h);return()=>window.removeEventListener("encastre-ir-principal",h);},[]);
  const [cotF,setCotF]=useState({items:[{descripcion:"",precio:"",cantidad:"1",modo:"viaje"}],tiempo:"",usarDesc:false,descTipo:"porcentaje",descValor:"",usarIva:false,ivaPct:"21"});
  const [miCot,setMiCot]=useState(null);
  const [solSel,setSolSel]=useState({});
  const [enviando,setEnviando]=useState(false);
  const [yaEnvio,setYaEnvio]=useState(false);
  const [filtro,setFiltro]=useState("cotizar");

  const cargar=useCallback(async()=>{
    if(!esFlete)return;
    try{
      const d=await db.select("pedidos_flete","?order=created_at.desc");
      let mias={};
      try{
        const mc=await db.select("cotizaciones_flete",`?flete_id=eq.${usuario.id}&select=pedido_id`);
        mc.forEach(c=>{mias[c.pedido_id]=true;});
      }catch{}
      let nombres={};
      try{
        const ids=[...new Set(d.map(p=>p.solicitante_id).filter(Boolean))];
        if(ids.length){
          const us=await db.select("usuarios",`?id=in.(${ids.join(",")})&select=id,nombre`);
          us.forEach(u=>{nombres[u.id]=u.nombre;});
        }
      }catch{}
      let vistos=new Set();
      try{
        const vs=await db.select("vistas_pedido",`?usuario_id=eq.${usuario.id}&tipo_pedido=eq.flete&select=pedido_id`);
        vs.forEach(v=>vistos.add(v.pedido_id));
      }catch{}
      let conMsj=new Set();
      if(d.length){
        try{
          const idsPed=d.map(p=>p.id).join(",");
          const msjs=await db.select("mensajes",`?pedido_id=in.(${idsPed})&tipo_pedido=eq.flete&para_usuario_id=eq.${usuario.id}&leido=eq.false&select=pedido_id`);
          msjs.forEach(m=>conMsj.add(m.pedido_id));
        }catch{}
      }
      setPedidos(d.map(p=>({...p,_miEstado:mias[p.id]?"cotizado":null,_solNombre:nombres[p.solicitante_id]||"Solicitante",_nuevo:!vistos.has(p.id),_msjNuevo:conMsj.has(p.id)})));
    }catch{}
  },[usuario.id,esFlete]);
  useEffect(()=>{cargar();const t=setInterval(cargar,15000);return()=>clearInterval(t);},[cargar]);

  const abrirPedido=async(p)=>{
    setSel(p); setYaEnvio(false); setMiCot(null);
    if(p._nuevo){ marcarPedidoVisto("flete",p.id,usuario.id); setPedidos(ps=>ps.map(x=>x.id===p.id?{...x,_nuevo:false}:x)); }
    try{
      const d=await db.select("cotizaciones_flete",`?pedido_id=eq.${p.id}&flete_id=eq.${usuario.id}&limit=1`);
      if(d&&d.length>0){
        let items=[];
        try{ items=Array.isArray(d[0].presupuesto_items)?d[0].presupuesto_items:JSON.parse(d[0].presupuesto_items||"[]"); }catch{items=[];}
        setMiCot({...d[0],items});
        setYaEnvio(true);
      }
      try{ const so=await db.select("usuarios",`?id=eq.${p.solicitante_id}&limit=1`); setSolSel(so[0]||{}); }catch{}
    }catch{}
  };

  const enviarCot=async()=>{
    if(!sel||enviando||yaEnvio)return;
    if(estaVencido(sel)){alert("Este pedido venció: ya no se pueden enviar cotizaciones.");return;}
    const itemsValidos=(cotF.items||[]).filter(it=>it.descripcion.trim()&&nmb(it.precio)>0&&((it.modo||"viaje")==="viaje"||nmb(it.cantidad)>0));
    if(itemsValidos.length===0){alert("Cargá al menos un ítem con descripción, precio y cantidad.");return;}
    setEnviando(true);
    try{
      let numero=1;
      try{
        const prev=await db.select("cotizaciones_flete",`?flete_id=eq.${usuario.id}&select=numero_presupuesto&order=numero_presupuesto.desc.nullslast&limit=1`);
        if(prev&&prev.length>0&&prev[0].numero_presupuesto!=null) numero=Number(prev[0].numero_presupuesto)+1;
      }catch{}
      const calc=calcularPresup(itemsValidos,cotF);
      const datos={
        pedido_id:sel.id, flete_id:usuario.id, numero_presupuesto:numero,
        precio_total:calc.total,
        descuento_tipo:cotF.usarDesc?cotF.descTipo:null,
        descuento_valor:cotF.usarDesc?nmb(cotF.descValor):null,
        iva_porcentaje:cotF.usarIva?nmb(cotF.ivaPct):null,
        tiempo_entrega:cotF.tiempo,
        presupuesto_items:itemsValidos.map((it)=>{const modo=it.modo||"viaje";const cant=modo==="viaje"?1:nmb(it.cantidad);const desc=modo==="hora"?`${it.descripcion.trim()} (por hora × ${cant} hs)`:`${it.descripcion.trim()} (por viaje)`;return{descripcion:desc,precio:nmb(it.precio),cantidad:cant,importe:nmb(it.precio)*cant};})
      };
      await db.insert("cotizaciones_flete",datos);
      // NO se toca ningún estado global del pedido: sobre cerrado — cada flete ve solo su propio estado.
      notif("¡Cotización enviada!");
      (async()=>{try{const c=await db.select("usuarios",`?id=eq.${sel.solicitante_id}&recibir_avisos=eq.true&select=email,nombre`);if(c&&c[0]&&c[0].email){const msg="<p>Recibiste una <strong>nueva cotización de flete</strong> en Encastre.</p>";db.avisarPorMail(c[0].email,c[0].nombre,"Recibiste una cotización de flete - Encastre",msg);}}catch(e){}})();
      setCotF({items:[{descripcion:"",precio:"",cantidad:"1",modo:"viaje"}],tiempo:"",usarDesc:false,descTipo:"porcentaje",descValor:"",usarIva:false,ivaPct:"21"});
      setYaEnvio(true);
      setMiCot({...datos,items:datos.presupuesto_items,created_at:new Date().toISOString()});
      setPedidos(ps=>ps.map(p=>p.id===sel.id?{...p,_miEstado:"cotizado"}:p));
    }catch(e){alert("Error: "+e.message);}
    setEnviando(false);
  };

  // ---- Lado solicitante: pide flete y ve cotizaciones ----
  const [subFl,setSubFl]=useState("mis");
  const [pedF,setPedF]=useState({origen:"",destino:"",descripcion:"",fecha:"",notas:"",fechaLimite:""});
  const [misPedidos,setMisPedidos]=useState([]);
  const [selPedido,setSelPedido]=useState(null);
  const [cotizacionesFlete,setCotizacionesFlete]=useState([]);
  const [fleteAbierto,setFleteAbierto]=useState(null);
  const [intFl,setIntFl]=useState(false);

  const cargarMisPedidos=useCallback(async()=>{
    if(esFlete)return;
    try{
      const d=await db.select("pedidos_flete",`?solicitante_id=eq.${usuario.id}&order=created_at.desc`);
      let conteo={};
      let conMsj=new Set();
      if(d.length){
        try{
          const ids=d.map(p=>p.id).join(",");
          const cots=await db.select("cotizaciones_flete",`?pedido_id=in.(${ids})&select=pedido_id`);
          cots.forEach(c=>{conteo[c.pedido_id]=(conteo[c.pedido_id]||0)+1;});
        }catch{}
        try{
          const ids=d.map(p=>p.id).join(",");
          const msjs=await db.select("mensajes",`?pedido_id=in.(${ids})&tipo_pedido=eq.flete&para_usuario_id=eq.${usuario.id}&leido=eq.false&select=pedido_id`);
          msjs.forEach(m=>conMsj.add(m.pedido_id));
        }catch{}
      }
      setMisPedidos(d.map(p=>({...p,_cantCot:conteo[p.id]||0,_msjNuevo:conMsj.has(p.id)})));
    }catch{}
  },[usuario.id,esFlete]);
  useEffect(()=>{cargarMisPedidos();},[cargarMisPedidos]);

  const abrirMiPedido=async(p)=>{
    setSelPedido(p);
    setFleteAbierto(null);
    try{
      const d=await db.select("cotizaciones_flete",`?pedido_id=eq.${p.id}&order=created_at.asc`);
      const enr=await Promise.all(d.map(async ct=>{
        const fl=await db.select("usuarios",`?id=eq.${ct.flete_id}&limit=1`);
        let items=[];
        try{ items=Array.isArray(ct.presupuesto_items)?ct.presupuesto_items:JSON.parse(ct.presupuesto_items||"[]"); }catch{items=[];}
        return{...ct,fleteNombre:fl[0]?.nombre||"Flete",fleteObj:fl[0]||{},items};
      }));
      setCotizacionesFlete(enr);
    }catch{}
  };

  const [enviandoPed,setEnviandoPed]=useState(false);
  const enviarPedido=async()=>{
    if(enviandoPed)return;
    if(!(pedF.origen&&pedF.destino)){setIntFl(true);return;}
    setEnviandoPed(true);
    try{
      await db.insert("pedidos_flete",{solicitante_id:usuario.id,origen:pedF.origen,destino:pedF.destino,descripcion_carga:pedF.descripcion,fecha_deseada:pedF.fecha||null,notas:pedF.notas,fecha_limite:fechaLimiteISO(pedF.fechaLimite)});
      notif("¡Solicitud enviada a los fletes!");
      (async()=>{try{const ps=await db.select("usuarios","?tipo=eq.flete&recibir_avisos=eq.true&select=email,nombre");const msg="<p>Tenés una <strong>nueva solicitud de flete para cotizar</strong> en Encastre.</p>";for(const c of (ps||[])){if(c.email)db.avisarPorMail(c.email,c.nombre,"Nueva solicitud de flete - Encastre",msg);}}catch(e){}})();
      setPedF({origen:"",destino:"",descripcion:"",fecha:"",notas:"",fechaLimite:""});
      setIntFl(false);
      cargarMisPedidos();
      setSubFl("mis");
    }catch(e){alert("Error: "+e.message);}
    setEnviandoPed(false);
  };

  const tabStyle=(id)=>({background:filtro===id?C.marron:"transparent",color:filtro===id?C.crema:C.textoSuave,border:filtro===id?"none":`1px solid ${C.borde}`,borderRadius:0,padding:"7px 14px",cursor:"pointer",fontSize:17,fontWeight:700,fontFamily:"'Lato',sans-serif"});

  // ================= VISTA FLETERO =================
  if(esFlete){
    if(sel){
      return(
      <div className="fade">
        <button style={{...S.btn("ghost"),marginBottom:14}} onClick={()=>setSel(null)}>← Volver</button>
        <div style={S.card}>
          <FleteFormato
            solicitante={solSel&&solSel.nombre?solSel:{nombre:sel._solNombre||"Solicitante"}}
            fecha={sel.created_at?new Date(sel.created_at).toLocaleDateString("es-AR"):null}
            fechaLimite={sel.fecha_limite?new Date(sel.fecha_limite).toLocaleDateString("es-AR"):null}
            origen={sel.origen}
            destino={sel.destino}
            fechaDeseada={sel.fecha_deseada?new Date(sel.fecha_deseada+"T12:00").toLocaleDateString("es-AR"):null}
            materiales={sel.descripcion_carga}
            notas={sel.notas}
          />

        {miCot?(
        <div style={{marginTop:20,paddingTop:20,borderTop:`2px dashed ${C.borde}`}}>
          <div style={S.cardTitle}>✅ Cotización enviada</div>
          <div style={{fontSize:15,color:C.textoSuave,marginBottom:10}}>Así la ve quien pidió el flete:</div>
          <PresupuestoFormato
            empresa={usuario}
            cliente={{...solSel,mostrar_telefono:true,mostrar_direccion:true}}
            items={miCot.items||[]}
            opts={{descuento_tipo:miCot.descuento_tipo,descuento_valor:miCot.descuento_valor,iva_pct:miCot.iva_porcentaje}}
            numero={miCot.numero_presupuesto!=null?miCot.numero_presupuesto:""}
            fecha={miCot.created_at?new Date(miCot.created_at).toLocaleDateString("es-AR"):null}
            tiempoEntrega={miCot.tiempo_entrega}
            esEmpresa={true}
            aceptado={false}
          />
        </div>
        ):estaVencido(sel)?(
        <div style={{marginTop:20,paddingTop:20,borderTop:`2px dashed ${C.borde}`,textAlign:"center"}}>
          <div style={{fontSize:32,marginBottom:8}}>⛔</div>
          <div style={{fontFamily:"'Lato',sans-serif",fontSize:19,color:"#B23A2E",fontWeight:700}}>Este pedido venció</div>
          <div style={{fontSize:16,color:C.textoSuave,marginTop:6}}>Se puso una fecha límite que ya pasó, así que no se pueden enviar cotizaciones.</div>
        </div>
        ):(
        <div style={{marginTop:20,paddingTop:20,borderTop:`2px dashed ${C.borde}`}}>
          <div style={S.cardTitle}>💰 Tu cotización</div>
          {(() => {
            const calc=calcularPresup(cotF.items,cotF);
            const setItem=(i,campo,val)=>setCotF(f=>{const its=[...f.items];its[i]={...its[i],[campo]:val};return{...f,items:its};});
            const addItem=()=>setCotF(f=>({...f,items:[...f.items,{descripcion:"",precio:"",cantidad:"1",modo:"viaje"}]}));
            const delItem=(i)=>setCotF(f=>({...f,items:f.items.length>1?f.items.filter((_,j)=>j!==i):f.items}));
            return(
            <div>
              <div style={{fontSize:14,color:C.textoSuave,marginBottom:10}}>Agregá un renglón por cada concepto: flete, ayudante extra, embalaje/empaquetado, etc. Cada renglón puede cobrarse por hora o por viaje.</div>
              {cotF.items.map((it,i)=>{
                const modo=it.modo||"viaje";
                const cant=modo==="viaje"?1:nmb(it.cantidad);
                const imp=nmb(it.precio)*cant;
                return(
                <div key={i} style={{padding:"12px 0",borderBottom:`1px dashed ${C.borde}`}}>
                  <div style={{marginBottom:8}}>
                    <label style={S.label}>Descripción</label>
                    <input value={it.descripcion} onChange={e=>setItem(i,"descripcion",e.target.value)} placeholder="Ej: Flete camioneta, Ayudante extra, Embalaje" style={S.input}/>
                  </div>
                  <div style={{marginBottom:8}}>
                    <label style={S.label}>Modalidad</label>
                    <div style={{display:"flex",gap:20,marginTop:4}}>
                      {[["viaje","Por viaje"],["hora","Por hora"]].map(([m,l])=>(
                        <label key={m} style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",fontSize:15,color:modo===m?C.marron:C.textoSuave,fontWeight:modo===m?700:400}}>
                          <input type="radio" name={`modo-${i}`} checked={modo===m} onChange={()=>setItem(i,"modo",m)} style={{accentColor:C.marron,width:16,height:16}}/>
                          {l}
                        </label>
                      ))}
                    </div>
                  </div>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end"}}>
                    <div style={{flex:1,minWidth:110}}>
                      <label style={S.label}>{modo==="hora"?"Precio por hora ($)":"Precio ($)"}</label>
                      <input type="number" value={it.precio} onChange={e=>setItem(i,"precio",e.target.value)} placeholder="0" style={S.input}/>
                    </div>
                    {modo==="hora"&&(
                    <div style={{flex:"0 0 90px"}}>
                      <label style={S.label}>Horas</label>
                      <input type="number" value={it.cantidad} onChange={e=>setItem(i,"cantidad",e.target.value)} placeholder="1" style={S.input}/>
                    </div>
                    )}
                    <div style={{flex:1,minWidth:110,textAlign:"right"}}>
                      <label style={S.label}>Importe</label>
                      <div style={{fontWeight:800,color:C.marron,fontSize:17,padding:"10px 0"}}>{fmtPeso(imp)}</div>
                    </div>
                  </div>
                  {cotF.items.length>1&&<button onClick={()=>delItem(i)} style={{...S.btn("ghost"),color:C.error,borderColor:C.error,fontSize:14,padding:"5px 10px",marginTop:6,minHeight:"auto"}}>🗑️ Quitar renglón</button>}
                </div>
                );
              })}
              <button onClick={addItem} style={{...S.btn("ghost"),width:"100%",justifyContent:"center",marginBottom:14}}>＋ Agregar renglón</button>

              <div style={{marginBottom:12}}>
                <label style={S.label}>Fecha y horario que proponés <span style={{fontWeight:400,color:C.textoSuave}}>(opcional)</span></label>
                <input value={cotF.tiempo} onChange={e=>setCotF(f=>({...f,tiempo:e.target.value}))} placeholder="Ej: Jueves 15 a la mañana, o 'a coordinar'" style={S.input}/>
              </div>

              <div style={{border:`1px solid ${C.borde}`,borderRadius:0,padding:10,marginBottom:10}}>
                <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:16,color:C.marron,fontWeight:700}}>
                  <input type="checkbox" checked={cotF.usarDesc} onChange={e=>setCotF(f=>({...f,usarDesc:e.target.checked}))}/>
                  Aplicar descuento
                </label>
                {cotF.usarDesc&&(
                  <div style={{display:"flex",gap:8,marginTop:8,alignItems:"flex-end"}}>
                    <div style={{flex:"0 0 140px"}}>
                      <label style={S.label}>Tipo</label>
                      <select value={cotF.descTipo} onChange={e=>setCotF(f=>({...f,descTipo:e.target.value}))} style={S.input}>
                        <option value="porcentaje">Porcentaje (%)</option>
                        <option value="monto">Monto fijo ($)</option>
                      </select>
                    </div>
                    <div style={{flex:1}}>
                      <label style={S.label}>{cotF.descTipo==="porcentaje"?"% de descuento":"Monto ($)"}</label>
                      <input type="number" value={cotF.descValor} onChange={e=>setCotF(f=>({...f,descValor:e.target.value}))} placeholder="0" style={S.input}/>
                    </div>
                  </div>
                )}
              </div>

              <div style={{border:`1px solid ${C.borde}`,borderRadius:0,padding:10,marginBottom:14}}>
                <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:16,color:C.marron,fontWeight:700}}>
                  <input type="checkbox" checked={cotF.usarIva} onChange={e=>setCotF(f=>({...f,usarIva:e.target.checked}))}/>
                  Agregar IVA
                </label>
                {cotF.usarIva&&(
                  <div style={{marginTop:8}}>
                    <label style={S.label}>% de IVA</label>
                    <input type="number" value={cotF.ivaPct} onChange={e=>setCotF(f=>({...f,ivaPct:e.target.value}))} placeholder="21" style={{...S.input,maxWidth:160}}/>
                  </div>
                )}
              </div>

              <div style={{marginBottom:12}}><label style={S.label}>Detalle / condiciones <span style={{fontWeight:400,color:C.textoSuave}}>(opcional)</span></label>
                <textarea value={cotF.detalle||""} onChange={e=>setCotF(f=>({...f,detalle:e.target.value}))} placeholder="Horario estimado, condiciones, observaciones..." style={{...S.input,minHeight:56,resize:"vertical"}}/>
              </div>

              <div style={{background:C.suave,borderRadius:0,padding:12,border:`1px solid ${C.borde}`,marginBottom:12}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:6,fontSize:16}}><span style={{color:C.textoSuave}}>Subtotal</span><b>{fmtPeso(calc.subtotal)}</b></div>
                {cotF.usarDesc&&calc.descuento>0&&<div style={{display:"flex",justifyContent:"space-between",marginBottom:6,fontSize:16,color:C.error}}><span>Descuento{cotF.descTipo==="porcentaje"?` (${nmb(cotF.descValor)}%)`:""}</span><b>− {fmtPeso(calc.descuento)}</b></div>}
                {cotF.usarIva&&<div style={{display:"flex",justifyContent:"space-between",marginBottom:6,fontSize:16}}><span style={{color:C.textoSuave}}>IVA ({nmb(cotF.ivaPct)}%)</span><b>{fmtPeso(calc.iva)}</b></div>}
                <div style={{display:"flex",justifyContent:"space-between",borderTop:`2px solid ${C.verde}`,paddingTop:8,marginTop:4}}><span style={{fontWeight:800,fontSize:19,color:C.marron}}>TOTAL</span><b style={{fontWeight:800,fontSize:22,color:C.verde}}>{fmtPeso(calc.total)}</b></div>
              </div>

              <button style={{...S.btn("dark"),opacity:enviando||yaEnvio?0.6:1}} onClick={enviarCot} disabled={enviando||yaEnvio}>
                {enviando?"⟳ Enviando...":(yaEnvio?"✅ Cotización enviada":"📤 Enviar cotización")}
              </button>
            </div>
            );
          })()}
        </div>
        )}

        <Chat pedidoId={sel.id} tipoPedido="flete" miUsuario={usuario} otroUsuario={{id:sel.solicitante_id}} onLeido={cargar} titulo="Chat con solicitante"/>
        </div>
      </div>
      );
    }

    const cuenta={
      cotizar:pedidos.filter(p=>!p._miEstado&&!estaVencido(p)).length,
      cotizados:pedidos.filter(p=>p._miEstado).length,
      vencido:pedidos.filter(p=>estaVencido(p)&&!p._miEstado).length,
      todos:pedidos.length,
    };
    const lista=pedidos.filter(p=>{
      if(filtro==="cotizar")return !p._miEstado&&!estaVencido(p);
      if(filtro==="cotizados")return !!p._miEstado;
      if(filtro==="vencido")return estaVencido(p)&&!p._miEstado;
      return true;
    });

    return(
      <div>
        <div style={S.secTitle}>🚚 Pedidos de flete</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
          {[["cotizar","Para cotizar"],["cotizados","Cotizados"],["vencido","Vencidos"],["todos","Todos"]].map(([id,l])=>(
            <button key={id} style={tabStyle(id)} onClick={()=>setFiltro(id)}>{l} {cuenta[id]}</button>
          ))}
        </div>
        {pedidos.length===0&&<div style={{...S.card,color:C.textoSuave,textAlign:"center",padding:28,fontStyle:"italic"}}>No hay pedidos aún</div>}
        {pedidos.length>0&&lista.length===0&&<div style={{...S.card,color:C.textoSuave,textAlign:"center",padding:24,fontStyle:"italic"}}>No hay pedidos en esta categoría</div>}
        {lista.map(p=>{
          const et=p._miEstado?{t:"Cotizado por mí",bg:C.acento,fg:C.marron}:estaVencido(p)?{t:"Vencido",bg:"#B23A2E",fg:"#fff"}:{t:"Para cotizar",bg:C.marron,fg:C.crema};
          return(
          <div key={p.id} style={{...S.card,cursor:"pointer",transition:"all .15s",borderColor:p._nuevo?"#009966":"#8B451399",borderWidth:p._nuevo?2:1}} onClick={()=>abrirPedido(p)}
            onMouseEnter={e=>{e.currentTarget.style.borderColor=C.acento;e.currentTarget.style.transform="translateY(-1px)";}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor=p._nuevo?"#009966":C.borde;e.currentTarget.style.transform="none";}}>
            <div style={{display:"flex",justifyContent:"space-between"}}>
              <div>
                <div style={{fontFamily:"'Lato',sans-serif",fontWeight:700,color:C.marron,fontSize:17}}>👤 {p._solNombre||"Solicitante"}<TagNuevo on={p._nuevo}/><TagMsjNuevo on={p._msjNuevo}/></div>
                <div style={{fontSize:16,color:C.marron,marginTop:2}}>{p.origen} → {p.destino}</div>
                <div style={{fontSize:17,color:C.textoSuave,marginTop:3}}>{p.fecha_deseada?new Date(p.fecha_deseada+"T12:00").toLocaleDateString("es-AR"):"Sin fecha definida"} · {new Date(p.created_at).toLocaleDateString("es-AR")}</div>
              {p.fecha_limite&&<div style={{marginTop:4}}><AvisoVence fechaLimite={p.fecha_limite}/></div>}
              </div>
              <span style={{alignSelf:"flex-start",whiteSpace:"nowrap",background:et.bg,color:et.fg,fontSize:13,fontWeight:700,padding:"5px 10px",borderRadius:0,fontFamily:"'Lato',sans-serif"}}>{et.t}</span>
            </div>
          </div>
          );
        })}
      </div>
    );
  }

  // ================= VISTA SOLICITANTE (cualquier tipo que no sea flete) =================
  return(
    <div>
      {subFl==="pedir"&&(
        <div style={S.card}>
          <button style={{...S.btn("ghost"),marginBottom:14}} onClick={()=>setSubFl("mis")}>← Volver a mis pedidos</button>
          <div style={S.cardTitle}>🚚 Solicitar flete</div>
          <div style={{fontSize:14,color:C.textoSuave,marginBottom:10}}>Se envía a todos los fletes registrados. Cada uno cotiza por su cuenta, sin ver las cotizaciones de los demás.</div>
          <div style={S.row}>
            <div style={S.col()}><label style={S.label}>Origen</label><input value={pedF.origen} onChange={e=>setPedF(f=>({...f,origen:e.target.value}))} placeholder="Dirección de origen" style={{...S.input,...marcaErr(intFl,!pedF.origen)}}/></div>
            <div style={S.col()}><label style={S.label}>Destino</label><input value={pedF.destino} onChange={e=>setPedF(f=>({...f,destino:e.target.value}))} placeholder="Dirección de destino" style={{...S.input,...marcaErr(intFl,!pedF.destino)}}/></div>
          </div>
          <BannerFalta activo={intFl} lista={[[!pedF.origen,"el origen"],[!pedF.destino,"el destino"]]}/>
          <div style={{...S.row,marginTop:10}}>
            <div style={S.col()}><label style={S.label}>Descripción de la carga <span style={{fontWeight:400,color:C.textoSuave}}>(opcional)</span></label><input value={pedF.descripcion} onChange={e=>setPedF(f=>({...f,descripcion:e.target.value}))} placeholder="Ej: Mesa de roble 220×100, 80kg" style={S.input}/></div>
            <div style={{flex:.5}}><label style={S.label}>Fecha deseada <span style={{fontWeight:400,color:C.textoSuave}}>(opcional)</span></label><input type="date" value={pedF.fecha} onChange={e=>setPedF(f=>({...f,fecha:e.target.value}))} style={S.input}/></div>
          </div>
          <div style={{marginTop:10}}>
            <label style={S.label}>Notas adicionales <span style={{fontWeight:400,color:C.textoSuave}}>(opcional)</span></label>
            <input value={pedF.notas} onChange={e=>setPedF(f=>({...f,notas:e.target.value}))} placeholder="¿Necesita ayudante, embalaje, acceso difícil, etc.?" style={S.input}/>
          </div>
          {pedF.origen&&pedF.destino&&(
            <a href={`https://www.openstreetmap.org/directions?engine=fossgis_osrm_car&route=${encodeURIComponent(pedF.origen)};${encodeURIComponent(pedF.destino)}`}
               target="_blank" rel="noopener noreferrer"
               style={{display:"inline-flex",alignItems:"center",gap:6,background:C.suave,border:`1px solid ${C.borde}`,borderRadius:0,padding:"8px 14px",color:C.marron,fontSize:17,fontWeight:700,textDecoration:"none",marginTop:12}}>
              🗺️ Ver ruta en el mapa
            </a>
          )}
          <div style={{marginTop:12}}>
            <label style={S.label}>Fecha límite para recibir cotizaciones <span style={{fontWeight:400,color:C.textoSuave}}>(opcional)</span></label>
            <input type="date" min={minFechaLimite()} value={pedF.fechaLimite||""} onChange={e=>setPedF(f=>({...f,fechaLimite:e.target.value}))} style={{...S.input,maxWidth:220}}/>
            <div style={{fontSize:14,color:C.textoSuave,marginTop:4}}>Pasada esa fecha el pedido se marca vencido y ya no se puede cotizar.</div>
          </div>
          <button style={{...S.btn("dark"),marginTop:14,opacity:enviandoPed?0.6:1}} disabled={enviandoPed} onClick={enviarPedido}>{enviandoPed?"⟳ Enviando...":"📤 Solicitar a todos los fletes"}</button>
        </div>
      )}

      {subFl==="mis"&&(
        <div>
          <div style={{display:"flex",justifyContent:"flex-end",marginBottom:14}}>
            <button style={S.btn("dark")} onClick={()=>setSubFl("pedir")}>➕ Nuevo pedido</button>
          </div>
          {misPedidos.length===0&&<div style={{...S.card,color:C.textoSuave,textAlign:"center",padding:28,fontStyle:"italic"}}>No hiciste pedidos de flete todavía. Tocá "➕ Nuevo pedido" arriba para hacer el primero.</div>}
          {misPedidos.length>0&&<div style={{fontFamily:"'Lato',sans-serif",fontWeight:700,color:C.marron,fontSize:20,marginBottom:12}}>📋 Mis pedidos de flete ({misPedidos.length})</div>}
          {misPedidos.map(p=>{
            const abierto=selPedido&&selPedido.id===p.id;
            return(
            <div key={p.id} style={S.card}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}
                onClick={()=>{ if(abierto){setSelPedido(null);} else {abrirMiPedido(p);} }}>
                <div>
                  <div style={{fontFamily:"'Lato',sans-serif",fontWeight:700,color:C.marron,fontSize:18}}>{p.origen} → {p.destino}{p._msjNuevo&&<span style={{marginLeft:8,fontSize:12,fontWeight:700,color:"#fff",background:"#009966",borderRadius:0,padding:"2px 8px",fontFamily:"'Lato',sans-serif",verticalAlign:"middle"}}>💬 Mensaje nuevo</span>}</div>
                  <div style={{fontSize:17,color:C.textoSuave}}>{p.fecha_deseada?new Date(p.fecha_deseada+"T12:00").toLocaleDateString("es-AR"):"Sin fecha definida"} · {new Date(p.created_at).toLocaleDateString("es-AR")}</div>
                  {p.fecha_limite&&<div style={{marginTop:4}}><AvisoVence fechaLimite={p.fecha_limite}/></div>}
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{whiteSpace:"nowrap",background:p._cantCot>0?C.verde:C.suave,color:p._cantCot>0?"#fff":C.textoSuave,fontSize:13,fontWeight:700,padding:"5px 10px",borderRadius:0,fontFamily:"'Lato',sans-serif"}}>
                    {p._cantCot>0?`${p._cantCot} cotización${p._cantCot>1?"es":""}`:"Sin cotizaciones"}
                  </span>
                  <span style={{color:C.textoSuave,fontSize:18}}>{abierto?"▲":"▼"}</span>
                </div>
              </div>
              {abierto&&(
                <div style={{marginTop:12,borderTop:`1px dashed ${C.borde}`,paddingTop:12}} className="fade">
                  <div style={{fontWeight:700,color:C.marron,marginBottom:8}}>💰 Cotizaciones de fletes</div>
                  {cotizacionesFlete.length===0?(
                    <div style={{color:C.textoSuave,textAlign:"center",padding:20,fontStyle:"italic"}}>⏳ Esperando cotizaciones...</div>
                  ):(
                    cotizacionesFlete.filter(ct=>!archivadosCotFlete.has(ct.id)).map((ct,i)=>{
                      const key=ct.id||i;
                      const abiertaCot=fleteAbierto===key;
                      return(
                      <div key={key} style={{border:`1px solid ${abiertaCot?C.acento:C.borde}`,borderRadius:0,marginBottom:10,overflow:"hidden",background:C.input}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 14px",cursor:"pointer"}}
                          onClick={()=>{const ab=abiertaCot?null:key;setFleteAbierto(ab);if(ab){marcarCotVista("cotizaciones_flete","visto_solicitante",ct);setCotizacionesFlete(cs=>cs.map(x=>x.id===ct.id?{...x,visto_solicitante:true}:x));cargarMisPedidos();}}}>
                          <b style={{color:C.marron,fontSize:17}}>🚚 {ct.fleteNombre||"Flete"}{ct.visto_solicitante===false&&<span style={{marginLeft:8,fontSize:12,fontWeight:700,color:"#fff",background:"#009966",borderRadius:0,padding:"2px 8px",fontFamily:"'Lato',sans-serif",verticalAlign:"middle"}}>NUEVO</span>}</b>
                          <div style={{display:"flex",alignItems:"center",gap:10}}>
                            <b style={{color:C.verde,fontSize:16}}>{fmtPeso(ct.precio_total)}</b>
                            <span style={{color:C.textoSuave,fontSize:16}}>{abiertaCot?"▲":"▼"}</span>
                          </div>
                        </div>
                        {abiertaCot&&(
                        <div style={{padding:"0 14px 14px",borderTop:`1px dashed ${C.borde}`}} className="fade">
                          <div style={{marginTop:12}}>
                            <PresupuestoFormato
                              empresa={ct.fleteObj||{}}
                              cliente={{...usuario,mostrar_telefono:true,mostrar_direccion:true}}
                              items={ct.items||[]}
                              opts={{descuento_tipo:ct.descuento_tipo,descuento_valor:ct.descuento_valor,iva_pct:ct.iva_porcentaje}}
                              numero={ct.numero_presupuesto!=null?ct.numero_presupuesto:""}
                              fecha={ct.created_at?new Date(ct.created_at).toLocaleDateString("es-AR"):null}
                              tiempoEntrega={ct.tiempo_entrega}
                              esEmpresa={false}
                              aceptado={false}
                            />
                          </div>
                          <div style={{marginTop:10}}>
                            <Chat key={ct.flete_id} pedidoId={selPedido.id} tipoPedido="flete" miUsuario={usuario} otroUsuario={{id:ct.flete_id}} onLeido={cargarMisPedidos} titulo={"Chat con "+(ct.fleteNombre||"flete")}/>
                          </div>
                          <div style={{textAlign:"right",marginTop:10,paddingTop:10,borderTop:`1px dashed ${C.borde}`}}><button style={{...S.btn("ghost"),fontSize:14,padding:"6px 12px",color:C.textoSuave}} onClick={(e)=>{e.stopPropagation();archivarCotFlete(ct);}}>🗑️ Archivar esta cotización</button></div>
                        </div>
                        )}
                      </div>
                      );
                    })
                  )}
                </div>
              )}
            </div>
            );
          })}
        </div>
      )}
    </div>
  );
}


// ─── VISTA FERRETERÍA ─────────────────────────────────────────────────────────
function VistaFerreteria({usuario,notif}){
  const [pedidos,setPedidos]=useState([]);
  const [sel,setSel]=useState(null);
  useEffect(()=>{const h=()=>setSel(null);window.addEventListener("encastre-ir-principal",h);return()=>window.removeEventListener("encastre-ir-principal",h);},[]);
  const [cotF,setCotF]=useState({items:[{descripcion:"",precio:"",cantidad:"1"}],tiempo:"",usarDesc:false,descTipo:"porcentaje",descValor:"",usarIva:false,ivaPct:"21"});
  const [miCot,setMiCot]=useState(null);
  const [carpSel,setCarpSel]=useState({});
  const [enviando,setEnviando]=useState(false);
  const [yaEnvio,setYaEnvio]=useState(false);
  const [filtro,setFiltro]=useState("cotizar");
  // Precargar la cotización con los herrajes que pidió la carpintería (si no cotizó aún)
  useEffect(()=>{
    if(!sel||miCot||yaEnvio)return;
    try{
      let its=[];
      try{ its=Array.isArray(sel.items)?sel.items:JSON.parse(sel.items||"[]"); }catch{its=[];}
      if(!its.length)return;
      const items=its.map(it=>({descripcion:it.descripcion||"",precio:"",cantidad:String(it.cantidad||1)}));
      setCotF(f=>({...f,items}));
    }catch{}
  },[sel,miCot,yaEnvio]);

  const cargar=useCallback(async()=>{
    try{
      const d=await db.select("pedidos_ferreteria","?order=created_at.desc");
      let mias={};
      try{
        const mc=await db.select("cotizaciones_ferreteria",`?ferreteria_id=eq.${usuario.id}&select=pedido_id`);
        mc.forEach(c=>{mias[c.pedido_id]=true;});
      }catch{}
      let vistos=new Set();
      try{
        const vs=await db.select("vistas_pedido",`?usuario_id=eq.${usuario.id}&tipo_pedido=eq.ferreteria&select=pedido_id`);
        vs.forEach(v=>vistos.add(v.pedido_id));
      }catch{}
      let conMsj=new Set();
      if(d.length){
        try{
          const idsPed=d.map(p=>p.id).join(",");
          const msjs=await db.select("mensajes",`?pedido_id=in.(${idsPed})&tipo_pedido=eq.ferreteria&para_usuario_id=eq.${usuario.id}&leido=eq.false&select=pedido_id`);
          msjs.forEach(m=>conMsj.add(m.pedido_id));
        }catch{}
      }
      setPedidos(d.map(p=>({...p,_miEstado:mias[p.id]?"cotizado":null,_nuevo:!vistos.has(p.id),_msjNuevo:conMsj.has(p.id)})));
    }catch{}
  },[usuario.id]);
  useEffect(()=>{cargar();const t=setInterval(cargar,15000);return()=>clearInterval(t);},[cargar]);

  const abrirPedido=async(p)=>{
    setSel(p); setYaEnvio(false); setMiCot(null);
    if(p._nuevo){ marcarPedidoVisto("ferreteria",p.id,usuario.id); setPedidos(ps=>ps.map(x=>x.id===p.id?{...x,_nuevo:false}:x)); }
    try{
      const d=await db.select("cotizaciones_ferreteria",`?pedido_id=eq.${p.id}&ferreteria_id=eq.${usuario.id}&limit=1`);
      if(d&&d.length>0){
        let items=[];
        try{ items=Array.isArray(d[0].presupuesto_items)?d[0].presupuesto_items:JSON.parse(d[0].presupuesto_items||"[]"); }catch{items=[];}
        setMiCot({...d[0],items});
        setYaEnvio(true);
      }
      try{ const cp=await db.select("usuarios",`?id=eq.${p.carpinteria_id}&limit=1`); setCarpSel(cp[0]||{}); }catch{}
    }catch{}
  };

  const enviarCot=async()=>{
    if(!sel||enviando||yaEnvio)return;
    if(estaVencido(sel)){alert("Este pedido venció: ya no se pueden enviar cotizaciones.");return;}
    const itemsValidos=(cotF.items||[]).filter(it=>it.descripcion.trim()&&nmb(it.precio)>0&&nmb(it.cantidad)>0);
    if(itemsValidos.length===0){alert("Cargá al menos un ítem con descripción, precio y cantidad.");return;}
    setEnviando(true);
    try{
      let numero=1;
      try{
        const prev=await db.select("cotizaciones_ferreteria",`?ferreteria_id=eq.${usuario.id}&select=numero_presupuesto&order=numero_presupuesto.desc.nullslast&limit=1`);
        if(prev&&prev.length>0&&prev[0].numero_presupuesto!=null) numero=Number(prev[0].numero_presupuesto)+1;
      }catch{}
      const calc=calcularPresup(itemsValidos,cotF);
      const datos={
        pedido_id:sel.id, ferreteria_id:usuario.id, numero_presupuesto:numero,
        precio_total:calc.total,
        descuento_tipo:cotF.usarDesc?cotF.descTipo:null,
        descuento_valor:cotF.usarDesc?nmb(cotF.descValor):null,
        iva_porcentaje:cotF.usarIva?nmb(cotF.ivaPct):null,
        tiempo_entrega:cotF.tiempo,
        presupuesto_items:itemsValidos.map((it)=>({descripcion:it.descripcion.trim(),precio:nmb(it.precio),cantidad:nmb(it.cantidad),importe:nmb(it.precio)*nmb(it.cantidad)}))
      };
      await db.insert("cotizaciones_ferreteria",datos);
      // NO se toca el estado global del pedido: sobre cerrado — cada ferretería ve solo su propio estado.
      notif("¡Cotización enviada!");
      (async()=>{try{const c=await db.select("usuarios",`?id=eq.${sel.carpinteria_id}&recibir_avisos=eq.true&select=email,nombre`);if(c&&c[0]&&c[0].email){const msg="<p>Recibiste una <strong>nueva cotización</strong> de una ferretería en Encastre.</p>";db.avisarPorMail(c[0].email,c[0].nombre,"Recibiste una cotización - Encastre",msg);}}catch(e){}})();
      setCotF({items:[{descripcion:"",precio:"",cantidad:"1"}],tiempo:"",usarDesc:false,descTipo:"porcentaje",descValor:"",usarIva:false,ivaPct:"21"});
      setYaEnvio(true);
      setMiCot({...datos,items:datos.presupuesto_items,created_at:new Date().toISOString()});
      setPedidos(ps=>ps.map(p=>p.id===sel.id?{...p,_miEstado:"cotizado"}:p));
    }catch(e){alert("Error: "+e.message);}
    setEnviando(false);
  };

  if(sel){
    return(
    <div className="fade">
      <button style={{...S.btn("ghost"),marginBottom:14}} onClick={()=>setSel(null)}>← Volver</button>
      <div style={S.card}>
        <PedidoFormato
          solicitante={carpSel||{}}
          titulo="Pedido de herrajes"
          fecha={sel.created_at?new Date(sel.created_at).toLocaleDateString("es-AR"):null}
          columnas={["Herraje","Cantidad"]}
          filas={(()=>{
            let its=[];
            try{ its=Array.isArray(sel.items)?sel.items:JSON.parse(sel.items||"[]"); }catch{its=[];}
            if(!its.length&&sel.descripcion){ its=[{descripcion:sel.descripcion,cantidad:sel.cantidad||1}]; }
            return its.map(it=>[it.descripcion,`${it.cantidad} u`]);
          })()}
          notas={sel.notas}
          fechaLimite={sel.fecha_limite?new Date(sel.fecha_limite).toLocaleDateString("es-AR"):null}
        />

      {miCot?(
      <div style={{marginTop:20,paddingTop:20,borderTop:`2px dashed ${C.borde}`}}>
        <div style={S.cardTitle}>✅ Cotización enviada</div>
        <div style={{fontSize:15,color:C.textoSuave,marginBottom:10}}>Así la ve la carpintería:</div>
        <PresupuestoFormato
          empresa={usuario}
          cliente={{...carpSel,mostrar_telefono:true,mostrar_direccion:true}}
          items={miCot.items||[]}
          opts={{descuento_tipo:miCot.descuento_tipo,descuento_valor:miCot.descuento_valor,iva_pct:miCot.iva_porcentaje}}
          numero={miCot.numero_presupuesto!=null?miCot.numero_presupuesto:""}
          fecha={miCot.created_at?new Date(miCot.created_at).toLocaleDateString("es-AR"):null}
          tiempoEntrega={miCot.tiempo_entrega}
          esEmpresa={true}
          aceptado={false}
        />
      </div>
      ):estaVencido(sel)?(
      <div style={{marginTop:20,paddingTop:20,borderTop:`2px dashed ${C.borde}`,textAlign:"center"}}>
        <div style={{fontSize:32,marginBottom:8}}>⛔</div>
        <div style={{fontFamily:"'Lato',sans-serif",fontSize:19,color:"#B23A2E",fontWeight:700}}>Este pedido venció</div>
        <div style={{fontSize:16,color:C.textoSuave,marginTop:6}}>Se puso una fecha límite que ya pasó, así que no se pueden enviar cotizaciones.</div>
      </div>
      ):(
      <div style={{marginTop:20,paddingTop:20,borderTop:`2px dashed ${C.borde}`}}>
        <div style={S.cardTitle}>💰 Tu cotización</div>
        {(() => {
          const calc=calcularPresup(cotF.items,cotF);
          const setItem=(i,campo,val)=>setCotF(f=>{const its=[...f.items];its[i]={...its[i],[campo]:val};return{...f,items:its};});
          const addItem=()=>setCotF(f=>({...f,items:[...f.items,{descripcion:"",precio:"",cantidad:"1"}]}));
          const delItem=(i)=>setCotF(f=>({...f,items:f.items.length>1?f.items.filter((_,j)=>j!==i):f.items}));
          return(
          <div>
            <div style={{fontSize:14,color:C.textoSuave,marginBottom:10}}>Agregá un renglón por cada herraje (bisagras, rieles, manijas, flete si lo cobrás, etc.).</div>
            {cotF.items.map((it,i)=>{
              const imp=nmb(it.precio)*nmb(it.cantidad);
              return(
              <div key={i} style={{padding:"12px 0",borderBottom:`1px dashed ${C.borde}`}}>
                <div style={{marginBottom:8}}>
                  <label style={S.label}>Descripción</label>
                  <input value={it.descripcion} onChange={e=>setItem(i,"descripcion",e.target.value)} placeholder="Ej: Bisagra de piano 180cm" style={S.input}/>
                </div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end"}}>
                  <div style={{flex:1,minWidth:110}}>
                    <label style={S.label}>Precio ($)</label>
                    <input type="number" value={it.precio} onChange={e=>setItem(i,"precio",e.target.value)} placeholder="0" style={S.input}/>
                  </div>
                  <div style={{flex:"0 0 90px"}}>
                    <label style={S.label}>Cantidad</label>
                    <input type="number" value={it.cantidad} onChange={e=>setItem(i,"cantidad",e.target.value)} placeholder="1" style={S.input}/>
                  </div>
                  <div style={{flex:1,minWidth:110,textAlign:"right"}}>
                    <label style={S.label}>Importe</label>
                    <div style={{fontWeight:800,color:C.marron,fontSize:17,padding:"10px 0"}}>{fmtPeso(imp)}</div>
                  </div>
                </div>
                {cotF.items.length>1&&<button onClick={()=>delItem(i)} style={{...S.btn("ghost"),color:C.error,borderColor:C.error,fontSize:14,padding:"5px 10px",marginTop:6,minHeight:"auto"}}>🗑️ Quitar renglón</button>}
              </div>
              );
            })}
            <button onClick={addItem} style={{...S.btn("ghost"),width:"100%",justifyContent:"center",marginBottom:14}}>＋ Agregar renglón</button>

            <div style={{marginBottom:12}}>
              <label style={S.label}>Tiempo de entrega <span style={{fontWeight:400,color:C.textoSuave}}>(opcional)</span></label>
              <input value={cotF.tiempo} onChange={e=>setCotF(f=>({...f,tiempo:e.target.value}))} placeholder="Ej: 2 días" style={S.input}/>
            </div>

            <div style={{border:`1px solid ${C.borde}`,borderRadius:0,padding:10,marginBottom:10}}>
              <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:16,color:C.marron,fontWeight:700}}>
                <input type="checkbox" checked={cotF.usarDesc} onChange={e=>setCotF(f=>({...f,usarDesc:e.target.checked}))}/>
                Aplicar descuento
              </label>
              {cotF.usarDesc&&(
                <div style={{display:"flex",gap:8,marginTop:8,alignItems:"flex-end"}}>
                  <div style={{flex:"0 0 140px"}}>
                    <label style={S.label}>Tipo</label>
                    <select value={cotF.descTipo} onChange={e=>setCotF(f=>({...f,descTipo:e.target.value}))} style={S.input}>
                      <option value="porcentaje">Porcentaje (%)</option>
                      <option value="monto">Monto fijo ($)</option>
                    </select>
                  </div>
                  <div style={{flex:1}}>
                    <label style={S.label}>{cotF.descTipo==="porcentaje"?"% de descuento":"Monto ($)"}</label>
                    <input type="number" value={cotF.descValor} onChange={e=>setCotF(f=>({...f,descValor:e.target.value}))} placeholder="0" style={S.input}/>
                  </div>
                </div>
              )}
            </div>

            <div style={{border:`1px solid ${C.borde}`,borderRadius:0,padding:10,marginBottom:14}}>
              <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:16,color:C.marron,fontWeight:700}}>
                <input type="checkbox" checked={cotF.usarIva} onChange={e=>setCotF(f=>({...f,usarIva:e.target.checked}))}/>
                Agregar IVA
              </label>
              {cotF.usarIva&&(
                <div style={{marginTop:8}}>
                  <label style={S.label}>% de IVA</label>
                  <input type="number" value={cotF.ivaPct} onChange={e=>setCotF(f=>({...f,ivaPct:e.target.value}))} placeholder="21" style={{...S.input,maxWidth:160}}/>
                </div>
              )}
            </div>

            <div style={{marginBottom:12}}><label style={S.label}>Detalle / condiciones <span style={{fontWeight:400,color:C.textoSuave}}>(opcional)</span></label>
              <textarea value={cotF.detalle||""} onChange={e=>setCotF(f=>({...f,detalle:e.target.value}))} placeholder="Marcas, modelos, observaciones..." style={{...S.input,minHeight:56,resize:"vertical"}}/>
            </div>

            <div style={{background:C.suave,borderRadius:0,padding:12,border:`1px solid ${C.borde}`,marginBottom:12}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:6,fontSize:16}}><span style={{color:C.textoSuave}}>Subtotal</span><b>{fmtPeso(calc.subtotal)}</b></div>
              {cotF.usarDesc&&calc.descuento>0&&<div style={{display:"flex",justifyContent:"space-between",marginBottom:6,fontSize:16,color:C.error}}><span>Descuento{cotF.descTipo==="porcentaje"?` (${nmb(cotF.descValor)}%)`:""}</span><b>− {fmtPeso(calc.descuento)}</b></div>}
              {cotF.usarIva&&<div style={{display:"flex",justifyContent:"space-between",marginBottom:6,fontSize:16}}><span style={{color:C.textoSuave}}>IVA ({nmb(cotF.ivaPct)}%)</span><b>{fmtPeso(calc.iva)}</b></div>}
              <div style={{display:"flex",justifyContent:"space-between",borderTop:`2px solid ${C.verde}`,paddingTop:8,marginTop:4}}><span style={{fontWeight:800,fontSize:19,color:C.marron}}>TOTAL</span><b style={{fontWeight:800,fontSize:22,color:C.verde}}>{fmtPeso(calc.total)}</b></div>
            </div>

            <button style={{...S.btn("dark"),opacity:enviando||yaEnvio?0.6:1}} onClick={enviarCot} disabled={enviando||yaEnvio}>
              {enviando?"⟳ Enviando...":(yaEnvio?"✅ Cotización enviada":"📤 Enviar cotización")}
            </button>
          </div>
          );
        })()}
      </div>
      )}

      <Chat pedidoId={sel.id} tipoPedido="ferreteria" miUsuario={usuario} otroUsuario={{id:sel.carpinteria_id}} onLeido={cargar} titulo="Chat con carpintería"/>
      </div>
    </div>
    );
  }

  const cuenta={
    cotizar:pedidos.filter(p=>!p._miEstado&&!estaVencido(p)).length,
    cotizados:pedidos.filter(p=>p._miEstado).length,
    vencido:pedidos.filter(p=>estaVencido(p)&&!p._miEstado).length,
    todos:pedidos.length,
  };
  const lista=pedidos.filter(p=>{
    if(filtro==="cotizar")return !p._miEstado&&!estaVencido(p);
    if(filtro==="cotizados")return !!p._miEstado;
    if(filtro==="vencido")return estaVencido(p)&&!p._miEstado;
    return true;
  });

  return(
    <div>
      <div style={S.secTitle}>Pedidos de herrajes de carpinterías</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
        {[["cotizar","Para cotizar"],["cotizados","Cotizados"],["vencido","Vencidos"],["todos","Todos"]].map(([id,l])=>(
          <button key={id} style={{...S.btn(filtro===id?"dark":"ghost"),fontSize:15,padding:"6px 12px"}} onClick={()=>setFiltro(id)}>{l} {cuenta[id]}</button>
        ))}
      </div>
      {pedidos.length===0&&<div style={{...S.card,color:C.textoSuave,textAlign:"center",padding:28,fontStyle:"italic"}}>No hay pedidos aún</div>}
      {pedidos.length>0&&lista.length===0&&<div style={{...S.card,color:C.textoSuave,textAlign:"center",padding:24,fontStyle:"italic"}}>No hay pedidos en esta categoría</div>}
      {lista.map(p=>{
        const et=p._miEstado?{t:"Cotizado por mí",bg:C.acento,fg:C.marron}:estaVencido(p)?{t:"Vencido",bg:"#B23A2E",fg:"#fff"}:{t:"Para cotizar",bg:C.marron,fg:C.crema};
        return(
        <div key={p.id} style={{...S.card,cursor:"pointer",transition:"all .15s",borderColor:p._nuevo?"#009966":"#8B451399",borderWidth:p._nuevo?2:1}} onClick={()=>abrirPedido(p)}
          onMouseEnter={e=>{e.currentTarget.style.borderColor=C.acento;e.currentTarget.style.transform="translateY(-1px)";}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor=p._nuevo?"#009966":C.borde;e.currentTarget.style.transform="none";}}>
          <div style={{display:"flex",justifyContent:"space-between"}}>
            <div>
              <div style={{fontFamily:"'Lato',sans-serif",fontWeight:700,color:C.marron,fontSize:21}}>{p.descripcion}<TagNuevo on={p._nuevo}/><TagMsjNuevo on={p._msjNuevo}/></div>
              <div style={{fontSize:17,color:C.textoSuave,marginTop:3}}>{Array.isArray(p.items)&&p.items.length>0?`${p.items.length} ítem${p.items.length>1?"s":""}`:`Cantidad: ${p.cantidad}`} · {new Date(p.created_at).toLocaleDateString("es-AR")}</div>
              {p.fecha_limite&&<div style={{marginTop:4}}><AvisoVence fechaLimite={p.fecha_limite}/></div>}
            </div>
            <span style={{alignSelf:"flex-start",whiteSpace:"nowrap",background:et.bg,color:et.fg,fontSize:13,fontWeight:700,padding:"5px 10px",borderRadius:0,fontFamily:"'Lato',sans-serif"}}>{et.t}</span>
          </div>
        </div>
        );
      })}
    </div>
  );
}

// ─── VISTA PINTURERÍA ─────────────────────────────────────────────────────────
function VistaPintureria({usuario,notif}){
  const [pedidos,setPedidos]=useState([]);
  const [sel,setSel]=useState(null);
  useEffect(()=>{const h=()=>setSel(null);window.addEventListener("encastre-ir-principal",h);return()=>window.removeEventListener("encastre-ir-principal",h);},[]);
  const [cotF,setCotF]=useState({items:[{descripcion:"",precio:"",cantidad:"1"}],tiempo:"",usarDesc:false,descTipo:"porcentaje",descValor:"",usarIva:false,ivaPct:"21"});
  const [miCot,setMiCot]=useState(null);
  const [carpSel,setCarpSel]=useState({});
  const [enviando,setEnviando]=useState(false);
  const [yaEnvio,setYaEnvio]=useState(false);
  const [filtro,setFiltro]=useState("cotizar");
  // Precargar la cotización con las pinturas que pidió la carpintería (si no cotizó aún)
  useEffect(()=>{
    if(!sel||miCot||yaEnvio)return;
    try{
      let its=[];
      try{ its=Array.isArray(sel.items)?sel.items:JSON.parse(sel.items||"[]"); }catch{its=[];}
      if(!its.length)return;
      const items=its.map(it=>({descripcion:it.descripcion||"",precio:"",cantidad:String(it.litros||it.cantidad||1)}));
      setCotF(f=>({...f,items}));
    }catch{}
  },[sel,miCot,yaEnvio]);

  const cargar=useCallback(async()=>{
    try{
      const d=await db.select("pedidos_pintureria","?order=created_at.desc");
      let mias={};
      try{
        const mc=await db.select("cotizaciones_pintureria",`?pintureria_id=eq.${usuario.id}&select=pedido_id`);
        mc.forEach(c=>{mias[c.pedido_id]=true;});
      }catch{}
      let vistos=new Set();
      try{
        const vs=await db.select("vistas_pedido",`?usuario_id=eq.${usuario.id}&tipo_pedido=eq.pintureria&select=pedido_id`);
        vs.forEach(v=>vistos.add(v.pedido_id));
      }catch{}
      let conMsj=new Set();
      if(d.length){
        try{
          const idsPed=d.map(p=>p.id).join(",");
          const msjs=await db.select("mensajes",`?pedido_id=in.(${idsPed})&tipo_pedido=eq.pintureria&para_usuario_id=eq.${usuario.id}&leido=eq.false&select=pedido_id`);
          msjs.forEach(m=>conMsj.add(m.pedido_id));
        }catch{}
      }
      setPedidos(d.map(p=>({...p,_miEstado:mias[p.id]?"cotizado":null,_nuevo:!vistos.has(p.id),_msjNuevo:conMsj.has(p.id)})));
    }catch{}
  },[usuario.id]);
  useEffect(()=>{cargar();const t=setInterval(cargar,15000);return()=>clearInterval(t);},[cargar]);

  const abrirPedido=async(p)=>{
    setSel(p); setYaEnvio(false); setMiCot(null);
    if(p._nuevo){ marcarPedidoVisto("pintureria",p.id,usuario.id); setPedidos(ps=>ps.map(x=>x.id===p.id?{...x,_nuevo:false}:x)); }
    try{
      const d=await db.select("cotizaciones_pintureria",`?pedido_id=eq.${p.id}&pintureria_id=eq.${usuario.id}&limit=1`);
      if(d&&d.length>0){
        let items=[];
        try{ items=Array.isArray(d[0].presupuesto_items)?d[0].presupuesto_items:JSON.parse(d[0].presupuesto_items||"[]"); }catch{items=[];}
        setMiCot({...d[0],items});
        setYaEnvio(true);
      }
      try{ const cp=await db.select("usuarios",`?id=eq.${p.carpinteria_id}&limit=1`); setCarpSel(cp[0]||{}); }catch{}
    }catch{}
  };

  const enviarCot=async()=>{
    if(!sel||enviando||yaEnvio)return;
    if(estaVencido(sel)){alert("Este pedido venció: ya no se pueden enviar cotizaciones.");return;}
    const itemsValidos=(cotF.items||[]).filter(it=>it.descripcion.trim()&&nmb(it.precio)>0&&nmb(it.cantidad)>0);
    if(itemsValidos.length===0){alert("Cargá al menos un ítem con descripción, precio y cantidad.");return;}
    setEnviando(true);
    try{
      let numero=1;
      try{
        const prev=await db.select("cotizaciones_pintureria",`?pintureria_id=eq.${usuario.id}&select=numero_presupuesto&order=numero_presupuesto.desc.nullslast&limit=1`);
        if(prev&&prev.length>0&&prev[0].numero_presupuesto!=null) numero=Number(prev[0].numero_presupuesto)+1;
      }catch{}
      const calc=calcularPresup(itemsValidos,cotF);
      const datos={
        pedido_id:sel.id, pintureria_id:usuario.id, numero_presupuesto:numero,
        precio_total:calc.total,
        descuento_tipo:cotF.usarDesc?cotF.descTipo:null,
        descuento_valor:cotF.usarDesc?nmb(cotF.descValor):null,
        iva_porcentaje:cotF.usarIva?nmb(cotF.ivaPct):null,
        tiempo_entrega:cotF.tiempo,
        presupuesto_items:itemsValidos.map((it)=>({descripcion:it.descripcion.trim(),precio:nmb(it.precio),cantidad:nmb(it.cantidad),importe:nmb(it.precio)*nmb(it.cantidad)}))
      };
      await db.insert("cotizaciones_pintureria",datos);
      // NO se toca el estado global del pedido: sobre cerrado — cada pinturería ve solo su propio estado.
      notif("¡Cotización enviada!");
      (async()=>{try{const c=await db.select("usuarios",`?id=eq.${sel.carpinteria_id}&recibir_avisos=eq.true&select=email,nombre`);if(c&&c[0]&&c[0].email){const msg="<p>Recibiste una <strong>nueva cotización</strong> de una pinturería en Encastre.</p>";db.avisarPorMail(c[0].email,c[0].nombre,"Recibiste una cotización - Encastre",msg);}}catch(e){}})();
      setCotF({items:[{descripcion:"",precio:"",cantidad:"1"}],tiempo:"",usarDesc:false,descTipo:"porcentaje",descValor:"",usarIva:false,ivaPct:"21"});
      setYaEnvio(true);
      setMiCot({...datos,items:datos.presupuesto_items,created_at:new Date().toISOString()});
      setPedidos(ps=>ps.map(p=>p.id===sel.id?{...p,_miEstado:"cotizado"}:p));
    }catch(e){alert("Error: "+e.message);}
    setEnviando(false);
  };

  if(sel){
    return(
    <div className="fade">
      <button style={{...S.btn("ghost"),marginBottom:14}} onClick={()=>setSel(null)}>← Volver</button>
      <div style={S.card}>
        <PedidoFormato
          solicitante={carpSel||{}}
          titulo="Pedido de pinturas"
          fecha={sel.created_at?new Date(sel.created_at).toLocaleDateString("es-AR"):null}
          columnas={["Pintura","Litros"]}
          filas={(()=>{
            let its=[];
            try{ its=Array.isArray(sel.items)?sel.items:JSON.parse(sel.items||"[]"); }catch{its=[];}
            if(!its.length&&sel.descripcion){ its=[{descripcion:sel.descripcion,litros:sel.litros||1}]; }
            return its.map(it=>[it.descripcion,`${it.litros||it.cantidad||"—"} L`]);
          })()}
          notas={sel.notas}
          fechaLimite={sel.fecha_limite?new Date(sel.fecha_limite).toLocaleDateString("es-AR"):null}
        />

      {miCot?(
      <div style={{marginTop:20,paddingTop:20,borderTop:`2px dashed ${C.borde}`}}>
        <div style={S.cardTitle}>✅ Cotización enviada</div>
        <div style={{fontSize:15,color:C.textoSuave,marginBottom:10}}>Así la ve la carpintería:</div>
        <PresupuestoFormato
          empresa={usuario}
          cliente={{...carpSel,mostrar_telefono:true,mostrar_direccion:true}}
          items={miCot.items||[]}
          opts={{descuento_tipo:miCot.descuento_tipo,descuento_valor:miCot.descuento_valor,iva_pct:miCot.iva_porcentaje}}
          numero={miCot.numero_presupuesto!=null?miCot.numero_presupuesto:""}
          fecha={miCot.created_at?new Date(miCot.created_at).toLocaleDateString("es-AR"):null}
          tiempoEntrega={miCot.tiempo_entrega}
          esEmpresa={true}
          aceptado={false}
        />
      </div>
      ):estaVencido(sel)?(
      <div style={{marginTop:20,paddingTop:20,borderTop:`2px dashed ${C.borde}`,textAlign:"center"}}>
        <div style={{fontSize:32,marginBottom:8}}>⛔</div>
        <div style={{fontFamily:"'Lato',sans-serif",fontSize:19,color:"#B23A2E",fontWeight:700}}>Este pedido venció</div>
        <div style={{fontSize:16,color:C.textoSuave,marginTop:6}}>Se puso una fecha límite que ya pasó, así que no se pueden enviar cotizaciones.</div>
      </div>
      ):(
      <div style={{marginTop:20,paddingTop:20,borderTop:`2px dashed ${C.borde}`}}>
        <div style={S.cardTitle}>💰 Tu cotización</div>
        {(() => {
          const calc=calcularPresup(cotF.items,cotF);
          const setItem=(i,campo,val)=>setCotF(f=>{const its=[...f.items];its[i]={...its[i],[campo]:val};return{...f,items:its};});
          const addItem=()=>setCotF(f=>({...f,items:[...f.items,{descripcion:"",precio:"",cantidad:"1"}]}));
          const delItem=(i)=>setCotF(f=>({...f,items:f.items.length>1?f.items.filter((_,j)=>j!==i):f.items}));
          return(
          <div>
            <div style={{fontSize:14,color:C.textoSuave,marginBottom:10}}>Agregá un renglón por cada producto (pintura, barniz, mano de obra, flete si lo cobrás, etc.).</div>
            {cotF.items.map((it,i)=>{
              const imp=nmb(it.precio)*nmb(it.cantidad);
              return(
              <div key={i} style={{padding:"12px 0",borderBottom:`1px dashed ${C.borde}`}}>
                <div style={{marginBottom:8}}>
                  <label style={S.label}>Descripción</label>
                  <input value={it.descripcion} onChange={e=>setItem(i,"descripcion",e.target.value)} placeholder="Ej: Laca poliuretánica mate 4L" style={S.input}/>
                </div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end"}}>
                  <div style={{flex:1,minWidth:110}}>
                    <label style={S.label}>Precio ($)</label>
                    <input type="number" value={it.precio} onChange={e=>setItem(i,"precio",e.target.value)} placeholder="0" style={S.input}/>
                  </div>
                  <div style={{flex:"0 0 90px"}}>
                    <label style={S.label}>Cantidad</label>
                    <input type="number" value={it.cantidad} onChange={e=>setItem(i,"cantidad",e.target.value)} placeholder="1" style={S.input}/>
                  </div>
                  <div style={{flex:1,minWidth:110,textAlign:"right"}}>
                    <label style={S.label}>Importe</label>
                    <div style={{fontWeight:800,color:C.marron,fontSize:17,padding:"10px 0"}}>{fmtPeso(imp)}</div>
                  </div>
                </div>
                {cotF.items.length>1&&<button onClick={()=>delItem(i)} style={{...S.btn("ghost"),color:C.error,borderColor:C.error,fontSize:14,padding:"5px 10px",marginTop:6,minHeight:"auto"}}>🗑️ Quitar renglón</button>}
              </div>
              );
            })}
            <button onClick={addItem} style={{...S.btn("ghost"),width:"100%",justifyContent:"center",marginBottom:14}}>＋ Agregar renglón</button>

            <div style={{marginBottom:12}}>
              <label style={S.label}>Tiempo de entrega <span style={{fontWeight:400,color:C.textoSuave}}>(opcional)</span></label>
              <input value={cotF.tiempo} onChange={e=>setCotF(f=>({...f,tiempo:e.target.value}))} placeholder="Ej: 2 días" style={S.input}/>
            </div>

            <div style={{border:`1px solid ${C.borde}`,borderRadius:0,padding:10,marginBottom:10}}>
              <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:16,color:C.marron,fontWeight:700}}>
                <input type="checkbox" checked={cotF.usarDesc} onChange={e=>setCotF(f=>({...f,usarDesc:e.target.checked}))}/>
                Aplicar descuento
              </label>
              {cotF.usarDesc&&(
                <div style={{display:"flex",gap:8,marginTop:8,alignItems:"flex-end"}}>
                  <div style={{flex:"0 0 140px"}}>
                    <label style={S.label}>Tipo</label>
                    <select value={cotF.descTipo} onChange={e=>setCotF(f=>({...f,descTipo:e.target.value}))} style={S.input}>
                      <option value="porcentaje">Porcentaje (%)</option>
                      <option value="monto">Monto fijo ($)</option>
                    </select>
                  </div>
                  <div style={{flex:1}}>
                    <label style={S.label}>{cotF.descTipo==="porcentaje"?"% de descuento":"Monto ($)"}</label>
                    <input type="number" value={cotF.descValor} onChange={e=>setCotF(f=>({...f,descValor:e.target.value}))} placeholder="0" style={S.input}/>
                  </div>
                </div>
              )}
            </div>

            <div style={{border:`1px solid ${C.borde}`,borderRadius:0,padding:10,marginBottom:14}}>
              <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:16,color:C.marron,fontWeight:700}}>
                <input type="checkbox" checked={cotF.usarIva} onChange={e=>setCotF(f=>({...f,usarIva:e.target.checked}))}/>
                Agregar IVA
              </label>
              {cotF.usarIva&&(
                <div style={{marginTop:8}}>
                  <label style={S.label}>% de IVA</label>
                  <input type="number" value={cotF.ivaPct} onChange={e=>setCotF(f=>({...f,ivaPct:e.target.value}))} placeholder="21" style={{...S.input,maxWidth:160}}/>
                </div>
              )}
            </div>

            <div style={{marginBottom:12}}><label style={S.label}>Detalle / condiciones <span style={{fontWeight:400,color:C.textoSuave}}>(opcional)</span></label>
              <textarea value={cotF.detalle||""} onChange={e=>setCotF(f=>({...f,detalle:e.target.value}))} placeholder="Marcas, colores, acabados, observaciones..." style={{...S.input,minHeight:56,resize:"vertical"}}/>
            </div>

            <div style={{background:C.suave,borderRadius:0,padding:12,border:`1px solid ${C.borde}`,marginBottom:12}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:6,fontSize:16}}><span style={{color:C.textoSuave}}>Subtotal</span><b>{fmtPeso(calc.subtotal)}</b></div>
              {cotF.usarDesc&&calc.descuento>0&&<div style={{display:"flex",justifyContent:"space-between",marginBottom:6,fontSize:16,color:C.error}}><span>Descuento{cotF.descTipo==="porcentaje"?` (${nmb(cotF.descValor)}%)`:""}</span><b>− {fmtPeso(calc.descuento)}</b></div>}
              {cotF.usarIva&&<div style={{display:"flex",justifyContent:"space-between",marginBottom:6,fontSize:16}}><span style={{color:C.textoSuave}}>IVA ({nmb(cotF.ivaPct)}%)</span><b>{fmtPeso(calc.iva)}</b></div>}
              <div style={{display:"flex",justifyContent:"space-between",borderTop:`2px solid ${C.verde}`,paddingTop:8,marginTop:4}}><span style={{fontWeight:800,fontSize:19,color:C.marron}}>TOTAL</span><b style={{fontWeight:800,fontSize:22,color:C.verde}}>{fmtPeso(calc.total)}</b></div>
            </div>

            <button style={{...S.btn("dark"),opacity:enviando||yaEnvio?0.6:1}} onClick={enviarCot} disabled={enviando||yaEnvio}>
              {enviando?"⟳ Enviando...":(yaEnvio?"✅ Cotización enviada":"📤 Enviar cotización")}
            </button>
          </div>
          );
        })()}
      </div>
      )}

      <Chat pedidoId={sel.id} tipoPedido="pintureria" miUsuario={usuario} otroUsuario={{id:sel.carpinteria_id}} onLeido={cargar} titulo="Chat con carpintería"/>
      </div>
    </div>
    );
  }

  const cuenta={
    cotizar:pedidos.filter(p=>!p._miEstado&&!estaVencido(p)).length,
    cotizados:pedidos.filter(p=>p._miEstado).length,
    vencido:pedidos.filter(p=>estaVencido(p)&&!p._miEstado).length,
    todos:pedidos.length,
  };
  const lista=pedidos.filter(p=>{
    if(filtro==="cotizar")return !p._miEstado&&!estaVencido(p);
    if(filtro==="cotizados")return !!p._miEstado;
    if(filtro==="vencido")return estaVencido(p)&&!p._miEstado;
    return true;
  });

  return(
    <div>
      <div style={S.secTitle}>Pedidos de pinturas de carpinterías</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
        {[["cotizar","Para cotizar"],["cotizados","Cotizados"],["vencido","Vencidos"],["todos","Todos"]].map(([id,l])=>(
          <button key={id} style={{...S.btn(filtro===id?"dark":"ghost"),fontSize:15,padding:"6px 12px"}} onClick={()=>setFiltro(id)}>{l} {cuenta[id]}</button>
        ))}
      </div>
      {pedidos.length===0&&<div style={{...S.card,color:C.textoSuave,textAlign:"center",padding:28,fontStyle:"italic"}}>No hay pedidos aún</div>}
      {pedidos.length>0&&lista.length===0&&<div style={{...S.card,color:C.textoSuave,textAlign:"center",padding:24,fontStyle:"italic"}}>No hay pedidos en esta categoría</div>}
      {lista.map(p=>{
        const et=p._miEstado?{t:"Cotizado por mí",bg:C.acento,fg:C.marron}:estaVencido(p)?{t:"Vencido",bg:"#B23A2E",fg:"#fff"}:{t:"Para cotizar",bg:C.marron,fg:C.crema};
        return(
        <div key={p.id} style={{...S.card,cursor:"pointer",transition:"all .15s",borderColor:p._nuevo?"#009966":"#8B451399",borderWidth:p._nuevo?2:1}} onClick={()=>abrirPedido(p)}
          onMouseEnter={e=>{e.currentTarget.style.borderColor=C.acento;e.currentTarget.style.transform="translateY(-1px)";}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor=p._nuevo?"#009966":C.borde;e.currentTarget.style.transform="none";}}>
          <div style={{display:"flex",justifyContent:"space-between"}}>
            <div>
              <div style={{fontFamily:"'Lato',sans-serif",fontWeight:700,color:C.marron,fontSize:21}}>{p.descripcion}<TagNuevo on={p._nuevo}/><TagMsjNuevo on={p._msjNuevo}/></div>
              <div style={{fontSize:17,color:C.textoSuave,marginTop:3}}>{Array.isArray(p.items)&&p.items.length>0?`${p.items.length} ítem${p.items.length>1?"s":""}`:[p.color&&`Color: ${p.color}`,p.litros&&`${p.litros} L`].filter(Boolean).join(" · ")} · {new Date(p.created_at).toLocaleDateString("es-AR")}</div>
              {p.fecha_limite&&<div style={{marginTop:4}}><AvisoVence fechaLimite={p.fecha_limite}/></div>}
            </div>
            <span style={{alignSelf:"flex-start",whiteSpace:"nowrap",background:et.bg,color:et.fg,fontSize:13,fontWeight:700,padding:"5px 10px",borderRadius:0,fontFamily:"'Lato',sans-serif"}}>{et.t}</span>
          </div>
        </div>
        );
      })}
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────

function PantallaBienvenida({onEntrar}){
  const [vista,setVista]=useState("inicio");

  const compartirApp=async()=>{
    const datos={title:"Encastre — La Comunidad de la Madera",text:"Te invito a sumarte a Encastre, la comunidad de la madera 🌳",url:window.location.origin};
    try{
      if(navigator.share){ await navigator.share(datos); }
      else { await navigator.clipboard.writeText(datos.url); alert("¡Link copiado! Ya lo podés pegar en WhatsApp o donde quieras."); }
    }catch(e){ /* el usuario cerró el menú de compartir, no hacemos nada */ }
  };
  if(vista==="manual") return(
    <div style={{maxWidth:640,margin:"0 auto",padding:20}}>
      <button style={{...S.btn("ghost"),marginBottom:16}} onClick={()=>setVista("inicio")}>← Volver</button>
      <div style={{background:C.card,borderRadius:0,padding:24,border:`1px solid ${C.borde}`}}>
        <div style={{fontFamily:"'Lato',sans-serif",fontSize:23,fontWeight:700,color:C.marron,marginBottom:16}}>📖 Manual de Usuario</div>
        <p style={{fontSize:17,color:C.texto,lineHeight:1.7,marginBottom:14}}><b>Encastre — La Comunidad de la Madera</b> reúne en un mismo lugar a todos los actores del rubro: el consumidor final, la carpintería, el aserradero, la ferretería, la pinturería y el flete. La idea es simple: pedir, presupuestar y coordinar trabajos en madera de forma rápida, clara y ordenada — cada presupuesto es un <b>sobre cerrado</b>: nadie ve las cotizaciones de la competencia.</p>

        <div style={{fontFamily:"'Lato',sans-serif",fontSize:18,fontWeight:700,color:C.marron,margin:"6px 0 10px"}}>¿Quién es quién?</div>
        {[
          {e:"🪑",t:"Consumidor Final",d:"Creás un pedido describiendo lo que necesitás, con medidas y hasta una foto de tu croquis. Lo reciben las carpinterías, te mandan presupuestos y vos comparás y elegís el que más te convenga."},
          {e:"🔨",t:"Carpintería",d:"Recibís los pedidos de los clientes y enviás tu presupuesto. Si necesitás materiales, pedís madera a aserraderos, herrajes a ferreterías y pinturas a pinturerías desde la misma app."},
          {e:"🪵",t:"Aserradero",d:"Recibís pedidos de madera de las carpinterías y respondés con tu cotización."},
          {e:"🔩",t:"Ferretería",d:"Recibís pedidos de herrajes y materiales, y cotizás de forma simple y rápida."},
          {e:"🎨",t:"Pinturería",d:"Recibís pedidos de pinturas, barnices, lacas y esmaltes de las carpinterías, y respondés con tu cotización."},
          {e:"🚚",t:"Flete",d:"Gestionás tu agenda de traslados y recibís solicitudes para mover los trabajos."},
        ].map(u=>(<div key={u.t} style={{borderLeft:`3px solid ${C.acento}`,paddingLeft:12,marginBottom:14}}>
          <div style={{fontWeight:700,color:C.marron,fontSize:17}}>{u.e} {u.t}</div>
          <div style={{fontSize:16,color:C.textoSuave,marginTop:3,lineHeight:1.6}}>{u.d}</div>
        </div>))}

        <div style={{fontFamily:"'Lato',sans-serif",fontSize:18,fontWeight:700,color:C.marron,margin:"18px 0 10px"}}>¿Cómo funciona?</div>
        {[
          "Registrate, elegí tu tipo de usuario y cargá tu provincia y localidad.",
          "El cliente crea un pedido con medidas, materiales y, si quiere, una foto del croquis.",

function comprimirFoto(file){
  return new Promise((resolve,reject)=>{
    if(!file){reject(new Error("sin archivo"));return;}
    if(!file.type.startsWith("image/")){reject(new Error("no es imagen"));return;}
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const maxLado=900; let w=img.width,h=img.height;
        if(w>h&&w>maxLado){h=Math.round(h*maxLado/w);w=maxLado;}
        else if(h>=w&&h>maxLado){w=Math.round(w*maxLado/h);h=maxLado;}
        const c=document.createElement("canvas");c.width=w;c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        resolve(c.toDataURL("image/jpeg",0.6));
      };
      img.onerror=()=>reject(new Error("no se pudo leer la imagen"));
      img.src=ev.target.result;
    };
    reader.onerror=()=>reject(new Error("no se pudo leer el archivo"));
    reader.readAsDataURL(file);
  });
}

  const calc=calcularPresup(items,optsCalc);
  const filas=(items||[]).map(it=>({...it,importe:nmb(it.precio)*nmb(it.cantidad)}));
  const linkIg = h => { if(!h)return null; const u=h.replace(/^@/,""); return `https://instagram.com/${u}`; };
  const linkTt = h => { if(!h)return null; const u=h.replace(/^@/,""); return `https://tiktok.com/@${u}`; };
  const web = empresa.web ? (empresa.web.startsWith("http")?empresa.web:`https://${empresa.web}`) : null;
  const th={textAlign:"left",padding:"8px 10px",color:"#fff",background:V,fontSize:14,fontWeight:700,fontFamily:"'Lato',sans-serif"};
  const td={padding:"8px 10px",fontSize:15,color:C.texto,borderBottom:`1px solid ${C.borde}`,verticalAlign:"top"};
  const tdNum={...td,textAlign:"right",fontFamily:"monospace",whiteSpace:"nowrap"};
  const dato=(l,v)=> v?<div style={{fontSize:14,color:C.texto,marginBottom:2}}><span style={{color:C.textoSuave}}>{l}:</span> {v}</div>:null;
  return(
    <div style={{border:`1px solid ${C.borde}`,borderRadius:0,overflow:"hidden",background:"#fff"}}>
      {/* Encabezado verde */}
      <div style={{background:V,color:"#fff",padding:"12px 14px",display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
        <div style={{fontFamily:"'Lato',sans-serif",fontWeight:700,fontSize:20}}>Presupuesto{(numero!==""&&numero!=null)?` N° ${numero}`:""}</div>
        <div style={{fontSize:14,alignSelf:"center"}}>Fecha: {fecha||new Date().toLocaleDateString("es-AR")}</div>
      </div>

      {/* Datos empresa / cliente */}
      <div style={{display:"flex",flexWrap:"wrap",borderBottom:`2px solid ${V}`}}>
        <div style={{flex:1,minWidth:220,padding:"12px 14px",borderRight:`1px solid ${C.borde}`}}>
          <div style={{fontSize:12,fontWeight:700,color:V,textTransform:"uppercase",letterSpacing:.5,marginBottom:6}}>Datos de la empresa</div>
          <div style={{fontFamily:"'Lato',sans-serif",fontWeight:700,fontSize:18,color:C.marron,marginBottom:4}}>{empresa.nombre||"—"}</div>
          {/* datos públicos justo debajo del nombre */}
          <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:6}}>
            {empresa.instagram&&<a href={linkIg(empresa.instagram)} target="_blank" rel="noreferrer" style={{fontSize:13,color:V,textDecoration:"none",fontWeight:700}}>📷 {empresa.instagram}</a>}
            {empresa.tiktok&&<a href={linkTt(empresa.tiktok)} target="_blank" rel="noreferrer" style={{fontSize:13,color:V,textDecoration:"none",fontWeight:700}}>🎵 {empresa.tiktok}</a>}
            {web&&<a href={web} target="_blank" rel="noreferrer" style={{fontSize:13,color:V,textDecoration:"none",fontWeight:700}}>🌐 web</a>}
          </div>
          {dato("Dirección",empresa.direccion)}
          {dato("Barrio",empresa.barrio)}
          {dato("Ciudad",empresa.ciudad)}
          {dato("Teléfono",empresa.telefono)}
          {dato("Email",empresa.email_empresa)}
          {dato(empresa.tipo_documento||"DNI",empresa.documento)}
        </div>
        <div style={{flex:1,minWidth:220,padding:"12px 14px"}}>
          <div style={{fontSize:12,fontWeight:700,color:V,textTransform:"uppercase",letterSpacing:.5,marginBottom:6}}>Datos del cliente</div>

          {dato("Barrio",cliente.barrio)}
          {dato("Ciudad",cliente.ciudad)}
          {cliente.mostrar_telefono&&dato("Teléfono",cliente.telefono)}
          {(cliente.mostrar_direccion||(esEmpresa&&aceptado))&&dato("Dirección",cliente.direccion)}
          {(esEmpresa&&aceptado&&!cliente.mostrar_direccion)&&cliente.direccion&&<div style={{fontSize:12,color:V,marginTop:4}}>✓ Dirección visible porque aceptaste este presupuesto.</div>}
        </div>
      </div>

      {/* Tabla de ítems */}
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",minWidth:420}}>
          <thead><tr>
            <th style={th}>Descripción</th>

            <th style={{...th,textAlign:"right"}}>Cant.</th>
            <th style={{...th,textAlign:"right"}}>Importe</th>

          <tbody>
