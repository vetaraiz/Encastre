function ManualUsuario({tipo,onCerrar}){
  const f=FLUJOS[tipo];
  const [tab,setTab]=useState("practico");
  const seccion=f?f[tab]:null;
  return(
    <div style={{maxWidth:680,margin:"0 auto"}}>
      <div style={S.card}>
        {!f?(
          <>
            <div style={{...S.cardTitle,fontSize:24,marginBottom:10}}>📖 Manual</div>
            <div style={{fontSize:16,color:C.textoSuave,lineHeight:1.7}}>Muy pronto vas a tener acá el manual completo de tu circuito, con el mismo formato paso a paso. Mientras tanto, podés consultar el Manual general desde la pantalla de bienvenida.</div>
          </>
        ):(
          <>
            <div style={{...S.cardTitle,fontSize:24,marginBottom:14}}>{f.titulo}</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:20}}>
              {f.leyenda.map((l,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:6,background:C.suave,border:`1px solid ${C.acento}55`,borderRadius:16,padding:"5px 12px",fontSize:13,color:C.marron,fontWeight:600}}>
                  <span style={{fontSize:15}}>{l.e}</span><span>{l.t}</span>
                </div>
              ))}
            </div>
            <div style={{display:"flex",gap:8,marginBottom:22,borderBottom:`2px solid ${C.borde}`}}>
              <button style={{flex:1,background:"transparent",border:"none",borderBottom:tab==="practico"?`3px solid ${C.marron}`:"3px solid transparent",padding:"10px 6px",cursor:"pointer",fontFamily:"'Lato',sans-serif",fontSize:15,fontWeight:700,color:tab==="practico"?C.marron:C.textoSuave}} onClick={()=>setTab("practico")}>🛠️ Cómo funciona</button>
              <button style={{flex:1,background:"transparent",border:"none",borderBottom:tab==="pagos"?`3px solid ${C.marron}`:"3px solid transparent",padding:"10px 6px",cursor:"pointer",fontFamily:"'Lato',sans-serif",fontSize:15,fontWeight:700,color:tab==="pagos"?C.marron:C.textoSuave}} onClick={()=>setTab("pagos")}>💳 {f.pagos.titulo}</button>
            </div>
            {seccion.pasos.map((p,i)=>{
              if(p.type==="step")return <FlowStep key={i} n={p.n} icon={p.icon} title={p.title} lines={p.lines} color={p.color}/>;
              if(p.type==="arrow")return <FlowArrow key={i} label={p.label}/>;
              if(p.type==="branch")return <FlowBranch key={i} label={p.label} options={p.options}/>;
              return null;
            })}
          </>
        )}
      </div>
    </div>
  );
}

function ContactoUnificado({usuario,onCerrar}){
  const [modo,setModo]=useState("problema"); // "problema" | "comentario"

  // --- estado formulario "problema" ---
  const [tipo,setTipo]=useState("pedido");
  const [tipoPedidoRef,setTipoPedidoRef]=useState("cliente");
  const [rolReportado,setRolReportado]=useState("");
  const [referencia,setReferencia]=useState("");
  const [descripcion,setDescripcion]=useState("");

  // --- estado formulario "comentario" ---
  const [nombre,setNombre]=useState(usuario?.nombre||"");
  const [email,setEmail]=useState(usuario?.email||"");
  const [mensaje,setMensaje]=useState("");

  const [enviando,setEnviando]=useState(false);
  const [ok,setOk]=useState("");
  const [err,setErr]=useState("");

  const TIPOS=[["pedido","📦 Sobre un pedido"],["usuario","👤 Sobre un usuario"],["app","⚙️ Sobre la app"]];
  const CIRCUITOS_TODOS=[["cliente","Cliente → Carpintería"],["aserradero","Carpintería → Aserradero"],["ferreteria","Carpintería → Ferretería"],["pintureria","Carpintería → Pinturería"],["flete","Flete"]];
  const CIRCUITOS_POR_TIPO={cliente:["cliente","flete"],carpinteria:["cliente","aserradero","ferreteria","pintureria","flete"],aserradero:["aserradero","flete"],ferreteria:["ferreteria","flete"],pintureria:["pintureria","flete"],flete:["flete"]};
  const circuitosPermitidos=CIRCUITOS_POR_TIPO[usuario.tipo]||["flete"];
  const CIRCUITOS=CIRCUITOS_TODOS.filter(([id])=>circuitosPermitidos.includes(id));
  const ROLES={cliente:"Cliente",carpinteria:"Carpintería",aserradero:"Aserradero",ferreteria:"Ferretería",pintureria:"Pinturería",flete:"Flete"};
  const opcionesUsuario=(usuario.tipo==="carpinteria"
    ? ["cliente","aserradero","ferreteria","pintureria","flete"]
    : usuario.tipo==="cliente"
    ? ["carpinteria","flete"]
    : ["carpinteria","flete"]
  ).filter(r=>r!==usuario.tipo);
  useEffect(()=>{ if(!rolReportado&&opcionesUsuario.length) setRolReportado(opcionesUsuario[0]); },[]);
  useEffect(()=>{ if(!circuitosPermitidos.includes(tipoPedidoRef)&&CIRCUITOS.length) setTipoPedidoRef(CIRCUITOS[0][0]); },[]);

  const enviarProblema=async()=>{
    if(!descripcion.trim()){ setErr("Contanos qué pasó."); setOk(""); return; }
    setEnviando(true); setErr(""); setOk("");
    try{
      let desc=descripcion.trim();
      if(tipo==="pedido") desc=`Circuito: ${CIRCUITOS.find(c=>c[0]===tipoPedidoRef)?.[1]||tipoPedidoRef}${referencia.trim()?` · Referencia: ${referencia.trim()}`:""}\n\n${desc}`;
      else if(tipo==="usuario") desc=`Usuario reportado: ${ROLES[rolReportado]||rolReportado}${referencia.trim()?` · ${referencia.trim()}`:""}\n\n${desc}`;
      await db.insertMin("quejas",{tipo,usuario_id:usuario.id,tipo_pedido:tipo==="pedido"?tipoPedidoRef:null,descripcion:desc,estado:"nueva"});
      setOk("¡Recibido! Lo vamos a revisar a la brevedad.");
      setDescripcion(""); setReferencia("");
    }catch(e){ setErr("No se pudo enviar: "+(e.message||"revisá tu conexión")); }
    setEnviando(false);
  };

  const enviarComentario=async()=>{
    if(!mensaje.trim()){ setErr("Escribí un mensaje."); setOk(""); return; }
    setEnviando(true); setErr(""); setOk("");
    try{
      await db.insertMin("mensajes_contacto",{usuario_id:usuario?.id||null,nombre:nombre||null,email:email||null,mensaje:mensaje.trim()});
      const asunto=encodeURIComponent(`Comentario de ${nombre||"usuario"} - Encastre`);
      const cuerpo=encodeURIComponent(`${mensaje}\n\n---\nDe: ${nombre||"(sin nombre)"} <${email||"sin email"}>`);
      window.open(`mailto:administracion@encastre.com.ar?subject=${asunto}&body=${cuerpo}`,"_blank");
      setOk("¡Gracias! Tu comentario se guardó y además se abrió tu mail para enviarlo.");
      setMensaje("");
    }catch(e){ setErr("No se pudo guardar: "+(e.message||"revisá tu conexión")); }
    setEnviando(false);
  };

  const enviar=()=>modo==="problema"?enviarProblema():enviarComentario();

  return(
    <div style={{maxWidth:640,margin:"0 auto"}}>
      <div style={{...S.cardTitle,fontSize:26,marginBottom:16}}>✉️ Reportar o comentar</div>
      <div style={S.card}>
        <label style={S.label}>¿Qué querés hacer?</label>
        <select value={modo} onChange={e=>{setModo(e.target.value);setOk("");setErr("");}} style={{...S.input,marginBottom:16}}>
          <option value="problema">⚠️ Reportar un problema</option>
          <option value="comentario">✉️ Enviar un comentario</option>
        </select>

        {modo==="problema"?(
          <>
            <div style={{fontSize:14,color:C.textoSuave,marginBottom:14}}>Tu reporte llega directo a la administración de Encastre.</div>
            <label style={S.label}>¿Sobre qué es?</label>
            <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:14}}>
              {TIPOS.map(([id,l])=><button key={id} style={S.tag(tipo===id)} onClick={()=>setTipo(id)}>{l}</button>)}
            </div>
            {tipo==="pedido"&&(
              <div style={{marginBottom:14}}>
                <label style={S.label}>¿Con quién fue el pedido?</label>
                <select value={tipoPedidoRef} onChange={e=>setTipoPedidoRef(e.target.value)} style={{...S.input,marginBottom:8}}>
                  {CIRCUITOS.map(([id,l])=><option key={id} value={id}>{l}</option>)}
                </select>
                <label style={S.label}>Referencia <span style={{fontWeight:400,color:C.textoSuave}}>(fecha, con quién fue, lo que ayude a identificarlo)</span></label>
                <input value={referencia} onChange={e=>setReferencia(e.target.value)} placeholder="Ej: pedido del 20/07 con Carpintería López" style={S.input}/>
              </div>
            )}
            {tipo==="usuario"&&(
              <div style={{marginBottom:14}}>
                <label style={S.label}>¿A quién querés reportar?</label>
                <select value={rolReportado} onChange={e=>setRolReportado(e.target.value)} style={{...S.input,marginBottom:8}}>
                  {opcionesUsuario.map(r=><option key={r} value={r}>{ROLES[r]}</option>)}
                </select>
                <label style={S.label}>Nombre o email <span style={{fontWeight:400,color:C.textoSuave}}>(para identificarlo)</span></label>
                <input value={referencia} onChange={e=>setReferencia(e.target.value)} placeholder="Nombre o email del usuario" style={S.input}/>
              </div>
            )}
            <div style={{marginBottom:4}}>
              <label style={S.label}>Contanos qué pasó</label>
              <textarea style={{...S.input,minHeight:120,resize:"vertical"}} value={descripcion} onChange={e=>setDescripcion(e.target.value)}/>
            </div>
          </>
        ):(
          <>
            <div style={{fontSize:14,color:C.textoSuave,marginBottom:14}}>Contanos sugerencias, problemas o lo que se te ocurra. Tu mensaje queda guardado y además se abre tu mail para mandarlo directo.</div>
            <div style={{marginBottom:14}}>
              <label style={S.label}>Nombre</label>
              <input style={S.input} value={nombre} onChange={e=>setNombre(e.target.value)}/>
            </div>
            <div style={{marginBottom:14}}>
              <label style={S.label}>Email (opcional, para responderte)</label>
              <input style={S.input} value={email} onChange={e=>setEmail(e.target.value)}/>
            </div>
            <div style={{marginBottom:4}}>
              <label style={S.label}>Mensaje</label>
              <textarea style={{...S.input,minHeight:120,resize:"vertical"}} value={mensaje} onChange={e=>setMensaje(e.target.value)}/>
            </div>
          </>
        )}

        {ok?<div style={{fontSize:15,fontWeight:700,color:C.exito,marginTop:10}}>{ok}</div>:null}
        {err?<div style={{fontSize:15,fontWeight:700,color:C.error,marginTop:10}}>{err}</div>:null}
        <button style={{...S.btn("gold"),marginTop:16,width:"100%",justifyContent:"center"}} onClick={enviar} disabled={enviando}>{enviando?"Enviando...":modo==="problema"?"Enviar reporte":"Enviar comentario"}</button>
      </div>
    </div>
  );
}

// ─── PANEL DE ADMINISTRACIÓN (solo usuario.tipo==="admin") ────────────────────
function AdminUsuarios(){
  const [lista,setLista]=useState([]);
  const [cargando,setCargando]=useState(true);
  const [filtro,setFiltro]=useState("");
  const [sel,setSel]=useState(null);
  const [nombreEdit,setNombreEdit]=useState("");
  const [diasSusp,setDiasSusp]=useState("7");
  const [guardando,setGuardando]=useState(false);
  const [msg,setMsg]=useState("");

  useEffect(()=>{(async()=>{
    try{ const d=await db.select("usuarios","?order=created_at.desc"); setLista(d); }catch{}
    setCargando(false);
  })();},[]);

  const EMOJIS={cliente:"🪑",carpinteria:"🔨",aserradero:"🌲",flete:"🚚",ferreteria:"🔩",pintureria:"🖌️",trabajador:"🧰",admin:"🛡️"};
  const filtrados=filtro?lista.filter(u=>u.tipo===filtro):lista;
  const suspendidoActivo=(u)=>u.suspendido_hasta&&new Date(u.suspendido_hasta)>new Date();

  const abrir=(u)=>{ setSel(u); setNombreEdit(u.nombre||""); setDiasSusp("7"); setMsg(""); };

  const guardarNombre=async()=>{
    if(!sel||!nombreEdit.trim())return;
    setGuardando(true);
    try{
      await db.updateMin("usuarios",{nombre:nombreEdit.trim()},`id=eq.${sel.id}`);
      setLista(ls=>ls.map(u=>u.id===sel.id?{...u,nombre:nombreEdit.trim()}:u));
      setSel(s=>s?{...s,nombre:nombreEdit.trim()}:s);
      setMsg("✅ Nombre actualizado");
    }catch(e){setMsg("❌ No se pudo guardar: "+(e.message||""));}
    setGuardando(false);
  };

  const toggleBaja=async()=>{
    if(!sel)return;
    const nuevoActivo=sel.activo===false?true:false;
    if(!window.confirm(nuevoActivo?"¿Reactivar esta cuenta?":"¿Dar de baja esta cuenta? No va a poder ingresar hasta que la reactives."))return;
    setGuardando(true);
    try{
      await db.updateMin("usuarios",{activo:nuevoActivo},`id=eq.${sel.id}`);
      setLista(ls=>ls.map(u=>u.id===sel.id?{...u,activo:nuevoActivo}:u));
      setSel(s=>s?{...s,activo:nuevoActivo}:s);
      setMsg(nuevoActivo?"✅ Cuenta reactivada":"✅ Cuenta dada de baja");
    }catch(e){setMsg("❌ No se pudo guardar: "+(e.message||""));}
    setGuardando(false);
  };

  const suspender=async()=>{
    if(!sel)return;
    const dias=Number(diasSusp)||0;
    if(dias<=0){setMsg("❌ Poné una cantidad de días válida");return;}
    const hasta=new Date(); hasta.setDate(hasta.getDate()+dias);
    setGuardando(true);
    try{
      await db.updateMin("usuarios",{suspendido_hasta:hasta.toISOString()},`id=eq.${sel.id}`);
      setLista(ls=>ls.map(u=>u.id===sel.id?{...u,suspendido_hasta:hasta.toISOString()}:u));
      setSel(s=>s?{...s,suspendido_hasta:hasta.toISOString()}:s);
      setMsg(`✅ Suspendida hasta el ${hasta.toLocaleDateString("es-AR")}`);
    }catch(e){setMsg("❌ No se pudo guardar: "+(e.message||""));}
    setGuardando(false);
  };

  const levantarSuspension=async()=>{
    if(!sel)return;
    setGuardando(true);
    try{
      await db.updateMin("usuarios",{suspendido_hasta:null},`id=eq.${sel.id}`);
      setLista(ls=>ls.map(u=>u.id===sel.id?{...u,suspendido_hasta:null}:u));
      setSel(s=>s?{...s,suspendido_hasta:null}:s);
      setMsg("✅ Suspensión levantada");
    }catch(e){setMsg("❌ No se pudo guardar: "+(e.message||""));}
    setGuardando(false);
  };

  if(sel){
    return(
      <div>
        <button style={{...S.btn("link"),marginBottom:16}} onClick={()=>setSel(null)}>← Volver</button>
        <div style={S.card}>
          <div style={{fontWeight:800,color:C.marron,fontSize:22,marginBottom:4}}>{EMOJIS[sel.tipo]||"👤"} {sel.nombre||"(sin nombre)"}</div>
          <div style={{fontSize:15,color:C.textoSuave,marginBottom:14}}>{sel.email} · {sel.tipo} · alta {sel.created_at?new Date(sel.created_at).toLocaleDateString("es-AR"):""}</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
            {sel.activo===false&&<span style={{background:C.error,color:"#fff",fontSize:13,fontWeight:700,padding:"4px 10px"}}>Dada de baja</span>}
            {suspendidoActivo(sel)&&<span style={{background:C.rojo,color:"#fff",fontSize:13,fontWeight:700,padding:"4px 10px"}}>Suspendida hasta {new Date(sel.suspendido_hasta).toLocaleDateString("es-AR")}</span>}
            {sel.activo!==false&&!suspendidoActivo(sel)&&<span style={{background:C.verde,color:"#fff",fontSize:13,fontWeight:700,padding:"4px 10px"}}>Activa</span>}
          </div>

          <Divider/>
          <div style={S.secTitle}>✏️ Cambiar nombre</div>
          <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
            <input style={{...S.input,flex:1,minWidth:200}} value={nombreEdit} onChange={e=>setNombreEdit(e.target.value)}/>
            <button style={S.btn("dark")} disabled={guardando} onClick={guardarNombre}>Guardar</button>
          </div>

          <Divider/>
          <div style={S.secTitle}>{sel.activo===false?"↩️ Reactivar cuenta":"🚫 Dar de baja"}</div>
          <div style={{fontSize:15,color:C.textoSuave,marginBottom:8}}>{sel.activo===false?"La cuenta está dada de baja. Al reactivarla, vuelve a poder ingresar.":"La cuenta deja de poder ingresar hasta que la reactives."}</div>
          <button style={S.btn(sel.activo===false?"dark":"ghost")} disabled={guardando} onClick={toggleBaja}>{sel.activo===false?"↩️ Reactivar":"🚫 Dar de baja"}</button>

          <Divider/>
          <div style={S.secTitle}>⏱️ Suspender temporalmente</div>
          {suspendidoActivo(sel)?(
            <div>
              <div style={{fontSize:15,color:C.textoSuave,marginBottom:8}}>Suspendida hasta el {new Date(sel.suspendido_hasta).toLocaleDateString("es-AR")}.</div>
              <button style={S.btn("ghost")} disabled={guardando} onClick={levantarSuspension}>✅ Levantar suspensión ahora</button>
            </div>
          ):(
            <div style={{display:"flex",gap:8,alignItems:"flex-end"}}>
              <div>
                <label style={S.label}>Días</label>
                <input type="number" value={diasSusp} onChange={e=>setDiasSusp(e.target.value)} style={{...S.input,width:100}}/>
              </div>
              <button style={S.btn("dark")} disabled={guardando} onClick={suspender}>⏱️ Suspender</button>
            </div>
          )}

          {msg&&<div style={{marginTop:14,fontWeight:700,color:msg.startsWith("❌")?C.error:C.exito}}>{msg}</div>}
        </div>
      </div>
    );
  }

  return(
    <div>
      <div style={{...S.cardTitle,fontSize:26,marginBottom:16}}>👥 Usuarios registrados ({lista.length})</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16}}>
        <button style={S.btn(filtro===""?"dark":"ghost")} onClick={()=>setFiltro("")}>Todos</button>
        {["cliente","carpinteria","aserradero","ferreteria","pintureria","flete","trabajador"].map(t=>(
          <button key={t} style={S.btn(filtro===t?"dark":"ghost")} onClick={()=>setFiltro(t)}>{EMOJIS[t]} {t}</button>
        ))}
      </div>
      {cargando?<div style={S.card}>Cargando...</div>:(
        <div style={S.card}>
          {filtrados.length===0&&<div style={{color:C.textoSuave,textAlign:"center",padding:20}}>Sin usuarios en este filtro.</div>}
          {filtrados.map(u=>(
            <div key={u.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,padding:"12px 0",borderBottom:`1px dashed ${C.borde}`}}>
              <div>
                <div style={{fontWeight:700,color:C.marron,fontSize:17}}>{EMOJIS[u.tipo]||"👤"} {u.nombre||"(sin nombre)"}{u.activo===false&&<span style={{marginLeft:8,fontSize:12,color:C.error,fontWeight:700}}>(dado de baja)</span>}{suspendidoActivo(u)&&<span style={{marginLeft:8,fontSize:12,color:C.rojo,fontWeight:700}}>(suspendida)</span>}</div>
                <div style={{fontSize:15,color:C.textoSuave}}>{u.email||"sin email"} · {u.telefono||"sin teléfono"} · {u.tipo} · {u.created_at?new Date(u.created_at).toLocaleDateString("es-AR"):""}</div>
              </div>
              <button style={{...S.btn("ghost"),whiteSpace:"nowrap"}} onClick={()=>abrir(u)}>⚙️ Configurar</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function AdminQuejas(){
  const [lista,setLista]=useState([]);
  const [sel,setSel]=useState(null);
  const [respuesta,setRespuesta]=useState("");
  const [guardando,setGuardando]=useState(false);
  const [filtro,setFiltro]=useState("");
  const cargar=useCallback(async()=>{
    try{ const d=await db.select("quejas","?order=created_at.desc"); setLista(d); }catch{}
  },[]);
  useEffect(()=>{cargar();const t=setInterval(cargar,20000);return()=>clearInterval(t);},[cargar]);

  const EMOJI_TIPO={pedido:"📦",usuario:"👤",app:"⚙️"};
  const COLOR_ESTADO={nueva:C.rojo,en_revision:C.acento,resuelta:C.verde};
  const LABEL_ESTADO={nueva:"Nueva",en_revision:"En revisión",resuelta:"Resuelta"};

  const abrir=(q)=>{ setSel(q); setRespuesta(q.respuesta_admin||""); };

  const cambiarEstado=async(estado)=>{
    if(!sel)return;
    setGuardando(true);
    try{
      await db.updateMin("quejas",{estado,respuesta_admin:respuesta||null,resuelta_at:estado==="resuelta"?new Date().toISOString():null},`id=eq.${sel.id}`);
      setLista(ls=>ls.map(q=>q.id===sel.id?{...q,estado,respuesta_admin:respuesta||null}:q));
      setSel(s=>s?{...s,estado,respuesta_admin:respuesta||null}:s);
    }catch(e){alert("No se pudo guardar: "+(e.message||""));}
    setGuardando(false);
  };

  if(sel){
    return(
      <div>
        <button style={{...S.btn("link"),marginBottom:16}} onClick={()=>setSel(null)}>← Volver</button>
        <div style={S.card}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
            <div style={{fontWeight:800,color:C.marron,fontSize:20}}>{EMOJI_TIPO[sel.tipo]||"⚠️"} Queja sobre {sel.tipo==="pedido"?"un pedido":sel.tipo==="usuario"?"un usuario":"la app"}</div>
            <span style={{background:COLOR_ESTADO[sel.estado]||C.suave,color:"#fff",fontSize:13,fontWeight:700,padding:"5px 10px",borderRadius:0}}>{LABEL_ESTADO[sel.estado]||sel.estado||"Nueva"}</span>
          </div>
          <div style={{fontSize:15,color:C.textoSuave,marginBottom:10}}>{sel.created_at?new Date(sel.created_at).toLocaleString("es-AR"):""}</div>
          <Divider/>
          <div style={{marginBottom:10}}><div style={S.label}>Quién la hizo</div><div style={{fontSize:15,fontFamily:"monospace"}}>{sel.usuario_id}</div></div>
          <div style={{marginBottom:10}}><div style={S.label}>Descripción</div><div style={{fontSize:17}}>{sel.descripcion}</div></div>
          {sel.pedido_id&&<div style={{marginBottom:10}}><div style={S.label}>Pedido relacionado</div><div style={{fontSize:15,fontFamily:"monospace"}}>{sel.pedido_id} {sel.tipo_pedido?`(${sel.tipo_pedido})`:""}</div></div>}
          {sel.usuario_reportado_id&&<div style={{marginBottom:10}}><div style={S.label}>Usuario reportado</div><div style={{fontSize:15,fontFamily:"monospace"}}>{sel.usuario_reportado_id}</div></div>}
          <Divider/>
          <div style={{marginBottom:10}}>
            <label style={S.label}>Respuesta / notas internas</label>
            <textarea value={respuesta} onChange={e=>setRespuesta(e.target.value)} style={{...S.input,minHeight:80,resize:"vertical"}}/>
          </div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button style={S.btn(sel.estado==="en_revision"?"dark":"ghost")} disabled={guardando} onClick={()=>cambiarEstado("en_revision")}>🔎 Marcar en revisión</button>
            <button style={S.btn(sel.estado==="resuelta"?"dark":"ghost")} disabled={guardando} onClick={()=>cambiarEstado("resuelta")}>✅ Marcar resuelta</button>
          </div>
        </div>
      </div>
    );
  }

  const filtradas=filtro?lista.filter(q=>(q.estado||"nueva")===filtro):lista;
  return(
    <div>
      <div style={{...S.cardTitle,fontSize:26,marginBottom:16}}>⚠️ Quejas ({lista.length})</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16}}>
        <button style={S.btn(filtro===""?"dark":"ghost")} onClick={()=>setFiltro("")}>Todas</button>
        {["nueva","en_revision","resuelta"].map(e=>(
          <button key={e} style={S.btn(filtro===e?"dark":"ghost")} onClick={()=>setFiltro(e)}>{LABEL_ESTADO[e]}</button>
        ))}
      </div>
      {filtradas.length===0?(
        <div style={S.card}><div style={{color:C.textoSuave,textAlign:"center",padding:20}}>No hay quejas en este filtro.</div></div>
      ):filtradas.map(q=>(
        <div key={q.id} style={{...S.card,cursor:"pointer"}} onClick={()=>abrir(q)}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
            <div style={{fontWeight:700,color:C.marron,fontSize:17}}>{EMOJI_TIPO[q.tipo]||"⚠️"} {q.descripcion?(q.descripcion.length>70?q.descripcion.slice(0,70)+"…":q.descripcion):"(sin descripción)"}</div>
            <span style={{background:COLOR_ESTADO[q.estado]||C.rojo,color:"#fff",fontSize:12,fontWeight:700,padding:"3px 9px",borderRadius:0,whiteSpace:"nowrap"}}>{LABEL_ESTADO[q.estado||"nueva"]}</span>
          </div>
          <div style={{fontSize:14,color:C.textoSuave,marginTop:4}}>{q.created_at?new Date(q.created_at).toLocaleString("es-AR"):""}</div>
        </div>
      ))}
    </div>
  );
}

function AdminMovimientos(){
  const [circuito,setCircuito]=useState("cliente");
  const [pedidos,setPedidos]=useState([]);
  const [nombres,setNombres]=useState({});
  const [cargando,setCargando]=useState(true);
  const [sel,setSel]=useState(null);
  const [cots,setCots]=useState([]);
  const [cargandoCots,setCargandoCots]=useState(false);
  const [cotAbierta,setCotAbierta]=useState(null);

  const cfg=CIRCUITOS_MOV.find(c=>c.id===circuito);

  useEffect(()=>{
    setSel(null); setCots([]); setCotAbierta(null);
    (async()=>{
      setCargando(true);
      try{
        const d=await db.select(cfg.tablaPed,"?order=created_at.desc");
        const ids=[...new Set(d.map(p=>p[cfg.campoReqId]).filter(Boolean))];
        let mapa={};
        if(ids.length){
          try{ const us=await db.select("usuarios",`?id=in.(${ids.join(",")})&select=id,nombre`); us.forEach(u=>{mapa[u.id]=u.nombre;}); }catch{}
        }
        setNombres(mapa);
        setPedidos(d);
      }catch{ setPedidos([]); }
      setCargando(false);
    })();
  },[circuito]);

  const abrir=async(p)=>{
    setSel(p); setCotAbierta(null);
    setCargandoCots(true);
    try{
      const c=await db.select(cfg.tablaCot,`?pedido_id=eq.${p.id}&order=created_at.desc`);
      const idsProv=[...new Set(c.map(x=>x[cfg.campoProvId]).filter(Boolean))];
      let mapaProv={};
      if(idsProv.length){
        try{ const us=await db.select("usuarios",`?id=in.(${idsProv.join(",")})`); us.forEach(u=>{mapaProv[u.id]=u;}); }catch{}
      }
      setCots(c.map(x=>({...x,_proveedor:mapaProv[x[cfg.campoProvId]]||{}})));
    }catch{ setCots([]); }
    setCargandoCots(false);
  };

  const tituloPedido=(p)=>p.descripcion||p.material||(p.origen?`${p.origen}${p.destino?" → "+p.destino:""}`:"(sin descripción)");

  return(
    <div>
      <div style={{...S.cardTitle,fontSize:26,marginBottom:8}}>📊 Movimientos</div>
      <div style={{fontSize:14,color:C.textoSuave,marginBottom:16}}>Acá se ven todas las cotizaciones de un mismo pedido juntas, incluso entre proveedores que compiten entre sí. Esta vista es exclusiva de administración — ningún otro usuario tiene acceso a esto ni sabe que existe.</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16}}>
        {CIRCUITOS_MOV.map(c=><button key={c.id} style={S.btn(circuito===c.id?"dark":"ghost")} onClick={()=>setCircuito(c.id)}>{c.label}</button>)}
      </div>

      {sel?(
        <div>
          <button style={{...S.btn("link"),marginBottom:16}} onClick={()=>setSel(null)}>← Volver a la lista</button>
          <div style={S.card}>
            <div style={{fontWeight:800,color:C.marron,fontSize:20,marginBottom:6}}>{nombres[sel[cfg.campoReqId]]||"—"}</div>
            <div style={{fontSize:15,color:C.textoSuave,marginBottom:14}}>{tituloPedido(sel)} · {sel.created_at?new Date(sel.created_at).toLocaleString("es-AR"):""}</div>
            <Divider/>
            <div style={{fontWeight:700,color:C.marron,marginBottom:10}}>💰 Cotizaciones recibidas ({cots.length})</div>
            {cargandoCots?<div style={{color:C.textoSuave}}>Cargando...</div>:cots.length===0?(
              <div style={{color:C.textoSuave,fontStyle:"italic"}}>Todavía no tiene cotizaciones.</div>
            ):cots.map(ct=>{
              const abierta=cotAbierta===ct.id;
              return(
                <div key={ct.id} style={{border:`1px solid ${abierta?C.acento:C.borde}`,borderRadius:0,marginBottom:10,overflow:"hidden"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 14px",cursor:"pointer"}} onClick={()=>setCotAbierta(abierta?null:ct.id)}>
                    <b style={{color:C.marron}}>{ct._proveedor?.nombre||"(proveedor)"}</b>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <b style={{color:C.verde}}>{fmtPeso(ct.precio_total)}</b>
                      <span style={{color:C.textoSuave}}>{abierta?"▲":"▼"}</span>
                    </div>
                  </div>
                  {abierta&&(
                    <div style={{padding:"0 14px 14px"}}>
                      <PresupuestoFormato
                        empresa={ct._proveedor||{}}
                        cliente={{}}
                        items={ct.items||[]}
                        opts={{descuento_tipo:ct.descuento_tipo,descuento_valor:ct.descuento_valor,iva_pct:ct.iva_porcentaje}}
                        numero={ct.numero_presupuesto!=null?ct.numero_presupuesto:""}
                        fecha={ct.created_at?new Date(ct.created_at).toLocaleDateString("es-AR"):null}
                        tiempoEntrega={ct.tiempo_entrega}
                        esEmpresa={false}
                        aceptado={false}
                      />
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      ):cargando?(
        <div style={S.card}>Cargando...</div>
      ):(
        <div style={S.card}>
          <div style={{fontWeight:700,color:C.marron,marginBottom:10}}>{cfg.label} ({pedidos.length})</div>
          {pedidos.length===0&&<div style={{color:C.textoSuave,textAlign:"center",padding:20}}>Sin pedidos en este circuito.</div>}
          {pedidos.map(p=>(
            <div key={p.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 0",borderBottom:`1px dashed ${C.borde}`,cursor:"pointer"}} onClick={()=>abrir(p)}>
              <div>
                <div style={{fontWeight:700,color:C.marron,fontSize:17}}>{nombres[p[cfg.campoReqId]]||"—"}</div>
                <div style={{fontSize:15,color:C.textoSuave}}>{tituloPedido(p)} · {p.created_at?new Date(p.created_at).toLocaleDateString("es-AR"):""}</div>
              </div>
              <span style={{color:C.textoSuave}}>▶</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function Papelera({usuario,onCerrar}){
  const [archivados,setArchivados]=useState([]);
  const [cargandoArch,setCargandoArch]=useState(false);
  const cargarPapelera=async()=>{
    setCargandoArch(true);
    try{
      const regs=await db.select("elementos_archivados",`?usuario_id=eq.${usuario.id}&eliminado=eq.false&order=archivado_at.desc`);
      const enr=await Promise.all((regs||[]).map(async r=>{
        let titulo="Elemento",monto=null;
        try{
          if(r.tipo_elemento==="presupuesto"){
            const p=await db.select("presupuestos",`?id=eq.${r.elemento_id}&limit=1`);
            if(p&&p[0]){ const c=await db.select("usuarios",`?id=eq.${p[0].carpinteria_id}&select=nombre&limit=1`); titulo="Presupuesto de "+(c?.[0]?.nombre||"carpintería"); monto=p[0].monto; }
          }else if(r.tipo_elemento==="pedido_cliente"){
            const p=await db.select("pedidos",`?id=eq.${r.elemento_id}&limit=1`);
            if(p&&p[0]){ const c=await db.select("usuarios",`?id=eq.${p[0].cliente_id}&select=nombre&limit=1`); titulo="Pedido de "+(c?.[0]?.nombre||"cliente")+(p[0].descripcion?" · "+p[0].descripcion:""); }
          }else if(r.tipo_elemento==="cotizacion"){
            for(const [tabla,campo] of [["cotizaciones_aserradero","aserradero_id"],["cotizaciones_ferreteria","ferreteria_id"],["cotizaciones_pintureria","pintureria_id"],["cotizaciones_flete","flete_id"]]){
              const q=await db.select(tabla,`?id=eq.${r.elemento_id}&limit=1`);
              if(q&&q[0]){ const c=await db.select("usuarios",`?id=eq.${q[0][campo]}&select=nombre&limit=1`); titulo="Cotización de "+(c?.[0]?.nombre||"proveedor"); monto=q[0].precio_total; break; }
            }
          }
        }catch{}
        return{...r,titulo,monto};
      }));
      setArchivados(enr);
    }catch{}
    setCargandoArch(false);
  };
  useEffect(()=>{cargarPapelera();},[]);
  const restaurar=async(r)=>{
    try{ await db.remove("elementos_archivados",`usuario_id=eq.${usuario.id}&tipo_elemento=eq.${r.tipo_elemento}&elemento_id=eq.${r.elemento_id}`); setArchivados(a=>a.filter(x=>x.id!==r.id)); }catch{}
  };
  const eliminarDef=async(r)=>{
    if(!window.confirm("¿Eliminar definitivamente? Esta acción no se puede deshacer."))return;
    try{ await db.updateMin("elementos_archivados",{eliminado:true},`usuario_id=eq.${usuario.id}&tipo_elemento=eq.${r.tipo_elemento}&elemento_id=eq.${r.elemento_id}`); setArchivados(a=>a.filter(x=>x.id!==r.id)); }catch{}
  };
  return(
    <div style={{maxWidth:640,margin:"0 auto"}}>
      <div style={{...S.cardTitle,fontSize:26,marginBottom:8}}>🗑️ Papelera</div>
      <div style={{fontSize:14,color:C.textoSuave,marginBottom:14}}>Los presupuestos y cotizaciones que archivaste. Podés restaurarlos (vuelven a tu lista) o eliminarlos definitivamente. Solo afecta tu vista; el que lo envió no se entera.</div>
      {cargandoArch?(
        <div style={{textAlign:"center",color:C.textoSuave,padding:20}}>Cargando...</div>
      ):archivados.length===0?(
        <div style={{textAlign:"center",color:C.textoSuave,padding:30,fontSize:16}}>🗑️ La papelera está vacía.</div>
      ):(
        archivados.map(r=>(
          <div key={r.id} style={{border:`1px solid ${C.borde}`,padding:12,marginBottom:10,background:C.input,display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <div style={{flex:1,minWidth:180}}>
              <div style={{fontWeight:700,color:C.marron,fontSize:16}}>{r.titulo}</div>
              {r.monto!=null&&<div style={{fontSize:15,color:C.verde,fontWeight:700,marginTop:2}}>$ {Number(r.monto).toLocaleString("es-AR")}</div>}
              <div style={{fontSize:13,color:C.textoSuave,marginTop:2}}>Archivado el {r.archivado_at?new Date(r.archivado_at).toLocaleDateString("es-AR"):""}</div>
            </div>
            <div style={{display:"flex",gap:8}}>
              <button style={{...S.btn("ghost"),fontSize:14,padding:"8px 12px"}} onClick={()=>restaurar(r)}>↩️ Restaurar</button>
              <button style={{...S.btn("ghost"),fontSize:14,padding:"8px 12px",color:C.error||"#C0392B"}} onClick={()=>eliminarDef(r)}>🗑️ Eliminar</button>
            </div>
          </div>
        ))
      )}
    </div>
  );
}

function MiCuenta({usuario,onCerrar,onActualizar,onDarDeBaja,tabInicial}){
  const esCliente = usuario.tipo==="cliente";
  const [solapa,setSolapa]=useState(tabInicial||"privado");

  // ── PRIVADO ──
  const [nombre,setNombre]=useState(usuario.nombre||"");
  const [ciudad,setCiudad]=useState(usuario.ciudad||"");
  const [provincia,setProvincia]=useState(usuario.provincia||"");
  const [direccion,setDireccion]=useState(usuario.direccion||"");
  const [barrio,setBarrio]=useState(usuario.barrio||"");
  const [telefono,setTelefono]=useState(usuario.telefono||"");
  const [mostrarTel,setMostrarTel]=useState(usuario.mostrar_telefono===true);
  const [mostrarDir,setMostrarDir]=useState(usuario.mostrar_direccion===true);
  const [tipoDoc,setTipoDoc]=useState(usuario.tipo_documento||"DNI");
  const [documento,setDocumento]=useState(usuario.documento||"");
  const [recibirAvisos,setRecibirAvisos]=useState(usuario.recibir_avisos!==false);
  const [estadoPush,setEstadoPush]=useState("inactivo");
  const [cambiandoPush,setCambiandoPush]=useState(false);
  useEffect(()=>{(async()=>{ setEstadoPush(await db.pushEstado()); })();},[]);
  const togglePush=async(e)=>{
    const activar=e.target.checked;
    setCambiandoPush(true);
    try{
      if(activar){ await db.pushSuscribir(usuario.id); setEstadoPush("activo"); }
      else{ await db.pushDesuscribir(usuario.id); setEstadoPush("inactivo"); }
    }catch(err){
      alert(err.message||"No se pudieron activar las notificaciones");
      setEstadoPush(await db.pushEstado());
    }
    setCambiandoPush(false);
  };
  const [guardandoPriv,setGuardandoPriv]=useState(false);
  const [okPriv,setOkPriv]=useState("");
  const [errPriv,setErrPriv]=useState("");

  // ── SUSCRIPCIÓN ──
  const [susc,setSusc]=useState(null);
  const [cargandoSusc,setCargandoSusc]=useState(true);
  const [pagando,setPagando]=useState(false);
  const [errSusc,setErrSusc]=useState("");
  useEffect(()=>{
    if(esCliente){ setCargandoSusc(false); return; }
    (async()=>{
      try{
        const filas=await db.select("suscripciones",`?usuario_id=eq.${usuario.id}&order=creado_en.desc&limit=1`);
        setSusc(filas[0]||null);
      }catch{}
      setCargandoSusc(false);
    })();
  },[]);
  const vencidaSusc = susc && new Date(susc.fecha_vencimiento) < new Date();
  const [confirmarPago,setConfirmarPago]=useState(null);
  const [cargandoPreview,setCargandoPreview]=useState(false);
  const verPrecio=async()=>{
    setCargandoPreview(true); setErrSusc("");
    try{
      const data=await db.crearPago(true);
      if(data.precio!=null) setConfirmarPago({precio:data.precio,numeroMes:data.numeroMes});
      else setErrSusc("No se pudo calcular el precio.");
    }catch(e){ setErrSusc(e.message||"No se pudo calcular el precio."); }
    setCargandoPreview(false);
  };
  const pagar=async()=>{
    setPagando(true); setErrSusc("");
    try{
      const data=await db.crearPago(false);
      if(data.init_point) window.location.href=data.init_point;
      else setErrSusc("No se pudo generar el link de pago.");
    }catch(e){ setErrSusc(e.message||"No se pudo generar el link de pago."); }
    setPagando(false);
  };

  // ── CONTRASEÑA ──
  const [passActual,setPassActual]=useState("");
  const [pass1,setPass1]=useState("");
  const [pass2,setPass2]=useState("");
  const [verPass,setVerPass]=useState(false);
  const [guardandoPass,setGuardandoPass]=useState(false);
  const [okPass,setOkPass]=useState("");
  const [errPass,setErrPass]=useState("");

  // ── PÚBLICO ──
  const [instagram,setInstagram]=useState(usuario.instagram||"");
  const [tiktok,setTiktok]=useState(usuario.tiktok||"");
  const [emailEmpresa,setEmailEmpresa]=useState(usuario.email_empresa||"");
  const [web,setWeb]=useState(usuario.web||"");
  const [guardandoPub,setGuardandoPub]=useState(false);
  const [okPub,setOkPub]=useState("");
  const [errPub,setErrPub]=useState("");
  const [trabajos,setTrabajos]=useState(usuario.trabajos&&usuario.trabajos.length>0?usuario.trabajos:[usuario.foto1,usuario.foto2,usuario.foto3].filter(Boolean).map(f=>({foto:f,titulo:""})));
  const [procFoto,setProcFoto]=useState(false);
  const [tituloPendiente,setTituloPendiente]=useState("");
  const [fotoPendiente,setFotoPendiente]=useState(null);

  const parchearSesion=(campos)=>{
    try{
      const s=JSON.parse(localStorage.getItem("encastre_sesion"));
      if(s&&s.usuario){ Object.assign(s.usuario,campos); localStorage.setItem("encastre_sesion",JSON.stringify(s)); }
    }catch{}
    if(onActualizar) onActualizar(campos);
  };

  const guardarPrivado=async()=>{
    setErrPriv(""); setOkPriv("");
    if(!nombre.trim()){ setErrPriv("El nombre no puede quedar vacío."); return; }
    setGuardandoPriv(true);
    const campos={nombre:nombre.trim(),ciudad:ciudad.trim(),provincia:provincia.trim()||null,direccion:direccion.trim()||null,barrio:barrio.trim()||null,telefono:telefono.trim()||null,mostrar_telefono:mostrarTel,mostrar_direccion:mostrarDir,tipo_documento:tipoDoc,documento:documento.trim(),recibir_avisos:recibirAvisos};
    try{
      await db.updateMin("usuarios",campos,`id=eq.${usuario.id}`);
      parchearSesion(campos);
      setOkPriv("✅ Datos guardados correctamente.");
      alert("Datos guardados correctamente.");
    }catch(e){ setErrPriv("No se pudieron guardar los datos: "+(e.message||"revisá tu conexión")); }
    setGuardandoPriv(false);
  };

  const cambiarPass=async()=>{
    setErrPass(""); setOkPass("");
    if(!passActual){ setErrPass("Ingresá tu contraseña actual."); return; }
    if(pass1.length<6){ setErrPass("La nueva contraseña debe tener al menos 6 caracteres."); return; }
    if(pass1!==pass2){ setErrPass("Las contraseñas nuevas no coinciden."); return; }
    if(pass1===passActual){ setErrPass("La nueva contraseña es igual a la actual."); return; }
    setGuardandoPass(true);

      <div style={{fontSize:16,color:C.textoSuave,marginBottom:24,maxWidth:420}}>
        {tipo==="carpinteria"
          ? (dias!=null&&dias>=0

// --- Ubicación (API Georef Argentina) ---
const GEOREF_CACHE={provincias:null,localidades:{}};
async function cargarProvincias(){
  if(GEOREF_CACHE.provincias) return GEOREF_CACHE.provincias;
  try{
    const r=await fetch("https://apis.datos.gob.ar/georef/api/provincias?campos=id,nombre&orden=nombre&max=30");
    const d=await r.json();
    GEOREF_CACHE.provincias=(d.provincias||[]).map(p=>p.nombre);
  }catch{ GEOREF_CACHE.provincias=[]; }
  return GEOREF_CACHE.provincias;
}
async function cargarLocalidades(provinciaNombre){
  if(!provinciaNombre) return [];
  if(GEOREF_CACHE.localidades[provinciaNombre]) return GEOREF_CACHE.localidades[provinciaNombre];
  try{
    const r=await fetch("https://apis.datos.gob.ar/georef/api/localidades?provincia="+encodeURIComponent(provinciaNombre)+"&campos=nombre&max=5000&orden=nombre");
    const d=await r.json();
    const vistos=new Set(); const lista=[];
    (d.localidades||[]).forEach(l=>{ if(!vistos.has(l.nombre)){ vistos.add(l.nombre); lista.push(l.nombre); } });
    GEOREF_CACHE.localidades[provinciaNombre]=lista;
  }catch{ GEOREF_CACHE.localidades[provinciaNombre]=[]; }
  return GEOREF_CACHE.localidades[provinciaNombre];
}
function SelectorUbicacion({provincia,ciudad,onProvincia,onCiudad}){
  const [provincias,setProvincias]=useState([]);
  const [localidades,setLocalidades]=useState([]);
  const [cargando,setCargando]=useState(false);
  useEffect(()=>{ cargarProvincias().then(setProvincias); },[]);
  useEffect(()=>{
    if(!provincia){ setLocalidades([]); return; }
    let cancelado=false;
    setCargando(true);
    cargarLocalidades(provincia).then(l=>{ if(!cancelado){ setLocalidades(l); setCargando(false); } });
    return ()=>{cancelado=true;};
  },[provincia]);
  return(
    <>
      <div style={{marginBottom:14}}>
        <label style={S.label}>Provincia</label>
        <select style={S.input} value={provincia} onChange={e=>{onProvincia(e.target.value);onCiudad("");}}>
          <option value="">Elegí una provincia</option>
          {provincias.map(p=><option key={p} value={p}>{p}</option>)}
        </select>
      </div>
      <div style={{marginBottom:14}}>
        <label style={S.label}>Localidad</label>
        <select style={S.input} value={ciudad} onChange={e=>onCiudad(e.target.value)} disabled={!provincia||cargando}>
          <option value="">{cargando?"Cargando...":provincia?"Elegí una localidad":"Elegí primero la provincia"}</option>
          {localidades.map(l=><option key={l} value={l}>{l}</option>)}
        </select>
      </div>
    </>
  );
}

// Filtro por ubicación para listas de pedidos recibidos: las opciones salen de lo que ya cargaron los pedidos (sin llamar a Georef de nuevo)
function FiltroUbicacion({pedidos,provincia,ciudad,onProvincia,onCiudad}){
  const provincias=[...new Set((pedidos||[]).map(p=>p.provincia).filter(Boolean))].sort();
  const ciudades=[...new Set((pedidos||[]).filter(p=>!provincia||p.provincia===provincia).map(p=>p.ciudad).filter(Boolean))].sort();
  if(provincias.length===0) return null;
  return(
    <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
      <select style={{...S.input,width:"auto",minWidth:170}} value={provincia} onChange={e=>{onProvincia(e.target.value);onCiudad("");}}>
        <option value="">📍 Todas las provincias</option>
        {provincias.map(p=><option key={p} value={p}>{p}</option>)}
      </select>
      {provincia&&(
        <select style={{...S.input,width:"auto",minWidth:170}} value={ciudad} onChange={e=>onCiudad(e.target.value)}>
          <option value="">Todas las localidades</option>
          {ciudades.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
      )}
    </div>
  );
}

function VistaBolsaTrabajo({usuario,notif}){

function PerfilTrabajador({usuario,notif}){
  const [perfil,setPerfil]=useState(null);
  const [cargando,setCargando]=useState(true);
  const [rubro,setRubro]=useState("");
  const [categoria,setCategoria]=useState("");
  const [especialidades,setEspecialidades]=useState("");
  const [anios,setAnios]=useState("");
  const [disponibilidad,setDisponibilidad]=useState("");
  const [descripcion,setDescripcion]=useState("");
  const [guardando,setGuardando]=useState(false);

  useEffect(()=>{(async()=>{
    try{
      const d=await db.select("perfiles_trabajador",`?usuario_id=eq.${usuario.id}&limit=1`);
      if(d&&d[0]){
        setPerfil(d[0]);
        setRubro(d[0].rubro||"");
        setCategoria(d[0].categoria||"");
        setEspecialidades(d[0].especialidades||"");
        setAnios(d[0].anios_experiencia!=null?String(d[0].anios_experiencia):"");
        setDisponibilidad(d[0].disponibilidad||"");
        setDescripcion(d[0].descripcion||"");
      }
    }catch{}
    setCargando(false);
  })();},[usuario.id]);

  const guardar=async()=>{
    if(!rubro||!categoria){ notif&&notif("Elegí rubro y categoría"); return; }
    setGuardando(true);
    try{
      const campos={usuario_id:usuario.id,rubro,categoria,especialidades:especialidades.trim()||null,anios_experiencia:anios?Number(anios):null,disponibilidad:disponibilidad||null,descripcion:descripcion.trim()||null};
      if(perfil){
        await db.updateMin("perfiles_trabajador",campos,`id=eq.${perfil.id}`);
        setPerfil(p=>({...p,...campos}));
      } else {
        const r=await db.insert("perfiles_trabajador",campos);
        setPerfil(r[0]);
      }
      notif&&notif("✅ Perfil guardado");
    }catch(e){ notif&&notif("No se pudo guardar el perfil"); }
    setGuardando(false);
  };

  if(cargando) return <div style={S.card}>Cargando...</div>;

  return(
    <div>
      <div style={S.cardTitle}>🧰 Mi perfil de trabajador</div>
      <div style={S.card}>
        <div style={{fontSize:15,color:C.textoSuave,marginBottom:16}}>Completá tu perfil para que las carpinterías, aserraderos, ferreterías, pinturerías y fletes te encuentren cuando buscan gente para trabajar.</div>

        <div style={{marginBottom:14}}>
          <label style={S.label}>Rubro</label>
          <div style={{display:"grid",gridTemplateColumns:"1fr",gap:8}}>
            {RUBROS_TRABAJADOR.map(r=>(
              <button key={r.id} type="button" style={{...S.tag(rubro===r.id),justifyContent:"center"}} onClick={()=>{setRubro(r.id);setCategoria("");}}>{r.emoji} {r.label}</button>
            ))}
          </div>
        </div>

        {rubro&&(
          <div style={{marginBottom:14}}>
            <label style={S.label}>Categoría</label>
            <select style={S.input} value={categoria} onChange={e=>setCategoria(e.target.value)}>
              <option value="">Elegí una categoría</option>
              {(CATEGORIAS_TRABAJADOR[rubro]||[]).map(c=><option key={c} value={c}>{c}</option>)}
            </select>
          </div>
        )}

        <div style={{marginBottom:14}}>
          <label style={S.label}>Especialidades / herramientas / maquinaria que manejás</label>
          <textarea style={{...S.input,minHeight:70}} value={especialidades} onChange={e=>setEspecialidades(e.target.value)} placeholder="Ej: sierra sinfín, cepilladora, carnet de conducir profesional, etc."/>
        </div>

        <div style={{marginBottom:14}}>
          <div style={{marginBottom:14}}>
            <label style={S.label}>Años de experiencia</label>
            <input type="number" min="0" style={S.input} value={anios} onChange={e=>setAnios(e.target.value)}/>
          </div>
          <div>
            <label style={S.label}>Disponibilidad</label>
            <select style={S.input} value={disponibilidad} onChange={e=>setDisponibilidad(e.target.value)}>
              <option value="">Elegí una opción</option>
              {Object.entries(DISPONIBILIDAD_LABEL).map(([k,v])=><option key={k} value={k}>{v}</option>)}
            </select>
          </div>
        </div>

        <div style={{marginBottom:16}}>
          <label style={S.label}>Contate un poco más (opcional)</label>
          <textarea style={{...S.input,minHeight:70}} value={descripcion} onChange={e=>setDescripcion(e.target.value)} placeholder="Experiencia, referencias, zona donde te movés, etc."/>
        </div>

        <div style={{fontSize:14,color:C.textoSuave,marginBottom:14}}>📍 Tu ubicación y teléfono son los que cargaste en "Mi cuenta". Revisalos ahí para que te puedan contactar.</div>

        <button style={S.btn("dark")} disabled={guardando} onClick={guardar}>{guardando?"Guardando...":"💾 Guardar perfil"}</button>
      </div>
    </div>
  );
}

function BuscarTrabajadores({usuario,notif}){
  const [rubroTab,setRubroTab]=useState(RUBROS_TRABAJADOR.some(r=>r.id===usuario.tipo)?usuario.tipo:"carpinteria");
  const [perfiles,setPerfiles]=useState([]);
  const [cargando,setCargando]=useState(true);
  const [filtroProv,setFiltroProv]=useState("");
  const [filtroCiu,setFiltroCiu]=useState("");

  const cargar=useCallback(async()=>{
    setCargando(true);
    try{
      const d=await db.select("perfiles_trabajador",`?rubro=eq.${rubroTab}&order=created_at.desc`);
      const ids=[...new Set(d.map(p=>p.usuario_id).filter(Boolean))];
      let usuarios={};
      if(ids.length){
        const us=await db.select("usuarios",`?id=in.(${ids.join(",")})&select=id,nombre,telefono,ciudad,provincia,email`);
        us.forEach(u=>{usuarios[u.id]=u;});
      }
      setPerfiles(d.map(p=>({...p,_usuario:usuarios[p.usuario_id]||{}})));
    }catch{ setPerfiles([]); }
    setCargando(false);
  },[rubroTab]);
  useEffect(()=>{cargar();},[cargar]);

  const filtrados=perfiles.filter(p=>{
    if(filtroProv&&p._usuario.provincia!==filtroProv) return false;
    if(filtroCiu&&p._usuario.ciudad!==filtroCiu) return false;
    return true;
  });
  const provincias=[...new Set(perfiles.map(p=>p._usuario.provincia).filter(Boolean))].sort();
  const ciudades=[...new Set(perfiles.filter(p=>!filtroProv||p._usuario.provincia===filtroProv).map(p=>p._usuario.ciudad).filter(Boolean))].sort();

  return(
    <div>
      <div style={S.cardTitle}>🧰 Bolsa de trabajo</div>
      <TabsConectadas opciones={RUBROS_TRABAJADOR.map(r=>[r.id,`${r.emoji} ${r.label}`])} activo={rubroTab} onChange={setRubroTab}/>

      {provincias.length>0&&(
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
          <select style={{...S.input,width:"auto",minWidth:170}} value={filtroProv} onChange={e=>{setFiltroProv(e.target.value);setFiltroCiu("");}}>
            <option value="">📍 Todas las provincias</option>
            {provincias.map(p=><option key={p} value={p}>{p}</option>)}
          </select>
          {filtroProv&&(
            <select style={{...S.input,width:"auto",minWidth:170}} value={filtroCiu} onChange={e=>setFiltroCiu(e.target.value)}>
              <option value="">Todas las localidades</option>
              {ciudades.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
          )}
        </div>
      )}

      {cargando?<div style={S.card}>Cargando...</div>:(
        filtrados.length===0?<div style={S.card}><div style={{color:C.textoSuave,textAlign:"center",padding:20}}>Todavía no hay trabajadores cargados en este rubro.</div></div>:
        filtrados.map(p=>(
          <div key={p.id} style={{...S.card,marginBottom:12,...(p.usuario_id===usuario.id?{borderColor:C.acento,borderWidth:2}:{})}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}>
              <div>
                <div style={{fontWeight:700,color:C.marron,fontSize:18}}>{p._usuario.nombre||"(sin nombre)"}{p.usuario_id===usuario.id&&<span style={{marginLeft:8,fontSize:12,fontWeight:700,color:C.marron,background:C.acento,padding:"2px 8px"}}>VOS</span>}</div>
                <div style={{fontSize:15,color:C.textoSuave,marginTop:2}}>{p.categoria}{p.anios_experiencia!=null?` · ${p.anios_experiencia} años de experiencia`:""}</div>
                {(p._usuario.ciudad||p._usuario.provincia)&&<div style={{fontSize:14,color:C.textoSuave,marginTop:2}}>📍 {[p._usuario.ciudad,p._usuario.provincia].filter(Boolean).join(", ")}</div>}
              </div>
              {p.disponibilidad&&<span style={{...S.badge("disponible"),fontSize:13}}>{DISPONIBILIDAD_LABEL[p.disponibilidad]||p.disponibilidad}</span>}
            </div>
            {p.especialidades&&<div style={{fontSize:15,color:C.texto,marginTop:10}}><b>Especialidades:</b> {p.especialidades}</div>}
            {p.descripcion&&<div style={{fontSize:15,color:C.texto,marginTop:6}}>{p.descripcion}</div>}
            <div style={{marginTop:12,display:"flex",gap:8,flexWrap:"wrap"}}>
              {p._usuario.telefono&&<a href={`tel:${p._usuario.telefono}`} style={{...S.btn("dark"),fontSize:15,textDecoration:"none"}}>📞 Llamar</a>}
              {p._usuario.email&&<button type="button" style={{...S.btn("ghost"),fontSize:15}} onClick={()=>{const em=p._usuario.email;try{navigator.clipboard.writeText(em);}catch{}notif&&notif(`✉️ ${em} (copiado)`);window.location.href=`mailto:${em}`;}}>✉️ {p._usuario.email}</button>}
              {!p._usuario.telefono&&!p._usuario.email&&<span style={{fontSize:14,color:C.textoSuave,fontStyle:"italic"}}>Este trabajador todavía no cargó datos de contacto.</span>}
            </div>
          </div>
        ))
      )}
    </div>
  );
}

function App(){
  const [sesion,setSesion]=useState(null);
  const [navTab,setNavTab]=useState("principal");
  const [notifMsg,setNotifMsg]=useState("");
  const [mostrarBienvenida,setMostrarBienvenida]=useState(true);
  const [menuAbierto,setMenuAbierto]=useState(false);
  const [enMiCuenta,setEnMiCuenta]=useState(false);
  const [enContacto,setEnContacto]=useState(false);
  const [enPapelera,setEnPapelera]=useState(false);
  const [enManual,setEnManual]=useState(false);
  const [suscInfo,setSuscInfo]=useState({cargando:true,vencida:false});
  const [cuentaTab,setCuentaTab]=useState("privado");
  const [idxPantalla,setIdxPantalla]=useState(0);
  const [maxIdxPantalla,setMaxIdxPantalla]=useState(0);
  const badges=useBadges(sesion?.usuario);

  // Navegación tipo navegador: cada pantalla (Mi cuenta, Manual, Contacto, Papelera, y las solapas principal/flete/bolsa/conversor)
  // queda registrada en el historial del navegador, para poder usar "← Atrás" / "Adelante →" (propios o del navegador) entre ellas.
  const aplicarPantalla=(desc)=>{
    setNavTab(desc.navTab||"principal");
    setEnMiCuenta(!!desc.enMiCuenta);
    setEnContacto(!!desc.enContacto);
    setEnPapelera(!!desc.enPapelera);
    setEnManual(!!desc.enManual);
    if(desc.cuentaTab) setCuentaTab(desc.cuentaTab);
    setMenuAbierto(false);
  };
  const cambiarPantalla=(cambios)=>{
    const desc={navTab,cuentaTab,enMiCuenta:false,enContacto:false,enPapelera:false,enManual:false,...cambios};
    aplicarPantalla(desc);
    const nuevoIdx=idxPantalla+1;
    try{ window.history.pushState({encastrePantalla:desc,idx:nuevoIdx},""); }catch{}
    setIdxPantalla(nuevoIdx);
    setMaxIdxPantalla(nuevoIdx);
  };

  useEffect(()=>{
    const usu=sesion?.usuario;
    const GRUPO_PAGA_LUEGO=["aserradero","ferreteria","pintureria","flete"];
    const esProveedorPago = usu&&(usu.tipo==="carpinteria"||GRUPO_PAGA_LUEGO.includes(usu.tipo));
    if(!usu||!esProveedorPago){ setSuscInfo({cargando:false,vencida:false}); return; }
    // Aserradero/ferretería/pinturería/flete son gratis durante el mes de lanzamiento (hasta FECHA_FIN_PROMO); recién ahí empieza a importar si tienen suscripción activa.
    if(GRUPO_PAGA_LUEGO.includes(usu.tipo)&&new Date()<FECHA_FIN_PROMO){
      const diasRestantes=Math.ceil((FECHA_FIN_PROMO-new Date())/86400000);
      setSuscInfo({cargando:false,vencida:false,diasRestantes,estado:"prueba"});
      return;
    }
    let cancelado=false;
    (async()=>{
      try{
        const filas=await db.select("suscripciones",`?usuario_id=eq.${usu.id}&order=creado_en.desc&limit=1`);
        const fila=filas[0];
        const vencida = fila ? new Date(fila.fecha_vencimiento) < new Date() : true;
        const diasRestantes = fila ? Math.ceil((new Date(fila.fecha_vencimiento)-new Date())/86400000) : null;
        if(!cancelado) setSuscInfo({cargando:false,vencida,diasRestantes,estado:fila?.estado||null});
      }catch{ if(!cancelado) setSuscInfo({cargando:false,vencida:true,diasRestantes:null,estado:null}); }
    })();
    return ()=>{cancelado=true;};
  },[sesion?.usuario?.id, sesion?.usuario?.tipo]);

  const [avisoDiasCerrado,setAvisoDiasCerrado]=useState(false);
  const cerrarAvisoDias=async()=>{
    setAvisoDiasCerrado(true);
    if(sesion?.usuario&&!sesion.usuario.vio_pantalla_prueba){
      try{ await db.updateMin("usuarios",{vio_pantalla_prueba:true},`id=eq.${sesion.usuario.id}`); }catch{}
      setSesion(s=>s?{...s,usuario:{...s.usuario,vio_pantalla_prueba:true}}:s);
    }
  };

  // Volver a la pantalla principal cerrando todo lo que esté abierto encima
  const irAPrincipal=(id)=>{
    cambiarPantalla({navTab:id});
    // aviso a las vistas hijas para que cierren cualquier pedido/cotización abierto
    try{ window.dispatchEvent(new CustomEvent("encastre-ir-principal")); }catch{}
  };

  const actualizarUsuario=(campos)=>{
    setSesion(s=>s?{...s,usuario:{...s.usuario,...campos}}:s);
  };

  useEffect(()=>{
    try{
      const s=localStorage.getItem("encastre_sesion");
      if(s){ const ses=JSON.parse(s); setSesion(ses); db.setSesion(ses); }
    }catch{}
    const vencida=()=>{
      setSesion(null);
      try{localStorage.removeItem("encastre_sesion");}catch{}
      alert("Tu sesión venció. Por favor, iniciá sesión de nuevo.");
    };
    window.addEventListener("encastre-sesion-vencida",vencida);

    // Pantalla raíz del historial de navegación interna, más el interceptor del botón "atrás" del dispositivo:
    // si hay una pantalla interna (Mi cuenta, Manual, etc.) para volver, se muestra esa; si no queda ninguna, se confirma salida.
    try{ window.history.pushState({encastre:true,idx:0},""); }catch{}
    const alVolver=(ev)=>{
      const st=ev.state;
      if(st&&st.encastrePantalla){
        aplicarPantalla(st.encastrePantalla);
        setIdxPantalla(st.idx||0);
        return;
      }
      if(st&&st.encastre){
        aplicarPantalla({navTab:"principal"});
        setIdxPantalla(0);
        return;
      }
      const salir=window.confirm("¿Desea salir de la aplicación?");
      if(salir){
        // dejar que el navegador vaya atrás de verdad
        window.removeEventListener("popstate",alVolver);
        window.history.back();
      }else{
        // re-empujar el estado para seguir interceptando
        try{ window.history.pushState({encastre:true,idx:0},""); }catch{}
        setIdxPantalla(0);
      }
    };
    window.addEventListener("popstate",alVolver);

    return ()=>{ window.removeEventListener("encastre-sesion-vencida",vencida); window.removeEventListener("popstate",alVolver); };
  },[]);

  const handleAuth=(s)=>{
    setSesion(s);
    db.setSesion(s);
    try{localStorage.setItem("encastre_sesion",JSON.stringify(s));}catch{}
    setNavTab("principal");
  };

  const darDeBaja=async()=>{
    if(!window.confirm("¿Seguro que querés dar de baja tu cuenta? No vas a poder volver a ingresar con ella. Solo la administración puede reactivarla."))return;
    try{
      await db.update("usuarios",{activo:false},`id=eq.${sesion?.usuario?.id}`);
    }catch(e){alert("No se pudo dar de baja: "+(e.message||"revisá tu conexión"));return;}
    await cerrar();
    setMostrarBienvenida(true);
    alert("Tu cuenta fue dada de baja. ¡Gracias por haber sido parte de Encastre!");
  };

  if(mostrarBienvenida&&!sesion) return <PantallaBienvenida onEntrar={()=>setMostrarBienvenida(false)}/>;
  if(!sesion) return <AuthScreen onAuth={handleAuth}/>;

  const {usuario}=sesion;
  const cerrar=async()=>{
    try{await db.signOut(sesion?.token);}catch{}
    db.limpiarSesion();
    setSesion(null);
    try{localStorage.removeItem("encastre_sesion");}catch{}
  };
  if(usuario.tipo==="admin") return <VistaAdmin usuario={usuario} onSalir={async()=>{await cerrar();setMostrarBienvenida(true);}}/>;
  if(suscInfo.cargando) return <div style={{...S.app,display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",fontSize:16,color:C.textoSuave}}>Cargando...</div>;
  if(!avisoDiasCerrado&&(usuario.tipo==="carpinteria"||["aserradero","ferreteria","pintureria","flete"].includes(usuario.tipo))&&suscInfo.diasRestantes!=null&&(suscInfo.diasRestantes<=7||!usuario.vio_pantalla_prueba)){
    return <AvisoDiasRestantes dias={suscInfo.diasRestantes} estado={suscInfo.estado} tipo={usuario.tipo} onDarDeBaja={darDeBaja} onContinuar={cerrarAvisoDias}/>;
  }
  const EMOJIS={cliente:"🪑",carpinteria:"🔨",aserradero:"🌲",flete:"🚚",ferreteria:"🔩",pintureria:"🖌️",trabajador:"🧰"};

  return(
    <div style={S.app}>
      <Notif msg={notifMsg} onClose={()=>setNotifMsg("")}/>

      {/* TOPBAR */}
      <div style={{...S.topbar,flexDirection:"column",alignItems:"stretch",gap:8,padding:"8px 12px"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",width:"100%",flexWrap:"wrap",rowGap:6}}>
          <div style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer"}} onClick={()=>irAPrincipal("principal")}>
            <img src={LOGO_B64} alt="Encastre" style={{width:34,height:34,objectFit:"contain",borderRadius:0,flexShrink:0}}/>
            <div className="encastre-logo-name" style={{fontSize:17}}>ENC<span style={{position:"relative",display:"inline-block"}}>A<span style={{position:"absolute",left:"50%",top:"60%",transform:"translate(-50%,-50%)",width:"0.24em",height:"0.24em",borderRadius:"50%",background:C.acento,display:"inline-block"}}/></span>STRE</div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <div style={{fontSize:18,color:C.crema,fontWeight:700,whiteSpace:"nowrap",fontFamily:"'Lato',sans-serif"}}>{usuario.nombre}</div>
            {usuario.tipo!=="flete"&&usuario.tipo!=="trabajador"&&(
              <button style={{background:navTab==="flete"?C.acento:"transparent",color:navTab==="flete"?C.marron:C.suave,border:`1px solid ${C.suave}44`,borderRadius:0,padding:"4px 10px",cursor:"pointer",fontSize:13,fontWeight:700,fontFamily:"'Lato',sans-serif"}} onClick={()=>irAPrincipal("flete")}>Fletes<Badge9 n={badges.flete}/></button>
            )}
            {["carpinteria","aserradero","ferreteria","pintureria","flete"].includes(usuario.tipo)&&(
              <button style={{background:navTab==="bolsa"?C.acento:"transparent",color:navTab==="bolsa"?C.marron:C.suave,border:`1px solid ${C.suave}44`,borderRadius:0,padding:"4px 10px",cursor:"pointer",fontSize:13,fontWeight:700,fontFamily:"'Lato',sans-serif"}} onClick={()=>irAPrincipal("bolsa")}>🧰 Bolsa de trabajo</button>
            )}
            <div style={{position:"relative"}}>
              <button aria-label="Menú" style={{background:"transparent",color:C.suave,border:`1px solid ${C.suave}44`,borderRadius:0,padding:"5px 12px",cursor:"pointer",fontSize:22,fontWeight:700,lineHeight:1,fontFamily:"'Lato',sans-serif"}} onClick={()=>setMenuAbierto(v=>!v)}>⋮</button>
              {menuAbierto&&(
                <>
                  <div onClick={()=>setMenuAbierto(false)} style={{position:"fixed",inset:0,zIndex:200}}/>
                  <div style={{position:"absolute",right:0,top:"calc(100% + 6px)",background:C.card,border:`1px solid ${C.borde}`,borderRadius:0,boxShadow:"0 6px 24px #5A4A3A44",zIndex:201,minWidth:190,overflow:"hidden"}}>
                    <div style={{padding:"12px 18px",borderBottom:`1px solid ${C.borde}`,fontSize:13,fontWeight:700,color:C.textoSuave,textTransform:"uppercase",letterSpacing:.5}}>{usuario.tipo}</div>
                    <button style={{display:"block",width:"100%",textAlign:"left",background:"transparent",border:"none",padding:"14px 18px",cursor:"pointer",fontSize:16,fontWeight:400,color:C.marron,fontFamily:"'Lato',sans-serif"}} onClick={()=>cambiarPantalla({enMiCuenta:true,cuentaTab:"privado"})}>Mi cuenta</button>
                    <button style={{display:"block",width:"100%",textAlign:"left",background:"transparent",border:"none",borderTop:`1px solid ${C.borde}`,padding:"14px 18px",cursor:"pointer",fontSize:16,fontWeight:400,color:C.marron,fontFamily:"'Lato',sans-serif"}} onClick={()=>cambiarPantalla({enManual:true})}>Manual</button>
                    {(usuario.tipo==="cliente"||usuario.tipo==="carpinteria")&&<button style={{display:"block",width:"100%",textAlign:"left",background:"transparent",border:"none",borderTop:`1px solid ${C.borde}`,padding:"14px 18px",cursor:"pointer",fontSize:16,fontWeight:400,color:C.marron,fontFamily:"'Lato',sans-serif"}} onClick={()=>irAPrincipal("conversor")}>Conversor</button>}
                    {usuario.tipo!=="admin"&&usuario.tipo!=="cliente"&&usuario.tipo!=="trabajador"&&<button style={{display:"block",width:"100%",textAlign:"left",background:suscInfo.vencida?"#C0392B22":"transparent",border:"none",borderTop:`1px solid ${C.borde}`,padding:"14px 18px",cursor:"pointer",fontSize:16,fontWeight:400,color:suscInfo.vencida?"#C0392B":C.marron,fontFamily:"'Lato',sans-serif"}} onClick={()=>cambiarPantalla({enMiCuenta:true,cuentaTab:"suscripcion"})}>Suscripción{suscInfo.vencida?" ⚠️":""}</button>}
                    <button style={{display:"block",width:"100%",textAlign:"left",background:"transparent",border:"none",borderTop:`1px solid ${C.borde}`,padding:"14px 18px",cursor:"pointer",fontSize:16,fontWeight:400,color:C.marron,fontFamily:"'Lato',sans-serif"}} onClick={()=>cambiarPantalla({enContacto:true})}>Reportar o comentar</button>
                    <button style={{display:"block",width:"100%",textAlign:"left",background:"transparent",border:"none",borderTop:`1px solid ${C.borde}`,padding:"14px 18px",cursor:"pointer",fontSize:16,fontWeight:400,color:C.marron,fontFamily:"'Lato',sans-serif"}} onClick={()=>cambiarPantalla({enPapelera:true})}>Papelera</button>
                    <button style={{display:"block",width:"100%",textAlign:"left",background:"transparent",border:"none",borderTop:`1px solid ${C.borde}`,padding:"14px 18px",cursor:"pointer",fontSize:16,fontWeight:400,color:C.marron,fontFamily:"'Lato',sans-serif"}} onClick={()=>{setMenuAbierto(false);cerrar();setMostrarBienvenida(true);}}>Salir</button>
                  </div>
                </>
              )}
            </div>
          </div>
        </div>
      </div>

      {/* CONTENIDO */}
      <div style={S.main}>
        {(idxPantalla>0||idxPantalla<maxIdxPantalla)&&(
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
            <div>{idxPantalla>0&&<button type="button" style={{...S.btn("link"),background:"transparent"}} onClick={()=>window.history.back()}>← Atrás</button>}</div>
            <div>{idxPantalla<maxIdxPantalla&&<button type="button" style={{...S.btn("link"),background:"transparent"}} onClick={()=>window.history.forward()}>Adelante →</button>}</div>
          </div>
        )}
        {enMiCuenta ? (
          <MiCuenta usuario={usuario} onCerrar={()=>window.history.back()} onActualizar={actualizarUsuario} onDarDeBaja={darDeBaja} tabInicial={cuentaTab}/>
        ) : enContacto ? (
          <ContactoUnificado usuario={usuario} onCerrar={()=>window.history.back()}/>
        ) : enPapelera ? (
          <Papelera usuario={usuario} onCerrar={()=>window.history.back()}/>
        ) : enManual ? (
          <ManualUsuario tipo={usuario.tipo} onCerrar={()=>window.history.back()}/>
        ) : (
          <>
            {navTab==="principal"&&usuario.tipo==="cliente"&&<VistaCliente usuario={usuario} notif={setNotifMsg}/>}
            {navTab==="principal"&&usuario.tipo==="carpinteria"&&<VistaCarpinteria usuario={usuario} notif={setNotifMsg} bloqueadoClientes={suscInfo.vencida} onIrASuscripcion={()=>cambiarPantalla({enMiCuenta:true,cuentaTab:"suscripcion"})}/>}
            {navTab==="principal"&&usuario.tipo==="aserradero"&&<VistaAserradero usuario={usuario} notif={setNotifMsg} bloqueado={suscInfo.vencida} onIrASuscripcion={()=>cambiarPantalla({enMiCuenta:true,cuentaTab:"suscripcion"})}/>}
            {navTab==="principal"&&usuario.tipo==="flete"&&<VistaFlete usuario={usuario} notif={setNotifMsg} bloqueado={suscInfo.vencida} onIrASuscripcion={()=>cambiarPantalla({enMiCuenta:true,cuentaTab:"suscripcion"})}/>}
            {navTab==="principal"&&usuario.tipo==="ferreteria"&&<VistaFerreteria usuario={usuario} notif={setNotifMsg} bloqueado={suscInfo.vencida} onIrASuscripcion={()=>cambiarPantalla({enMiCuenta:true,cuentaTab:"suscripcion"})}/>}
            {navTab==="principal"&&usuario.tipo==="pintureria"&&<VistaPintureria usuario={usuario} notif={setNotifMsg} bloqueado={suscInfo.vencida} onIrASuscripcion={()=>cambiarPantalla({enMiCuenta:true,cuentaTab:"suscripcion"})}/>}
            {navTab==="principal"&&usuario.tipo==="trabajador"&&<VistaBolsaTrabajo usuario={usuario} notif={setNotifMsg}/>}
            {navTab==="flete"&&<VistaFlete usuario={usuario} notif={setNotifMsg} bloqueado={suscInfo.vencida} onIrASuscripcion={()=>cambiarPantalla({enMiCuenta:true,cuentaTab:"suscripcion"})}/>}
            {navTab==="bolsa"&&<VistaBolsaTrabajo usuario={usuario} notif={setNotifMsg}/>}
            {navTab==="conversor"&&<VistaConversor/>}
          </>
        )}
      </div>
    </div>
  );
}

// Página legal pública, accesible sin login (para Google Play, motores de búsqueda, etc.): https://encastre.com.ar/?legal=privacidad o ?legal=terminos
function PaginaLegalPublica({tipo}){
  const clausulas = tipo==="terminos" ? TERMINOS_CLAUSULAS : PRIVACIDAD_CLAUSULAS;
  const titulo = tipo==="terminos" ? "📋 Términos y Condiciones" : "🔒 Política de Privacidad";
  return(
    <div style={{maxWidth:720,margin:"0 auto",padding:"32px 20px",fontFamily:"'Lato',sans-serif",background:C.fondo,minHeight:"100vh"}}>
      <div style={{fontSize:23,fontWeight:700,color:C.marron,marginBottom:16}}>{titulo}</div>
      {clausulas.map((c,i)=>(
        <div key={i} style={{marginBottom:18}}>
          <div style={{fontWeight:700,color:C.marron,marginBottom:4,fontSize:16}}>{c.t}</div>
          <div style={{fontSize:15,color:C.textoSuave,lineHeight:1.5}}>{c.d}</div>
        </div>
      ))}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
const _legalParam = new URLSearchParams(window.location.search).get('legal');
if(_legalParam==="privacidad"||_legalParam==="terminos"){
  root.render(React.createElement(PaginaLegalPublica,{tipo:_legalParam}));
} else {
  root.render(React.createElement(App));
}
  </script>
</body>
</html>
