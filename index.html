      color: #C4892A !important;
      text-transform: uppercase !important;

    ::-webkit-scrollbar-thumb { background:#C4892A66; border-radius:3px; }

    input, textarea, select { font-size: 15px !important; padding: 10px 13px !important; }

      /* Inputs más grandes para touch */
      input, textarea, select { font-size: 16px !important; }
      
      /* Cards con menos padding */
      .card-mobile { padding: 12px !important; }

      /* Botones con altura mínima para touch */
      button { min-height: 38px; }

      /* Ocultar subtítulo topbar en mobile */
      .logo-sub-mobile { display: none; }

      /* Imagen logo más pequeña en topbar */
      .logo-img-mobile { width: 34px !important; height: 34px !important; }

      .tabs-mobile { 
        overflow-x: auto; 
        white-space: nowrap; 
        -webkit-overflow-scrolling: touch;
        padding-bottom: 4px;
      }
      .tabs-mobile button { 
        display: inline-flex !important;
        white-space: nowrap;
      }

      /* Row en columna en mobile */
      .row-mobile { flex-direction: column !important; }
    }

// ─── CONTADORES DE NOVEDADES (cotizaciones sin abrir + mensajes sin leer) ───
function useBadges(usuario){
  const [badges,setBadges]=useState({aserradero:0,ferreteria:0,pintureria:0,flete:0,pedidos:0});
  const calc=useCallback(async()=>{
    if(!usuario||!usuario.id)return;
    const cuenta={aserradero:0,ferreteria:0,pintureria:0,flete:0,pedidos:0};
    // Paso 1 - Mensajes sin leer, agrupados por tipo_pedido
    try{
      const ms=await db.select("mensajes",`?para_usuario_id=eq.${usuario.id}&leido=eq.false&select=tipo_pedido`);
      ms.forEach(m=>{
        const t=m.tipo_pedido;
        if(t==="aserradero")cuenta.aserradero++;
        else if(t==="ferreteria")cuenta.ferreteria++;
        else if(t==="pintureria")cuenta.pintureria++;
        else if(t==="flete")cuenta.flete++;
        else cuenta.pedidos++; // chat del circuito cliente↔carpintería
      });
    }catch{}
    // Paso 2 - Cotizaciones sin abrir en los pedidos que YO hice
    const rubros=[
      ["pedidos_aserradero","cotizaciones_aserradero","visto_carpinteria","carpinteria_id","aserradero"],
      ["pedidos_ferreteria","cotizaciones_ferreteria","visto_carpinteria","carpinteria_id","ferreteria"],
      ["pedidos_pintureria","cotizaciones_pintureria","visto_carpinteria","carpinteria_id","pintureria"],
      ["pedidos_flete","cotizaciones_flete","visto_solicitante","solicitante_id","flete"],
    ];
    for(const [tPed,tCot,campo,dueño,clave] of rubros){
      try{
        const ps=await db.select(tPed,`?${dueño}=eq.${usuario.id}&select=id`);
        if(!ps.length)continue;
        const ids=ps.map(p=>p.id).join(",");
        const cs=await db.select(tCot,`?pedido_id=in.(${ids})&${campo}=eq.false&select=id`);
        cuenta[clave]+=cs.length;
      }catch{}
    }
    // Paso 3 - Presupuestos sin ver, para el cliente que pidio a carpinterias
    if(usuario.tipo==="cliente"){
      try{
        const ps=await db.select("pedidos",`?cliente_id=eq.${usuario.id}&select=id`);
        if(ps.length){
          const ids=ps.map(p=>p.id).join(",");
          const prs=await db.select("presupuestos",`?pedido_id=in.(${ids})&visto_cliente=eq.false&select=id`);
          cuenta.pedidos+=prs.length;
        }
      }catch{}
    }
    // Paso 4 - Pedidos NUEVOS que le llegaron a este proveedor y todavia no abrio
    const comoProveedor={
      carpinteria:["pedidos","pedidos"],
      aserradero:["pedidos_aserradero","aserradero"],
      ferreteria:["pedidos_ferreteria","ferreteria"],
      pintureria:["pedidos_pintureria","pintureria"],
      flete:["pedidos_flete","flete"],
    }[usuario.tipo];
    if(comoProveedor){
      const [tabla,tipo]=comoProveedor;
      try{
        const ps=await db.select(tabla,"?select=id");
        if(ps.length){
          const vistas=await db.select("vistas_pedido",`?usuario_id=eq.${usuario.id}&tipo_pedido=eq.${tipo}&select=pedido_id`);
          const yaVistos=new Set(vistas.map(v=>v.pedido_id));
          const sinVer=ps.filter(p=>!yaVistos.has(p.id)).length;
          const clave=usuario.tipo==="carpinteria"?"pedidos":usuario.tipo;
          cuenta[clave]+=sinVer;
        }
      }catch{}
    }
    setBadges(cuenta);
  },[usuario]);
  useEffect(()=>{
    calc();
    const t=setInterval(calc,20000);
    if(typeof window!=="undefined"){
      if(!window.__badgeRefreshers) window.__badgeRefreshers=new Set();
      window.__badgeRefreshers.add(calc);
    }
    return()=>{
      clearInterval(t);
      if(typeof window!=="undefined"&&window.__badgeRefreshers) window.__badgeRefreshers.delete(calc);
    };
  },[calc]);
  return badges;
}

// ─── PRESUPUESTOS: cálculo de totales ───────────────────────────────────────
const nmb = v => { const n=Number(v); return isFinite(n)?n:0; };
const fmtPeso = v => "$ "+nmb(v).toLocaleString("es-AR",{minimumFractionDigits:0,maximumFractionDigits:2});
// items: [{descripcion,precio,cantidad}] ; opts: {usarDesc,descTipo,descValor,usarIva,ivaPct}
function calcularPresup(items, opts){
  const filas=(items||[]).map(it=>({...it, importe: nmb(it.precio)*nmb(it.cantidad)}));
  const subtotal=filas.reduce((a,f)=>a+f.importe,0);
  let descuento=0;
  if(opts&&opts.usarDesc){
    descuento = opts.descTipo==="porcentaje" ? subtotal*(nmb(opts.descValor)/100) : nmb(opts.descValor);
  }
  if(descuento>subtotal) descuento=subtotal;
  const baseImponible=subtotal-descuento;
  const iva = (opts&&opts.usarIva) ? baseImponible*(nmb(opts.ivaPct)/100) : 0;
  const total=baseImponible+iva;
  return {filas, subtotal, descuento, baseImponible, iva, total};
}

function Badge({e}){ return <span style={S.badge(e)}>{EL[e]||e}</span>; }

// Fechas en horario LOCAL (evita el corrimiento de un día que daba toISOString en UTC-3)
const aISO=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const masDias=n=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);return aISO(d);};
const minFechaLimite=()=>masDias(1); // mínimo: mañana (un pedido no puede vencer hoy)
// Convierte el valor del input date a timestamp de fin de día
const fechaLimiteISO=v=>v?new Date(v+"T23:59:59").toISOString():null;
const estaVencido=p=>!!(p.fecha_limite&&new Date(p.fecha_limite)<new Date());

// Calcula el estado de vencimiento de un pedido a partir de su fecha_limite
function estadoVence(fechaLimite){
  if(!fechaLimite) return null;
  const ahora=new Date();
  const lim=new Date(fechaLimite);
  const ms=lim-ahora;
  const dia=86400000;
  if(ms<0) return {tipo:"vencido",texto:"⛔ Vencido",color:"#B23A2E"};
  if(ms<dia) return {tipo:"hoy",texto:"⏰ Vence hoy",color:"#C0392B"};
  if(ms<2*dia) return {tipo:"manana",texto:"⏳ Vence mañana",color:"#D68910"};
  const dias=Math.ceil(ms/dia);
  return {tipo:"abierto",texto:`📅 Vence en ${dias} días`,color:"#7A6A55"};
}
function AvisoVence({fechaLimite}){
  const v=estadoVence(fechaLimite);
  if(!v) return null;
  return <span style={{display:"inline-block",background:v.color+"18",color:v.color,border:`1px solid ${v.color}55`,borderRadius:0,padding:"2px 8px",fontSize:14,fontWeight:600,marginTop:4}}>{v.texto}</span>;
}

function Stars({v=0}){
  return <span style={{color:C.acento,fontSize:16}}>
    {"★".repeat(Math.round(v))}{"☆".repeat(5-Math.round(v))}
    <span style={{color:C.textoSuave,marginLeft:4,fontSize:16}}>{Number(v).toFixed(1)}</span>
  </span>;
}

function Notif({msg,onClose}){
  useEffect(()=>{ if(msg){ const t=setTimeout(onClose,3500); return()=>clearTimeout(t); } },[msg]);
  if(!msg) return null;
  return <div style={S.notif} className="fade">🪵 {msg}</div>;
}

function AuthScreen({onAuth}){
  const [modo,setModo]=useState("login");
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [verPass,setVerPass]=useState(false);
  const [nombre,setNombre]=useState("");
  const [tipo,setTipo]=useState("");
  const [ciudad,setCiudad]=useState("");
  const [provincia,setProvincia]=useState("");
  const [err,setErr]=useState("");
  const [ok,setOk]=useState("");
  const [cargando,setCargando]=useState(false);
  const [entidad,setEntidad]=useState("");
  const [documento,setDocumento]=useState("");
  const [captchaToken,setCaptchaToken]=useState("");
  const captchaWidgetId=useRef(null);
  const CAPTCHA_SITE_KEY="0x4AAAAAAEQA-qNlI1IMVVKL";

  useEffect(()=>{
    let intentos=0;
    const montar=()=>{
      if(window.turnstile&&document.getElementById("cf-turnstile-widget")){
        if(captchaWidgetId.current!==null){ try{window.turnstile.remove(captchaWidgetId.current);}catch{} }
        captchaWidgetId.current=window.turnstile.render("#cf-turnstile-widget",{
          sitekey:CAPTCHA_SITE_KEY,
          callback:(token)=>setCaptchaToken(token),
          "expired-callback":()=>setCaptchaToken(""),
          "error-callback":()=>setCaptchaToken(""),
        });
      } else if(intentos<20){ intentos++; setTimeout(montar,250); }
    };
    montar();
    return ()=>{ if(window.turnstile&&captchaWidgetId.current!==null){ try{window.turnstile.remove(captchaWidgetId.current);}catch{} } };
  },[modo]);

  const resetCaptcha=()=>{
    if(window.turnstile&&captchaWidgetId.current!==null){ try{window.turnstile.reset(captchaWidgetId.current);}catch{} }
    setCaptchaToken("");
  };

  const soloDigitos=s=>(s||"").replace(/\D/g,"");
  const validarCUIT=(raw)=>{
    const c=soloDigitos(raw);
    if(c.length!==11) return false;
    const mult=[5,4,3,2,7,6,5,4,3,2];
    let suma=0; for(let i=0;i<10;i++) suma+=parseInt(c[i],10)*mult[i];
    let ver=11-(suma%11); if(ver===11) ver=0;
    if(ver===10) return false;
    return ver===parseInt(c[10],10);
  };
  const validarDNI=(raw)=>{ const d=soloDigitos(raw); return d.length>=7&&d.length<=8; };

  const tipos=[
    {id:"cliente",emoji:"🪑",label:"Consumidor Final",desc:"Quiero encargar muebles o construcciones en madera"},
    {id:"carpinteria",emoji:"🔨",label:"Carpintería",desc:"Recibo pedidos y presupuesto trabajos"},
    {id:"aserradero",emoji:"🪵",label:"Aserradero",desc:"Vendo madera a carpinterías y negocios"},
    {id:"flete",emoji:"🚚",label:"Flete / Transporte",desc:"Traslado muebles y materiales"},
    {id:"ferreteria",emoji:"🔩",label:"Ferretería / Herrajes",desc:"Vendo herrajes, bisagras y materiales a carpinterías"},
    {id:"pintureria",emoji:"🎨",label:"Pinturería",desc:"Vendo pinturas, barnices, lacas y esmaltes a carpinterías"},
  ];

  const submit=async()=>{
    setErr("");setOk("");setCargando(true);
    try{
      if(modo==="registro"){
        if(!tipo||!nombre){setErr("Completá todos los campos");setCargando(false);return;}
        if(!entidad){setErr("Elegí si sos empresa o persona");setCargando(false);return;}
        if(entidad==="empresa"&&!validarCUIT(documento)){setErr("El CUIT no parece válido. Revisá que tenga los 11 números correctos.");setCargando(false);return;}
        if(entidad==="persona"&&!validarDNI(documento)){setErr("El DNI no parece válido. Debe tener 7 u 8 números, sin puntos.");setCargando(false);return;}
        const tipoDoc=entidad==="empresa"?"CUIT":"DNI";
        const docLimpio=soloDigitos(documento);
        const signUpRes=await db.signUp(email.trim().toLowerCase(),pass,captchaToken);
        if(!signUpRes._httpOk){
          const rawMsg=(signUpRes.msg||signUpRes.error_description||signUpRes.message||(typeof signUpRes.error==="string"?signUpRes.error:signUpRes.error?.message)||"").toString();
          const msgErr=rawMsg.toLowerCase();
          const yaRegistrado=msgErr.includes("already registered")||msgErr.includes("already exists")||msgErr.includes("already been registered");
          const passDebil=msgErr.includes("password")&&(msgErr.includes("character")||msgErr.includes("weak")||msgErr.includes("least"));
          setErr(yaRegistrado?"No pudimos completar el registro con esos datos. Si ya tenés una cuenta, iniciá sesión, o usá '¿Olvidaste tu contraseña?' para recuperarla.":passDebil?"La contraseña no cumple los requisitos: mínimo 8 caracteres, con mayúsculas, minúsculas, números y símbolos.":(rawMsg||"No se pudo completar el registro. Revisá los datos e intentá de nuevo."));
          resetCaptcha();setCargando(false);return;
        }
        let tokenReg=signUpRes.access_token?{token:signUpRes.access_token,refresh:signUpRes.refresh_token,expira:Date.now()+((signUpRes.expires_in||3600)*1000)}:null;
        let userId=(signUpRes.data?.user||signUpRes.user||signUpRes)?.id||signUpRes?.id;
        if(!tokenReg){
          // El mail ya tenía credencial (intento anterior). Probamos entrar con esa clave para completar la ficha.
          const reIn=await db.signIn(email.trim().toLowerCase(),pass,captchaToken);
          if(reIn.access_token){
            tokenReg={token:reIn.access_token,refresh:reIn.refresh_token,expira:Date.now()+((reIn.expires_in||3600)*1000)};
            userId=reIn.user?.id||userId;
            // Si ya tiene ficha, no hay nada que crear: que inicie sesión directamente
            db.setSesion(tokenReg);
            try{
              const ya=await db.select("usuarios",`?auth_id=eq.${userId}&limit=1`);
              if(ya.length>0){ db.limpiarSesion(); setOk("Esa cuenta ya existe y está completa. Iniciá sesión."); setModo("login"); setCargando(false); return; }
            }catch{}
          } else {
            resetCaptcha();
            setErr("No pudimos completar el registro con esos datos. Si ya tenés una cuenta, iniciá sesión, o usá '¿Olvidaste tu contraseña?' para recuperarla.");
            setCargando(false);
            return;
          }
        }
        // Presentarse ante la base con la credencial, para poder crear la propia ficha
        db.setSesion(tokenReg);
        const emailLimpio=email.trim().toLowerCase();
        try{
          let nuevoUsuario;
          if(!userId){
            nuevoUsuario=await db.insert("usuarios",{tipo,nombre,email:emailLimpio,ciudad,provincia:provincia||null,tipo_documento:tipoDoc,documento:docLimpio});
          } else {
            nuevoUsuario=await db.insert("usuarios",{auth_id:userId,tipo,nombre,email:emailLimpio,ciudad,provincia:provincia||null,tipo_documento:tipoDoc,documento:docLimpio});
          }
          if(tipo!=="cliente"){
            const idNuevo=(nuevoUsuario&&nuevoUsuario[0]&&nuevoUsuario[0].id)||null;
            if(idNuevo){
              const vencePrueba=new Date(); vencePrueba.setDate(vencePrueba.getDate()+30);
              try{ await db.insert("suscripciones",{usuario_id:idNuevo,estado:"prueba",fecha_vencimiento:vencePrueba.toISOString()}); }catch{}
            }
          }
        } finally { db.limpiarSesion(); }
        setOk("¡Cuenta creada! Ahora iniciá sesión.");
        setModo("login");
      }else{
        const signInRes=await db.signIn(email.trim().toLowerCase(),pass,captchaToken);
        const access_token=signInRes.access_token;
        const error=signInRes.error;
        if(error||!access_token){resetCaptcha();setErr("Email o contraseña incorrectos");setCargando(false);return;}
        // Presentarse ante la base antes de buscar el perfil (necesario con la seguridad activada)
        db.setSesion({token:access_token,refresh:signInRes.refresh_token,expira:Date.now()+((signInRes.expires_in||3600)*1000)});
        const uidAuth=signInRes.user?.id;
        let perfiles=[];
        if(uidAuth){ try{ perfiles=await db.select("usuarios",`?auth_id=eq.${uidAuth}&limit=1`); }catch{} }
        if(perfiles.length===0){ try{ perfiles=await db.select("usuarios",`?email=eq.${encodeURIComponent(email.trim().toLowerCase())}&limit=1`); }catch{} }
        if(perfiles.length===0){db.limpiarSesion();setErr("Perfil no encontrado");setCargando(false);return;}
        if(perfiles[0].activo===false){db.limpiarSesion();setErr("Esta cuenta fue dada de baja. Escribí a carpinteriavetaraiz@gmail.com si querés reactivarla.");setCargando(false);return;}
        if(perfiles[0].suspendido_hasta&&new Date(perfiles[0].suspendido_hasta)>new Date()){db.limpiarSesion();setErr(`Esta cuenta está suspendida hasta el ${new Date(perfiles[0].suspendido_hasta).toLocaleDateString("es-AR")}. Escribí a administracion@encastre.com.ar si tenés dudas.`);setCargando(false);return;}
        console.log("Usuario al login:",perfiles[0]);
        onAuth({token:access_token,refresh:signInRes.refresh_token,expira:Date.now()+((signInRes.expires_in||3600)*1000),usuario:perfiles[0]});
      }
    }catch(e){setErr("Error: "+(e.message||"Revisá tu conexión"));}
    if(window.turnstile&&captchaWidgetId.current!==null){ try{window.turnstile.reset(captchaWidgetId.current);}catch{} }
    setCaptchaToken("");
    setCargando(false);
  };

  return(
    <div style={{...S.app,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",padding:20,background:`linear-gradient(160deg,${C.crema} 60%,${C.suave} 100%)`}}>
      {/* Logo */}
      <div style={{textAlign:"center",marginBottom:32}}>
        <img src={LOGO_B64} alt="Encastre" style={{width:280,maxWidth:"85vw",height:"auto",objectFit:"contain",margin:"0 auto",display:"block"}}/>
        <div style={{fontFamily:"'Lato',sans-serif",fontSize:40,fontWeight:700,color:C.marron,letterSpacing:3,textTransform:"uppercase"}}>ENCASTRE</div>
        <div style={{fontSize:17,color:C.textoSuave,letterSpacing:3,textTransform:"uppercase",marginTop:1}}>La Comunidad de la Madera</div>
        <div style={{width:60,height:3,background:`linear-gradient(90deg,${C.acento},${C.marron})`,borderRadius:0,margin:"12px auto 0"}}/>
      </div>

      <div style={{...S.card,width:"100%",maxWidth:420,padding:28}}>
        <div style={{display:"flex",gap:8,marginBottom:22}}>
          {["login","registro"].map(m=>(
            <button key={m} style={{...S.btn(modo===m?"dark":"ghost"),flex:1,justifyContent:"center",fontSize:16}} onClick={()=>setModo(m)}>
              {m==="login"?"Iniciar sesión":"Crear cuenta"}
            </button>
          ))}
        </div>

        {modo==="registro"&&(
          <>
