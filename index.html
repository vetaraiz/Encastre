  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { background:#F7EDE2; font-size:17px; font-family:'Lato',sans-serif; color:#2D3436; }
    ::-webkit-scrollbar { width:6px; }

    /* TAMAÑOS COHERENTES */
    #root * { box-sizing: border-box; }
    #root input, #root textarea, #root select { 
      font-size: 17px; 
    }
    #root button { 
      min-height: 48px;
    }
    /* Topbar: logo arriba, ENCASTRE abajo, eslogan abajo */
    .encastre-topbar-brand {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      line-height: 1.25 !important;
    }
    .encastre-logo-name {
      font-family: 'Stardos Stencil', serif !important;
      font-size: 22px !important;
      font-weight: 700 !important;
      color: #F7EDE2 !important;
      text-transform: uppercase !important;
      letter-spacing: 1px !important;
    }
    .encastre-logo-sub {
      font-size: 12px !important;
      color: #F2D3A0 !important;
      text-transform: uppercase !important;
      letter-spacing: 2px !important;
    }
    @media print {
      body.imprimiendo * { visibility: hidden !important; }
      body.imprimiendo [data-imprimir], body.imprimiendo [data-imprimir] * { visibility: visible !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      body.imprimiendo [data-imprimir] { position: absolute; left: 0; top: 0; width: 100%; }
      body.imprimiendo [data-imprimir] [style*="overflow"] { overflow: visible !important; }
    }
    ::-webkit-scrollbar-track { background:#F7EDE2; }
    ::-webkit-scrollbar-thumb { background:#C9A06A99; border-radius:3px; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
    .fade { animation: fadeIn .3s ease; }

    /* ═══ GLOBAL SIZE OVERRIDES ═══ */
    body { font-size: 16px; }
    input, textarea, select { font-size: 15px !important; padding: 10px 13px !important; }
    button { font-size: 14px !important; }

    /* MOBILE RESPONSIVE */
    @media (max-width: 640px) {
      /* Inputs más grandes para touch */
      input, textarea, select { font-size: 16px !important; }
      
      /* Cards con menos padding */
      .card-mobile { padding: 12px !important; }

      /* Botones con altura mínima para touch */
      button { min-height: 38px; }

      /* Ocultar subtítulo topbar en mobile */
      .logo-sub-mobile { display: none; }

      /* Imagen logo más pequeña en topbar */
      .logo-img-mobile { width: 34px !important; height: 34px !important; }

      /* Tabs con scroll horizontal */
      .tabs-mobile { 
        overflow-x: auto; 
        white-space: nowrap; 
        -webkit-overflow-scrolling: touch;
        padding-bottom: 4px;
      }
      .tabs-mobile button { 
        display: inline-flex !important;
        white-space: nowrap;
      }

      /* Row en columna en mobile */
      .row-mobile { flex-direction: column !important; }
    }

function useBadges(usuario) {

    aserradero: 0,
    ferreteria: 0,
    pintureria: 0,
    flete: 0,
    pedidos: 0
  });

    if (!usuario || !usuario.id) return;
    const cuenta = {
      aserradero: 0,
      ferreteria: 0,
      pintureria: 0,
      flete: 0,
      pedidos: 0
    };
    // Paso 1 - Mensajes sin leer, agrupados por tipo_pedido
    try {
      const ms = await db.select("mensajes", `?para_usuario_id=eq.${usuario.id}&leido=eq.false&select=tipo_pedido`);
      ms.forEach(m => {
        const t = m.tipo_pedido;
        if (t === "aserradero") cuenta.aserradero++;else if (t === "ferreteria") cuenta.ferreteria++;else if (t === "pintureria") cuenta.pintureria++;else if (t === "flete") cuenta.flete++;else cuenta.pedidos++; // chat del circuito cliente↔carpintería
      });
    } catch {}
    // Paso 2 - Cotizaciones sin abrir en los pedidos que YO hice
    const rubros = [["pedidos_aserradero", "cotizaciones_aserradero", "visto_carpinteria", "carpinteria_id", "aserradero"], ["pedidos_ferreteria", "cotizaciones_ferreteria", "visto_carpinteria", "carpinteria_id", "ferreteria"], ["pedidos_pintureria", "cotizaciones_pintureria", "visto_carpinteria", "carpinteria_id", "pintureria"], ["pedidos_flete", "cotizaciones_flete", "visto_solicitante", "solicitante_id", "flete"]];
    for (const [tPed, tCot, campo, dueño, clave] of rubros) {
      try {
        const ps = await db.select(tPed, `?${dueño}=eq.${usuario.id}&select=id`);
        if (!ps.length) continue;
        const ids = ps.map(p => p.id).join(",");
        const cs = await db.select(tCot, `?pedido_id=in.(${ids})&${campo}=eq.false&select=id`);
        cuenta[clave] += cs.length;
      } catch {}
    }
    // Paso 3 - Presupuestos sin ver, para el cliente que pidio a carpinterias
    if (usuario.tipo === "cliente") {
      try {
        const ps = await db.select("pedidos", `?cliente_id=eq.${usuario.id}&select=id`);
        if (ps.length) {
          const ids = ps.map(p => p.id).join(",");
          const prs = await db.select("presupuestos", `?pedido_id=in.(${ids})&visto_cliente=eq.false&select=id`);
          cuenta.pedidos += prs.length;
        }
      } catch {}
    }
    // Paso 4 - Pedidos NUEVOS que le llegaron a este proveedor y todavia no abrio
    const comoProveedor = {
      carpinteria: ["pedidos", "pedidos"],
      aserradero: ["pedidos_aserradero", "aserradero"],
      ferreteria: ["pedidos_ferreteria", "ferreteria"],
      pintureria: ["pedidos_pintureria", "pintureria"],
      flete: ["pedidos_flete", "flete"]
    }[usuario.tipo];
    if (comoProveedor) {
      const [tabla, tipo] = comoProveedor;
      try {
        const ps = await db.select(tabla, "?select=id");
        if (ps.length) {

function cargarScriptExt(src) {
  return new Promise((ok, mal) => {
    const ya = document.querySelector(`script[data-ext="${src}"]`);
    if (ya) {
      if (ya.dataset.listo) return ok();
      ya.addEventListener("load", () => ok());
      ya.addEventListener("error", () => mal(new Error("No se pudo cargar")));
      return;
    }
    const sc = document.createElement("script");
    sc.src = src;
    sc.dataset.ext = src;
    sc.onload = () => {
      sc.dataset.listo = "1";
      ok();
    };
    sc.onerror = () => mal(new Error("No se pudo cargar"));
    document.head.appendChild(sc);
  });
}
