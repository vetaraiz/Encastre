// ─── CHAT ─────────────────────────────────────────────────────────────────────
function Chat({pedidoId,tipoPedido,miUsuario,otroUsuario,onLeido}){
  const [msgs,setMsgs]=useState([]);
  const [txt,setTxt]=useState("");
  const [bloqueoMio,setBloqueoMio]=useState(null);
  const [meBloquearon,setMeBloquearon]=useState(false);
  const endRef=useRef(null);
  const otroId=otroUsuario?.id;

  const cargar=useCallback(async()=>{
    try{
      const filtroPareja=otroId?`&or=(and(de_usuario_id.eq.${miUsuario.id},para_usuario_id.eq.${otroId}),and(de_usuario_id.eq.${otroId},para_usuario_id.eq.${miUsuario.id}))`:"";
      const d=await db.select("mensajes",`?pedido_id=eq.${pedidoId}&tipo_pedido=eq.${tipoPedido}${filtroPareja}&order=created_at.asc`);
      setMsgs(d);
      // Marcar como leídos los que me llegaron a mí y todavía no lo estaban
      const noLeidos=d.filter(m=>m.para_usuario_id===miUsuario.id&&!m.leido);
      if(noLeidos.length>0){
        try{
          await db.update("mensajes",{leido:true},`pedido_id=eq.${pedidoId}&tipo_pedido=eq.${tipoPedido}&para_usuario_id=eq.${miUsuario.id}&leido=eq.false`);
          refrescarBadgesGlobal();
          if(onLeido) onLeido();
        }catch{}
      }
    }catch{}
  },[pedidoId,tipoPedido,otroId,miUsuario.id]);

  const verBloqueo=useCallback(async()=>{
    if(!otroId)return;
    try{
      const d=await db.select("bloqueos",`?bloqueador_id=in.(${miUsuario.id},${otroId})&bloqueado_id=in.(${miUsuario.id},${otroId})`);
      setBloqueoMio(d.find(b=>b.bloqueador_id===miUsuario.id&&b.bloqueado_id===otroId)||null);
      setMeBloquearon(d.some(b=>b.bloqueador_id===otroId&&b.bloqueado_id===miUsuario.id));
    }catch{}
  },[otroId,miUsuario.id]);

  useEffect(()=>{cargar();verBloqueo();const t=setInterval(cargar,10000);return()=>clearInterval(t);},[cargar,verBloqueo]);

  const bloqueado=!!bloqueoMio||meBloquearon;

  const enviar=async()=>{
    if(!txt.trim()||bloqueado)return;
    const m={pedido_id:pedidoId,tipo_pedido:tipoPedido,de_usuario_id:miUsuario.id,para_usuario_id:otroId,texto:txt};
    setTxt("");
    try{await db.insert("mensajes",m);await cargar();}catch{}
  };

  const bloquear=async()=>{
    if(!otroId)return;
    if(!window.confirm("¿Bloquear a este usuario? No vas a poder intercambiar mensajes con él. Podés desbloquearlo cuando quieras."))return;
    try{ await db.insert("bloqueos",{bloqueador_id:miUsuario.id,bloqueado_id:otroId}); await verBloqueo(); }catch(e){alert("No se pudo bloquear: "+(e.message||""));}
  };
  const desbloquear=async()=>{
    if(!bloqueoMio)return;
    try{ await db.remove("bloqueos",`id=eq.${bloqueoMio.id}`); await verBloqueo(); }catch(e){alert("No se pudo desbloquear: "+(e.message||""));}
  };

  return(
    <div>
      {(otroId&&!meBloquearon)&&(
      <div style={{display:"flex",justifyContent:"flex-end",paddingBottom:8,marginBottom:8,borderBottom:`1px dashed ${C.borde}`}}>
        {bloqueoMio
          ? <button onClick={desbloquear} style={{...S.btn("ghost"),fontSize:14,padding:"4px 10px",minHeight:"auto"}}>Desbloquear</button>
          : <button onClick={bloquear} style={{background:"none",border:`1px solid ${C.borde}`,color:C.textoSuave,borderRadius:0,padding:"4px 10px",cursor:"pointer",fontSize:14,minHeight:"auto"}}>🚫 Bloquear</button>
        }
      </div>
      )}
      {meBloquearon?(
        <div style={{padding:18,textAlign:"center",color:C.textoSuave,fontSize:16}}>🚫 Este usuario te bloqueó. No podés enviarle mensajes.</div>
      ):bloqueoMio?(
        <div style={{padding:18,textAlign:"center",color:C.textoSuave,fontSize:16}}>🚫 Bloqueaste a este usuario. Tocá "Desbloquear" para volver a chatear.</div>
      ):(
      <div>
      <div style={{maxHeight:180,overflowY:"auto"}}>
        {msgs.length===0&&<div style={{color:C.textoSuave,fontSize:17,textAlign:"center",padding:16,fontStyle:"italic"}}>Sin mensajes aún...</div>}
        {msgs.map((m,i)=>{
          const propio=m.de_usuario_id===miUsuario.id;
          return(
            <div key={i} style={{marginBottom:8,display:"flex",flexDirection:propio?"row-reverse":"row",gap:6}}>
              <div style={{background:propio?C.marron:C.suave,borderRadius:0,padding:"6px 11px",maxWidth:"78%"}}>
                <div style={{fontSize:17,color:propio?C.acento:C.textoSuave,marginBottom:2}}>{new Date(m.created_at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</div>
                <div style={{fontSize:17,color:propio?C.crema:C.texto}}>{m.texto}</div>
              </div>
            </div>
          );
        })}
        <div ref={endRef}/>
      </div>
      <div style={{display:"flex",gap:8,paddingTop:8,marginTop:8,borderTop:`1px dashed ${C.borde}`}}>
        <input value={txt} onChange={e=>setTxt(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")enviar();}} placeholder="Escribí tu mensaje..." style={{...S.input,flex:1}}/>
        <button style={S.btn("dark")} onClick={enviar}>Enviar</button>
      </div>
      </div>
      )}
    </div>
  );
}

// ─── CALIFICACIÓN ─────────────────────────────────────────────────────────────
function Calificar({deUsuario,paraUsuario,pedidoId,califs=[]}){
  const [open,setOpen]=useState(false);
  const [stars,setStars]=useState(0);
  const [coment,setComent]=useState("");
  const [enviado,setEnviado]=useState(false);

  const enviar=async()=>{
    if(!stars)return;
    try{
      await db.insert("calificaciones",{de_usuario_id:deUsuario.id,para_usuario_id:paraUsuario.id,pedido_id:pedidoId,estrellas:stars,comentario:coment});
      setEnviado(true);setOpen(false);
    }catch{}
  };

  return(
    <div style={{marginTop:12}}>
      {califs.map((c,i)=>(
        <div key={i} style={{fontSize:17,color:C.textoSuave,marginBottom:4}}>
          <Stars v={c.estrellas}/> — {c.comentario}
          {c.respuesta&&<div style={{fontSize:17,color:C.textoSuave,marginLeft:12,marginTop:2,fontStyle:"italic"}}>↩ {c.respuesta}</div>}
        </div>
      ))}
      {!enviado&&(
        <div>
          <button style={{...S.btn("ghost"),fontSize:17,padding:"5px 12px"}} onClick={()=>setOpen(!open)}>{open?"Cerrar":"⭐ Calificar"}</button>
          {open&&(
            <div style={{marginTop:10,background:C.input,borderRadius:0,padding:12,border:`1px solid ${C.borde}`}} className="fade">
              <div style={{display:"flex",gap:4,marginBottom:8}}>
                {[1,2,3,4,5].map(n=><button key={n} onClick={()=>setStars(n)} style={{background:"none",border:"none",cursor:"pointer",fontSize:23,color:n<=stars?C.acento:C.borde}}>★</button>)}
              </div>
              <textarea value={coment} onChange={e=>setComent(e.target.value)} placeholder="Contá tu experiencia..." style={{...S.input,minHeight:56,resize:"vertical"}}/>
              <button style={{...S.btn("dark"),marginTop:8,fontSize:16}} onClick={enviar}>Enviar calificación</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── NUEVO PEDIDO ─────────────────────────────────────────────────────────────
function NuevoPedido({usuario,onGuardar,onCancelar,notif}){
  const itemVacio=()=>({descripcion:"",alto:"",ancho:"",profundidad:"",material:"",especie:"",terminacion:"",color:"",usaCroquis:false,notasCroquis:"",croquisImg:"",tieneCajones:"No",cantidadCajones:"",medidasCajones:""});
  const [items,setItems]=useState([itemVacio()]);
  const [fechaLimite,setFechaLimite]=useState("");
  const [procImgIdx,setProcImgIdx]=useState(null);
  const [intento,setIntento]=useState(false);
  const setIt=(i,k,v)=>setItems(prev=>{const arr=[...prev];arr[i]={...arr[i],[k]:v};return arr;});
  const agregarMueble=()=>setItems(prev=>[...prev,itemVacio()]);
  const quitarMueble=(i)=>setItems(prev=>prev.filter((_,j)=>j!==i));
  // Fechas en horario LOCAL (evita el corrimiento de un día que daba toISOString en UTC-3)
  const aISO=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const masDias=n=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);return aISO(d);};
  const minFecha=masDias(1); // mínimo: mañana (un pedido no puede vencer hoy)
  // Lista de lo que falta completar por mueble, para marcar en rojo y avisar
  const faltanItem=(it)=>{
    const l=[];
    if(!it.descripcion)l.push("qué necesitás");
    if(!it.alto)l.push("el alto");
    if(!it.ancho)l.push("el ancho");
    if(!it.profundidad)l.push("la profundidad");
    if(!it.material)l.push("el material");
    if(!it.terminacion)l.push("la terminación");
    return l;
  };
  const problemas=items.map((it,i)=>({i,f:faltanItem(it)})).filter(p=>p.f.length>0);
  const ok=items.length>0&&problemas.length===0;
  const errBorde=(cond)=>(intento&&cond)?{border:`2px solid ${C.rojo}`}:{};
  const AvisoFalta=({cond,texto})=>(intento&&cond)?<div style={{color:C.rojo,fontSize:15,marginTop:4,fontWeight:600}}>⚠️ {texto||"Falta completar este campo"}</div>:null;

  // Toma una foto del croquis, la achica y la convierte a texto para guardarla en la base (una por mueble)
  const elegirImagenCroquis=(i,file)=>{
    if(!file) return;
    if(!file.type.startsWith("image/")){ alert("Por ahora se puede adjuntar solo una foto/imagen (JPG o PNG)."); return; }
    setProcImgIdx(i);
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const maxLado=900;
        let w=img.width, h=img.height;
        if(w>h && w>maxLado){ h=Math.round(h*maxLado/w); w=maxLado; }
        else if(h>=w && h>maxLado){ w=Math.round(w*maxLado/h); h=maxLado; }
        const canvas=document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        setIt(i,"croquisImg",canvas.toDataURL("image/jpeg",0.6));
        setProcImgIdx(null);
      };
      img.onerror=()=>{ setProcImgIdx(null); alert("No se pudo leer la imagen. Probá con una foto JPG o PNG."); };
      img.src=ev.target.result;
    };
    reader.onerror=()=>{ setProcImgIdx(null); alert("No se pudo leer el archivo."); };
    reader.readAsDataURL(file);
  };

  const [guardando,setGuardando]=useState(false);
  const guardar=async()=>{
    if(guardando)return;
    setGuardando(true);
    try{
      if(!usuario||!usuario.id){alert("Error: no se encontró tu usuario. Cerrá sesión y volvé a entrar.");setGuardando(false);return;}
      // Verificar que el usuario existe en la tabla antes de insertar
      const verificar=await db.select("usuarios",`?id=eq.${usuario.id}&limit=1`);
      if(!verificar||verificar.length===0){
        alert("Error: tu perfil no está en la base de datos. Cerrá sesión y volvé a entrar.");
        setGuardando(false);
        return;
      }
      const itemsLimpios=items.map(it=>({
        descripcion:it.descripcion, alto:Number(it.alto), ancho:Number(it.ancho), profundidad:Number(it.profundidad),
        material:it.material, especie:it.especie||null, terminacion:it.terminacion, color:it.color||"",
        notasCroquis:it.notasCroquis||"", croquisImg:it.croquisImg||"",
        tieneCajones:it.tieneCajones==="Sí", cantidadCajones:Number(it.cantidadCajones)||0, medidasCajones:it.medidasCajones||""
      }));
      const primero=itemsLimpios[0];
      const resumen=itemsLimpios.map(it=>it.descripcion).join(" + ");
      // Guardamos items (lista) + columnas del primer mueble por compatibilidad con lo ya existente
      await db.insert("pedidos",{cliente_id:usuario.id,items:itemsLimpios,descripcion:resumen,alto:primero.alto,ancho:primero.ancho,profundidad:primero.profundidad,material:primero.material,especie:primero.especie,terminacion:primero.terminacion,color:primero.color,notas_croquis:primero.notasCroquis,tiene_cajones:primero.tieneCajones,cantidad_cajones:primero.cantidadCajones,medidas_cajones:primero.medidasCajones,croquis_imagen:primero.croquisImg,fecha_limite:fechaLimite?new Date(fechaLimite+"T23:59:59").toISOString():null});
      // El aviso por mail a las carpinterías lo envía el servidor (webhook -> Edge Function avisar-pedido)
      notif(items.length>1?`¡Pedido enviado a todas las carpinterías! (${items.length} muebles)`:"¡Pedido enviado a todas las carpinterías!");
      onGuardar();
    }catch(e){alert("Error al guardar pedido: "+e.message);setGuardando(false);}
  };

  return(
    <div style={S.card} className="fade">
      <div style={S.cardTitle}>✏️ Nuevo pedido de presupuesto</div>
      <div style={{fontSize:16,color:C.textoSuave,marginBottom:14,fontStyle:"italic"}}>Podés pedir varios muebles en un mismo pedido; cada uno con sus propias medidas, material y croquis.</div>

      {items.map((it,i)=>(
        <div key={i} style={{border:`1px solid ${C.borde}`,borderRadius:0,padding:14,marginBottom:14,background:C.suave}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{fontFamily:"'Lato',sans-serif",fontWeight:700,color:C.marron,fontSize:18}}>Mueble {i+1}</div>
            {items.length>1&&<button onClick={()=>quitarMueble(i)} style={{...S.btn("ghost"),color:C.error,borderColor:C.error,fontSize:14,padding:"5px 10px",minHeight:"auto"}}>🗑️ Quitar mueble</button>}
          </div>

          <div style={{marginBottom:14}}>
            <label style={S.label}>¿Qué necesitás?</label>
            <textarea value={it.descripcion} onChange={e=>setIt(i,"descripcion",e.target.value)} placeholder="Describí lo que querés hacer: ej. Mesa de comedor para 8 personas con cajón lateral..." style={{...S.input,minHeight:72,resize:"vertical",...errBorde(!it.descripcion)}}/>
            <AvisoFalta cond={!it.descripcion}/>
          </div>

          <Divider/>
          <div style={S.secTitle}>📐 Medidas en centímetros</div>
          <div style={S.row}>
            {[["alto","Alto (cm)"],["ancho","Ancho (cm)"],["profundidad","Profundidad (cm)"]].map(([k,l])=>(
              <div key={k} style={S.col()}>
                <label style={S.label}>{l}</label>
                <input type="number" value={it[k]} onChange={e=>setIt(i,k,e.target.value)} placeholder="0" style={{...S.input,...errBorde(!it[k])}}/>
                <AvisoFalta cond={!it[k]} texto="Falta esta medida"/>
                {it[k]&&<div style={{fontSize:17,color:C.textoSuave,marginTop:3,fontFamily:"monospace"}}>= {cmToMm(it[k])}mm · {cmToIn(it[k])}"</div>}
              </div>
            ))}
          </div>

          <div style={{marginTop:12}}>
            <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:17,color:C.textoSuave}}>
              <input type="checkbox" checked={it.tieneCajones==="Sí"} onChange={e=>setIt(i,"tieneCajones",e.target.checked?"Sí":"No")}/>
              ¿Lleva cajones?
            </label>
            {it.tieneCajones==="Sí"&&(
              <div style={{...S.row,marginTop:8}}>
                <div style={S.col()}>
                  <label style={S.label}>¿Cuántos?</label>
                  <input type="number" value={it.cantidadCajones} onChange={e=>setIt(i,"cantidadCajones",e.target.value)} placeholder="0" style={S.input}/>
                </div>
                <div style={S.col()}>
                  <label style={S.label}>Medida aproximada</label>
                  <input value={it.medidasCajones} onChange={e=>setIt(i,"medidasCajones",e.target.value)} placeholder='Ej: 40x30x15 cm' style={S.input}/>
                </div>
              </div>
            )}
          </div>

          <div style={{marginTop:12}}>
            <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:17,color:C.textoSuave}}>
              <input type="checkbox" checked={it.usaCroquis} onChange={e=>setIt(i,"usaCroquis",e.target.checked)}/>
              Quiero adjuntar descripción de un croquis con medidas aproximadas
            </label>
            {it.usaCroquis&&<textarea value={it.notasCroquis} onChange={e=>setIt(i,"notasCroquis",e.target.value)} placeholder="Describí el croquis..." style={{...S.input,minHeight:56,resize:"vertical",marginTop:8}}/>}
            {it.usaCroquis&&<div style={{marginTop:10}}>
              <label style={{...S.btn("ghost"),display:"inline-flex",alignItems:"center",gap:8,cursor:"pointer",margin:0}}>
                📷 {it.croquisImg?"Cambiar foto del croquis":"Adjuntar foto del croquis"}
                <input type="file" accept="image/*" style={{display:"none"}} onChange={e=>{elegirImagenCroquis(i,e.target.files[0]); e.target.value="";}}/>
              </label>
              {procImgIdx===i&&<div style={{fontSize:15,color:C.textoSuave,marginTop:6}}>⟳ Procesando imagen...</div>}
              {it.croquisImg&&<div style={{marginTop:10}}>
                <img src={it.croquisImg} alt="croquis" style={{maxWidth:"100%",maxHeight:240,borderRadius:0,border:`1px solid ${C.borde}`}}/>
                <div><button style={{...S.btn("ghost"),marginTop:6}} onClick={()=>setIt(i,"croquisImg","")}>🗑️ Quitar foto</button></div>
              </div>}
            </div>}
          </div>

          <Divider/>
          <div style={S.secTitle}>🪵 Material</div>
          <AvisoFalta cond={!it.material} texto="Falta elegir un material"/>
          <div style={{display:"flex",flexWrap:"wrap",gap:7,marginBottom:6}}>
            {MATS.map(m=><button key={m.id} style={S.tag(it.material===m.id)} onClick={()=>{setIt(i,"material",m.id);setIt(i,"especie","");setIt(i,"terminacion","");setIt(i,"color","");}}>{m.label}</button>)}
          </div>
          {(()=>{
            const m=MATS.find(m=>m.id===it.material);
            if(!m) return null;
            if(m.especies) return(
              <div style={{marginTop:4}}>
                <div style={{fontSize:16,color:C.marron,marginBottom:6,fontWeight:600}}>¿Qué tipo de {m.label.toLowerCase()}?</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
                  {m.especies.map(e=><button key={e} style={S.tag(it.especie===e)} onClick={()=>setIt(i,"especie",it.especie===e?"":e)}>{e}</button>)}
                  <button style={S.tag(it.especie==="Otra / a definir")} onClick={()=>setIt(i,"especie",it.especie==="Otra / a definir"?"":"Otra / a definir")}>Otra / a definir</button>
                </div>
              </div>
            );
            return <div style={{fontSize:17,color:C.textoSuave,fontStyle:"italic"}}>Ej: {m.ej}</div>;
          })()}

          <Divider/>
          <div style={S.secTitle}>🎨 Terminación / Acabado</div>
          <AvisoFalta cond={!it.terminacion} texto="Falta elegir una terminación"/>
          <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
            {TERS.filter(t=>{
              const esMadera=["madera_dura","madera_semidura","madera_blanda"].includes(it.material);
              const esMelamina=["aglomerado_melamina","mdf_melamina"].includes(it.material);
              const esTablero=["aglomerado","mdf","fenolico"].includes(it.material);
              if(esMadera) return ["crudo","pintado","lacheado","enchapado"].includes(t.id);
              if(esMelamina) return ["melamina_color"].includes(t.id);
              if(esTablero) return ["crudo","pintado","lacheado","enchapado","melamina_color"].includes(t.id);
              return true;
            }).map(t=><button key={t.id} style={S.tag(it.terminacion===t.id)} onClick={()=>setIt(i,"terminacion",t.id)}>{t.label}</button>)}
          </div>
          {it.terminacion==="melamina_color"&&(
            <div style={{marginTop:10}}>
              <label style={S.label}>Color de melamina</label>
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>{COLORES_MEL.map(c=><button key={c} style={S.tag(it.color===c)} onClick={()=>setIt(i,"color",c)}>{c}</button>)}</div>
            </div>
          )}
          {it.terminacion==="pintado"&&(
            <div style={{marginTop:10}}>
              <label style={S.label}>Color</label>
              <input value={it.color} onChange={e=>setIt(i,"color",e.target.value)} placeholder="Ej: Blanco roto..." style={{...S.input,maxWidth:220}}/>
            </div>
          )}
        </div>
      ))}

      <button onClick={agregarMueble} style={{...S.btn("ghost"),width:"100%",justifyContent:"center",marginBottom:16}}>＋ Agregar otro mueble</button>

      <Divider/>
      <div style={S.secTitle}>⏰ Fecha límite para recibir presupuestos <span style={{fontWeight:400,fontSize:15,color:C.textoSuave}}>(opcional)</span></div>
      <div style={{fontSize:15,color:C.textoSuave,marginBottom:8}}>Pasada esta fecha, las carpinterías ya no podrán cotizar. Si la dejás vacía, el pedido queda abierto sin vencimiento. Aplica a todo el pedido.</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
        {[["3 días",3],["1 semana",7],["15 días",15]].map(([lbl,d])=>{
          const fecha=masDias(d);
          const activo=fechaLimite===fecha;
          return <button key={d} style={{...S.btn(activo?"dark":"ghost"),fontSize:15,padding:"6px 12px"}} onClick={()=>setFechaLimite(activo?"":fecha)}>{lbl}</button>;
        })}
        {fechaLimite&&<button style={{...S.btn("ghost"),fontSize:15,padding:"6px 12px",color:C.rojo,borderColor:C.rojo}} onClick={()=>setFechaLimite("")}>✕ Sin vencimiento</button>}
      </div>
      <div style={{fontSize:15,color:C.textoSuave,margin:"4px 0 6px"}}>📆 O elegí una fecha exacta en el calendario:</div>
      <input type="date" value={fechaLimite} min={minFecha} onChange={e=>{const v=e.target.value; setFechaLimite(v&&v<minFecha?minFecha:v);}} style={S.input}/>
      {fechaLimite&&<div style={{fontSize:15,color:C.verde,marginTop:4}}>📅 Vence el {new Date(fechaLimite+"T00:00:00").toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"})}</div>}

      {intento&&!ok&&(
        <div style={{marginTop:16,padding:"10px 14px",background:"#FDECEA",border:`1px solid ${C.rojo}`,borderRadius:0,color:C.rojo,fontSize:16,fontWeight:600}}>
          ⚠️ Para enviar el pedido te falta completar — {problemas.map(p=>`Mueble ${p.i+1}: ${p.f.join(", ")}`).join(" · ")}.
        </div>
      )}
      <div style={{display:"flex",gap:10,marginTop:intento&&!ok?10:20}}>
        <button style={{...S.btn("dark"),opacity:guardando?0.6:1}} disabled={guardando} onClick={()=>{ if(!ok){ setIntento(true); return; } guardar(); }}>{guardando?"⟳ Enviando...":"📤 Enviar pedido"}</button>
        <button style={S.btn("ghost")} onClick={onCancelar}>Cancelar</button>
      </div>
    </div>
  );
}

// ─── VISTA CLIENTE ────────────────────────────────────────────────────────────
function VistaCliente({usuario,notif}){
  const [pedidos,setPedidos]=useState([]);
  const [vista,setVista]=useState("lista");
  const [sel,setSel]=useState(null);
  const [presups,setPresups]=useState([]);
  const [selPresup,setSelPresup]=useState(null);
  const [filtro,setFiltro]=useState("todos");
  const [archivados,setArchivados]=useState(new Set());

  const cargarArchivados=useCallback(async()=>{
    try{
      const a=await db.select("elementos_archivados",`?usuario_id=eq.${usuario.id}&tipo_elemento=eq.presupuesto&select=elemento_id`);
      setArchivados(new Set((a||[]).map(x=>x.elemento_id)));
    }catch{}
  },[usuario.id]);
  useEffect(()=>{cargarArchivados();},[cargarArchivados]);

  const archivarPresup=async(pr)=>{
    try{
      await db.insertMin("elementos_archivados",{usuario_id:usuario.id,tipo_elemento:"presupuesto",elemento_id:pr.id});
      setArchivados(prev=>new Set(prev).add(pr.id));
      if(selPresup&&selPresup.id===pr.id)setSelPresup(null);
      notif("Presupuesto archivado");
    }catch(e){ notif("No se pudo archivar"); }
  };

  const cargar=useCallback(async()=>{
    try{const d=await db.select("pedidos",`?cliente_id=eq.${usuario.id}&order=created_at.desc`);setPedidos(d);}catch{}
  },[usuario.id]);

  useEffect(()=>{cargar();},[cargar]);
  useEffect(()=>{const h=()=>{setSel(null);setPresups([]);setSelPresup(null);setVista("lista");};window.addEventListener("encastre-ir-principal",h);return()=>window.removeEventListener("encastre-ir-principal",h);},[]);

  const enriquecerPresups=async(d)=>{
    return await Promise.all(d.map(async pr=>{
      const c=await db.select("usuarios",`?id=eq.${pr.carpinteria_id}&limit=1`);
      let items=[];
      try{ items=await db.select("presupuesto_items",`?presupuesto_id=eq.${pr.id}&order=orden.asc`); }catch{}
      return{...pr,empresa:c[0]||{},carpNombre:c[0]?.nombre||"Carpintería",carpFotos:[c[0]?.foto1,c[0]?.foto2,c[0]?.foto3].filter(Boolean),items};
    }));
  };

  const abrirPedido=async(p)=>{
    if(sel&&sel.id===p.id){ setSel(null); setPresups([]); setSelPresup(null); return; }
    setSel(p);
    setSelPresup(null);
    setPresups([]);
    try{
      const d=await db.select("presupuestos",`?pedido_id=eq.${p.id}&order=created_at.asc`);
      setPresups(await enriquecerPresups(d));
    }catch{}
  };

  const recargarPresups=async(p)=>{
    try{
      const d=await db.select("presupuestos",`?pedido_id=eq.${p.id}&order=created_at.asc`);
      setPresups(await enriquecerPresups(d));
    }catch{}
  };

  const aceptar=async(pr)=>{
    try{
      const ahora=new Date().toISOString();
      // 1) Aceptar el elegido
      await db.update("presupuestos",{estado:"aceptado",aceptado_at:ahora},`id=eq.${pr.id}`);
      // 2) Cerrar los demás presupuestos del mismo pedido
      await db.update("presupuestos",{estado:"cerrado"},`pedido_id=eq.${sel.id}&id=neq.${pr.id}`);
      // 3) Marcar el pedido como aceptado
      await db.update("pedidos",{estado:"aceptado"},`id=eq.${sel.id}`);
      notif("¡Presupuesto aceptado!");
      setSelPresup(null);
      cargar();
      recargarPresups(sel);
    }catch(e){alert("No se pudo aceptar: "+(e.message||"revisá tu conexión"));}
  };

  const deshacerAceptacion=async(pr)=>{
    if(!window.confirm("¿Deshacer la aceptación? El pedido vuelve a quedar abierto y las carpinterías podrán ser elegidas de nuevo."))return;
    try{
      // Reabrir: el aceptado vuelve a enviado, los cerrados vuelven a enviado, el pedido se reabre
      await db.update("presupuestos",{estado:"enviado",aceptado_at:null},`id=eq.${pr.id}`);
      await db.update("presupuestos",{estado:"enviado"},`pedido_id=eq.${sel.id}&estado=eq.cerrado`);
      await db.update("pedidos",{estado:"presupuestado"},`id=eq.${sel.id}`);
      notif("Aceptación deshecha. El pedido quedó abierto de nuevo.");
      setSelPresup(null);
      cargar();
      recargarPresups(sel);
    }catch(e){alert("No se pudo deshacer: "+(e.message||"revisá tu conexión"));}
  };

  if(vista==="nuevo") return <NuevoPedido usuario={usuario} onGuardar={()=>{cargar();setVista("lista");}} onCancelar={()=>setVista("lista")} notif={notif}/>;

  // Detalle de un presupuesto puntual (se abre dentro del pedido desplegado)
  const DetallePresup=({pr})=>(
    <div style={{marginTop:10,border:`1px solid ${C.acento}`,borderRadius:0,overflow:"hidden"}}>
      <div style={{display:"flex",justifyContent:"flex-end",alignItems:"center",padding:"8px 12px",background:C.input}}>
        <button style={{...S.btn("ghost"),fontSize:14,padding:"4px 10px"}} onClick={()=>setSelPresup(null)}>✕ Cerrar</button>
      </div>
      <div style={{padding:12}}>
        <PresupuestoFormato
          empresa={pr.empresa||{nombre:pr.carpNombre}}
          cliente={usuario}
          items={pr.items||[]}
          opts={{descuento_tipo:pr.descuento_tipo,descuento_valor:pr.descuento_valor,iva_pct:pr.iva_pct}}
          numero={pr.numero!=null?pr.numero:""}
          fecha={pr.created_at?new Date(pr.created_at).toLocaleDateString("es-AR"):null}
          tiempoEntrega={pr.tiempo_entrega}
          esEmpresa={false}
          aceptado={pr.estado==="aceptado"}
        />
        {pr.estado==="enviado"&&(
          <div style={{marginTop:12}}>
            <button style={{...S.btn("dark"),width:"100%",justifyContent:"center"}} onClick={()=>aceptar(pr)}>✅ Aceptar presupuesto</button>
          </div>
        )}
        {pr.estado==="aceptado"&&(()=>{
          const t=pr.aceptado_at?new Date(pr.aceptado_at).getTime():null;
          const dentroDeHora = t && (Date.now()-t) < 3600000;
          return(
            <div style={{marginTop:12}}>
              <div style={{background:C.verde+"22",border:`1px solid ${C.verde}`,borderRadius:0,padding:12,textAlign:"center",marginBottom:dentroDeHora?10:0}}>
                <div style={{fontWeight:800,color:C.verde,fontSize:17}}>✅ Presupuesto aceptado</div>
              </div>
              {dentroDeHora?(
                <div>
                  <button style={{...S.btn("ghost"),width:"100%",justifyContent:"center",color:C.error,borderColor:C.error}} onClick={()=>deshacerAceptacion(pr)}>↩️ Deshacer aceptación</button>
                  <div style={{fontSize:13,color:C.textoSuave,marginTop:6,textAlign:"center"}}>Podés deshacer la aceptación hasta 1 hora después de haberla hecho. Pasado ese tiempo queda fija.</div>
                </div>
              ):(
                <div style={{fontSize:13,color:C.textoSuave,marginTop:2,textAlign:"center"}}>La aceptación es definitiva.</div>
              )}
            </div>
          );
        })()}
        <Calificar deUsuario={usuario} paraUsuario={{id:pr.carpinteria_id}} pedidoId={sel.id}/>
        {pr.carpFotos&&pr.carpFotos.length>0&&(
          <div style={{marginTop:12}}>
            <div style={{fontSize:15,color:C.textoSuave,marginBottom:6}}>🛠️ Trabajos realizados</div>
            <div style={{display:"flex",gap:8}}>
              {pr.carpFotos.map((f,j)=>(<img key={j} src={f} alt={"trabajo "+(j+1)} style={{width:"31%",height:100,objectFit:"cover",borderRadius:0,border:`1px solid ${C.borde}`}}/>))}
            </div>
          </div>
        )}
        <div style={{marginTop:12}}>
          <div style={{fontSize:15,color:C.textoSuave,marginBottom:6}}>💬 Chat con {pr.carpNombre}</div>
          <Chat key={pr.carpinteria_id} pedidoId={sel.id} tipoPedido="cliente" miUsuario={usuario} otroUsuario={{id:pr.carpinteria_id}}/>
        </div>
      </div>
    </div>
  );

  // Detalle del pedido (se despliega dentro de la fila al tocar el pedido)
  const DetallePedido=()=>{
    // Compatibilidad: pedidos viejos sin "items" muestran un solo mueble armado con las columnas planas
    const muebles=(sel.items&&sel.items.length>0)?sel.items:[{descripcion:sel.descripcion,alto:sel.alto,ancho:sel.ancho,profundidad:sel.profundidad,material:sel.material,especie:sel.especie,terminacion:sel.terminacion,color:sel.color}];
    const abrirCot=(pr)=>{
      setSelPresup(pr);
      if(!pr.visto_cliente){marcarCotVista("presupuestos","visto_cliente",pr);setPresups(ps=>ps.map(x=>x.id===pr.id?{...x,visto_cliente:true}:x));}
    };
    // Pantalla dedicada: se abrió una cotización puntual desde el cuadro comparativo
    if(selPresup){
      const pr=presups.find(x=>x.id===selPresup.id)||selPresup;
      return(
        <div style={{marginTop:12,borderTop:`1px dashed ${C.borde}`,paddingTop:12}} className="fade">
          <button style={{...S.btn("ghost"),fontSize:14,padding:"6px 12px",marginBottom:8}} onClick={()=>setSelPresup(null)}>← Volver a la comparativa</button>
          <DetallePresup pr={pr}/>
          <div style={{textAlign:"right",marginTop:12,marginBottom:4,paddingTop:12,borderTop:`1px dashed ${C.borde}`}}>
            <button style={{...S.btn("ghost"),fontSize:14,padding:"6px 12px",color:C.textoSuave}} onClick={()=>{archivarPresup(pr);setSelPresup(null);}}>🗑️ Archivar este presupuesto</button>
          </div>
        </div>
      );
    }
    return(
      <div style={{marginTop:12,borderTop:`1px dashed ${C.borde}`,paddingTop:12}} className="fade">
        {muebles.map((it,i)=>{
          const mat=MATS.find(m=>m.id===it.material);
          const ter=TERS.find(t=>t.id===it.terminacion);
          return(
            <div key={i} style={muebles.length>1?{marginBottom:12,paddingBottom:12,borderBottom:i<muebles.length-1?`1px dashed ${C.borde}`:"none"}:{}}>
              {muebles.length>1&&<div style={{fontWeight:700,color:C.marron,marginBottom:6}}>🪑 Mueble {i+1}{it.descripcion?`: ${it.descripcion}`:""}</div>}
              <div style={S.row}>
                <div style={S.col()}><div style={S.label}>Medidas</div><div style={{fontSize:16,fontFamily:"monospace",color:C.marron}}>Alto {it.alto} · Ancho {it.ancho} · Prof {it.profundidad} cm</div></div>
                <div style={S.col()}><div style={S.label}>Material</div><div>{mat?.label}{it.especie?` · ${it.especie}`:""}</div></div>
                <div style={S.col()}><div style={S.label}>Terminación</div><div>{ter?.label}{it.color?` · ${it.color}`:""}</div></div>
              </div>
              {it.tieneCajones&&<div style={{marginTop:6,fontSize:16}}><span style={S.label}>Cajones</span> {it.cantidadCajones||"—"}{it.medidasCajones?` · ${it.medidasCajones}`:""}</div>}
            </div>
          );
        })}
        {presups.length===0?(
          <div style={{textAlign:"center",color:C.textoSuave,padding:20}}>
            <div style={{fontSize:28,marginBottom:6}}>⏳</div>
            <div style={{fontSize:16}}>Esperando presupuestos de las carpinterías...</div>
          </div>
        ):(()=>{
          const presupsVisibles=presups.filter(pr=>!archivados.has(pr.id));
          return presupsVisibles.length===0?(
            <div style={{textAlign:"center",color:C.textoSuave,padding:20,fontSize:15}}>Archivaste todos los presupuestos de este pedido.</div>
          ):(
          <div style={{marginTop:6}}>
            <div style={{fontWeight:700,color:C.marron,marginBottom:8}}>💰 Presupuestos recibidos ({presupsVisibles.length})</div>
            <div style={{overflowX:"auto",border:`1px solid ${C.borde}`}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:15}}>
                <thead>
                  <tr style={{background:C.crema}}>
                    <th style={{textAlign:"left",padding:"8px 10px",color:C.textoSuave,fontWeight:700}}>Carpintería</th>
                    <th style={{textAlign:"left",padding:"8px 10px",color:C.textoSuave,fontWeight:700}}>Pedido</th>
                    <th style={{textAlign:"right",padding:"8px 10px",color:C.textoSuave,fontWeight:700}}>Precio</th>
                    <th style={{padding:"8px 10px"}}></th>
                  </tr>
                </thead>
                <tbody>
                  {[...presupsVisibles].sort((a,b)=>Number(a.monto)-Number(b.monto)).map((pr,i)=>(
                    <tr key={i} style={{borderTop:`1px solid ${C.borde}`,background:i===0?"#00996611":"transparent",cursor:"pointer"}} onClick={()=>abrirCot(pr)}>
                      <td style={{padding:"8px 10px"}}>🔨 {pr.carpNombre}{pr.visto_cliente===false&&<span style={{marginLeft:6,fontSize:11,fontWeight:800,color:"#fff",background:"#009966",padding:"1px 6px"}}>NUEVO</span>}{pr.estado&&pr.estado!=="enviado"&&<span style={{marginLeft:6}}><Badge e={pr.estado}/></span>}</td>
                      <td style={{padding:"8px 10px",color:C.textoSuave}}>{sel.descripcion}</td>
                      <td style={{padding:"8px 10px",textAlign:"right",fontWeight:800,color:i===0?C.verde:C.marron}}>$ {Number(pr.monto).toLocaleString("es-AR")}{i===0&&" ✓"}</td>
                      <td style={{padding:"8px 10px",textAlign:"right"}}>
                        <button style={{...S.btn("ghost"),fontSize:13,padding:"4px 10px"}} onClick={(e)=>{e.stopPropagation();abrirCot(pr);}}>ver ▶</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
          );
        })()}
      </div>
    );
  };

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <div style={S.cardTitle}>📋 Mis pedidos</div>
        <button style={S.btn("dark")} onClick={()=>setVista("nuevo")}>➕ Nuevo pedido</button>
      </div>
      {pedidos.length===0&&(
        <div style={{...S.card,textAlign:"center",padding:40}}>
          <div style={{fontSize:40,marginBottom:12}}>🪑</div>
          <div style={{fontFamily:"'Lato',sans-serif",fontSize:21,color:C.marron,marginBottom:8}}>¡Bienvenido a Encastre!</div>
          <div style={{fontSize:17,color:C.textoSuave,marginBottom:16}}>Creá tu primer pedido y recibí presupuestos de carpinterías</div>
          <button style={S.btn("dark")} onClick={()=>setVista("nuevo")}>➕ Crear primer pedido</button>
        </div>
      )}
      {pedidos.length>0&&(()=>{
        const venc=p=>p.fecha_limite&&new Date(p.fecha_limite)<new Date()&&p.estado!=="aceptado";
        const cuenta={
          todos:pedidos.length,
          abierto:pedidos.filter(p=>!venc(p)&&p.estado!=="aceptado").length,
          aceptado:pedidos.filter(p=>p.estado==="aceptado").length,
          vencido:pedidos.filter(p=>venc(p)).length,
        };
        return(
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16}}>
            {[["todos","Todos"],["abierto","Abiertos"],["aceptado","Aceptados"],["vencido","Vencidos"]].map(([id,l])=>(
              <button key={id} style={{...S.btn(filtro===id?"dark":"ghost"),fontSize:15,padding:"6px 12px"}} onClick={()=>setFiltro(id)}>{l} {cuenta[id]}</button>
            ))}
          </div>
        );
      })()}
      {pedidos.filter(p=>{
        const venc=p.fecha_limite&&new Date(p.fecha_limite)<new Date()&&p.estado!=="aceptado";
        if(filtro==="todos")return true;
        if(filtro==="vencido")return venc;
        if(filtro==="aceptado")return p.estado==="aceptado";
        if(filtro==="abierto")return !venc&&p.estado!=="aceptado";
        return true;
      }).map(p=>{
          const mat=MATS.find(m=>m.id===p.material);
          const abierto=sel&&sel.id===p.id;
          return(
          <div key={p.id} style={{...S.card,cursor:"pointer",transition:"all .15s",...(abierto?{borderColor:C.acento,borderWidth:2}:{borderColor:"#8B451399"})}}>
            <div onClick={()=>abrirPedido(p)} style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div>
                <div style={{fontFamily:"'Lato',sans-serif",fontWeight:700,fontSize:21,color:C.marron,marginBottom:4}}>{p.descripcion}</div>
                <div style={{fontSize:17,color:C.textoSuave}}>{p.alto}×{p.ancho}×{p.profundidad} cm · {mat?.label} · {new Date(p.created_at).toLocaleDateString("es-AR")}{p.items&&p.items.length>1?` · +${p.items.length-1} mueble${p.items.length>2?"s":""} más`:""}</div>
                {p.fecha_limite&&<AvisoVence fechaLimite={p.fecha_limite}/>}
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <Badge e={p.estado}/>
                <span style={{color:C.textoSuave,fontSize:18}}>{abierto?"▲":"▼"}</span>
              </div>
            </div>
            {abierto&&<DetallePedido/>}
          </div>
        );
      })}
    </div>
  );
}

// ─── VISTA CARPINTERÍA ────────────────────────────────────────────────────────
function VistaCarpinteria({usuario,notif}){
  const badges=useBadges(usuario);
  const [archivadosCot,setArchivadosCot]=useState(new Set());
  const [archivadosPed,setArchivadosPed]=useState(new Set());
  const cargarArchivadosCot=useCallback(async()=>{
    try{
      const a=await db.select("elementos_archivados",`?usuario_id=eq.${usuario.id}&tipo_elemento=eq.cotizacion&select=elemento_id`);
      setArchivadosCot(new Set((a||[]).map(x=>x.elemento_id)));
    }catch{}
    try{
      const b=await db.select("elementos_archivados",`?usuario_id=eq.${usuario.id}&tipo_elemento=eq.pedido_cliente&select=elemento_id`);
      setArchivadosPed(new Set((b||[]).map(x=>x.elemento_id)));
    }catch{}
  },[usuario.id]);
  useEffect(()=>{cargarArchivadosCot();},[cargarArchivadosCot]);
  useEffect(()=>{const h=()=>{setSelAserr(null);setSelFerr(null);setSelPint(null);setTab("pedidos");};window.addEventListener("encastre-ir-principal",h);return()=>window.removeEventListener("encastre-ir-principal",h);},[]);
  const archivarCot=async(ct,tipo)=>{
    try{
      await db.insertMin("elementos_archivados",{usuario_id:usuario.id,tipo_elemento:"cotizacion",elemento_id:ct.id});
      setArchivadosCot(prev=>new Set(prev).add(ct.id));
      const dec=(setter,pedidoId)=>setter(ps=>ps.map(p=>p.id===pedidoId?{...p,_cantCot:Math.max(0,(p._cantCot||0)-1)}:p));
      if(tipo==="aserradero"&&selAserr) dec(setMisPedidosAserr,selAserr.id);
      else if(tipo==="ferreteria"&&selFerr) dec(setMisPedidosFerreria,selFerr.id);
      else if(tipo==="pintureria"&&selPint) dec(setMisPedidosPint,selPint.id);
      notif("Cotización archivada");
    }catch(e){ notif("No se pudo archivar"); }
  };
  const archivarPedido=async(p)=>{
    try{
      await db.insertMin("elementos_archivados",{usuario_id:usuario.id,tipo_elemento:"pedido_cliente",elemento_id:p.id});
      setArchivadosPed(prev=>new Set(prev).add(p.id));
      setSel(null);
      notif("Pedido archivado");
    }catch(e){ notif("No se pudo archivar"); }
  };
  const [tab,setTab]=useState("pedidos");
  const [pedidos,setPedidos]=useState([]);
  const [sel,setSel]=useState(null);
  const [presF,setPresF]=useState({items:[{descripcion:"",precio:"",cantidad:"1"}],tiempo:"",usarDesc:false,descTipo:"porcentaje",descValor:"",usarIva:false,ivaPct:"21"});
  const [miPresupuesto,setMiPresupuesto]=useState(null);
  const [clienteSel,setClienteSel]=useState({});
  const [enviando,setEnviando]=useState(false);
  const [yaEnvio,setYaEnvio]=useState(false);
  const [asF,setAsF]=useState({items:[{material:"",pies:"",pulgadas:"",espesor:"",cantidad:""}],descripcion:"",fechaLimite:""});
  const [misPedidosAserr,setMisPedidosAserr]=useState([]);
  const [subAserr,setSubAserr]=useState("mis");
  const [subFerr,setSubFerr]=useState("mis");
  const [subPint,setSubPint]=useState("mis");
  const [intAs,setIntAs]=useState(false);
  const [intFe,setIntFe]=useState(false);
  const [intPi,setIntPi]=useState(false);
  const marcaErr=(activo,cond)=>(activo&&cond)?{border:`2px solid ${C.rojo}`}:{};
  const AvisoErr=({activo,cond,texto})=>(activo&&cond)?<div style={{color:C.rojo,fontSize:15,marginTop:4,fontWeight:600}}>⚠️ {texto||"Falta completar"}</div>:null;
  const BannerFalta=({activo,lista})=>{
    const f=lista.filter(x=>x[0]).map(x=>x[1]);
    return (activo&&f.length>0)?<div style={{marginTop:12,padding:"10px 14px",background:"#FDECEA",border:`1px solid ${C.rojo}`,borderRadius:0,color:C.rojo,fontSize:16,fontWeight:600}}>⚠️ Para enviar te falta completar: {f.join(", ")}.</div>:null;
  };
  const [selAserr,setSelAserr]=useState(null);
  const [cotizacionesAserr,setCotizacionesAserr]=useState([]);
  const [cotAserrAbierta,setCotAserrAbierta]=useState(null);
  const [ferrF,setFerrF]=useState({items:[{descripcion:"",cantidad:"1"}],notas:"",fechaLimite:""});
  const [misPedidosFerreria,setMisPedidosFerreria]=useState([]);
  const [selFerr,setSelFerr]=useState(null);
  const [cotizacionesFerr,setCotizacionesFerr]=useState([]);
  const [pintF,setPintF]=useState({items:[{descripcion:"",litros:"1"}],notas:"",fechaLimite:""});
  const [buscarPedido,setBuscarPedido]=useState("");
  const [filtroCarp,setFiltroCarp]=useState("cotizar");
  const [misPedidosPint,setMisPedidosPint]=useState([]);
  const [selPint,setSelPint]=useState(null);
  const [cotizacionesPint,setCotizacionesPint]=useState([]);

  const cargar=useCallback(async()=>{
    try{
      const d=await db.select("pedidos","?order=created_at.desc");
      const ids=[...new Set(d.map(p=>p.cliente_id).filter(Boolean))];
      let mapa={};
      if(ids.length){
        try{const us=await db.select("usuarios",`?id=in.(${ids.join(",")})`);us.forEach(u=>{mapa[u.id]=u.nombre;});}catch{}
      }
      // Mis presupuestos, para saber cuáles ya coticé (sobre cerrado: solo veo los míos)
      let mios={};
      try{
        const mp=await db.select("presupuestos",`?carpinteria_id=eq.${usuario.id}&select=pedido_id,estado`);
        mp.forEach(p=>{ mios[p.pedido_id]=p.estado||"enviado"; });
      }catch{}
      let vistos=new Set();
      try{
        const vs=await db.select("vistas_pedido",`?usuario_id=eq.${usuario.id}&tipo_pedido=eq.pedidos&select=pedido_id`);
        vs.forEach(v=>vistos.add(v.pedido_id));
      }catch{}
      let conMsj=new Set();
      if(d.length){
        try{
          const idsPed=d.map(p=>p.id).join(",");
          const msjs=await db.select("mensajes",`?pedido_id=in.(${idsPed})&tipo_pedido=eq.cliente&para_usuario_id=eq.${usuario.id}&leido=eq.false&select=pedido_id`);
          msjs.forEach(m=>conMsj.add(m.pedido_id));
        }catch{}
      }
      setPedidos(d.map(p=>({...p,_clienteNombre:mapa[p.cliente_id]||"",_miEstado:mios[p.id]||null,_nuevo:!vistos.has(p.id),_msjNuevo:conMsj.has(p.id)})));
    }catch{}
  },[usuario.id]);
  // Auto-refresh cada 15 segundos para ver pedidos nuevos
  useEffect(()=>{const t=setInterval(cargar,15000);return()=>clearInterval(t);},[cargar]);
  // Apaga el aviso NUEVO en pedidos que ya no se pueden abrir (cerrados o vencidos): se marcan vistos solos.
  useEffect(()=>{
    const noAccionable=p=>p._nuevo&&(p.estado==="aceptado"||(p.fecha_limite&&new Date(p.fecha_limite)<new Date()));
    const pend=pedidos.filter(noAccionable);
    if(pend.length){
      pend.forEach(p=>marcarPedidoVisto("pedidos",p.id,usuario.id));
      setPedidos(ps=>ps.map(x=>noAccionable(x)?{...x,_nuevo:false}:x));
    }
  },[pedidos,usuario.id]);
  const cargarMisPedidosAserr=useCallback(async()=>{
    try{
      const d=await db.select("pedidos_aserradero",`?carpinteria_id=eq.${usuario.id}&order=created_at.desc`);
      let conteo={};
      let conMsj=new Set();
      if(d.length){
        try{
          const ids=d.map(p=>p.id).join(",");
          const cots=await db.select("cotizaciones_aserradero",`?pedido_id=in.(${ids})&select=pedido_id`);
          cots.forEach(c=>{conteo[c.pedido_id]=(conteo[c.pedido_id]||0)+1;});
        }catch{}
        try{
          const ids=d.map(p=>p.id).join(",");
          const msjs=await db.select("mensajes",`?pedido_id=in.(${ids})&tipo_pedido=eq.aserradero&para_usuario_id=eq.${usuario.id}&leido=eq.false&select=pedido_id`);
          msjs.forEach(m=>conMsj.add(m.pedido_id));
        }catch{}
      }
      setMisPedidosAserr(d.map(p=>({...p,_cantCot:conteo[p.id]||0,_msjNuevo:conMsj.has(p.id)})));
    }catch{}
  },[usuario.id]);
  const cargarMisPedidosFerreria=useCallback(async()=>{
    try{
      const d=await db.select("pedidos_ferreteria",`?carpinteria_id=eq.${usuario.id}&order=created_at.desc`);
      let conteo={};
      let conMsj=new Set();
      if(d.length){
        try{
          const ids=d.map(p=>p.id).join(",");
          const cots=await db.select("cotizaciones_ferreteria",`?pedido_id=in.(${ids})&select=pedido_id`);
          cots.forEach(c=>{conteo[c.pedido_id]=(conteo[c.pedido_id]||0)+1;});
        }catch{}
        try{
          const ids=d.map(p=>p.id).join(",");
          const msjs=await db.select("mensajes",`?pedido_id=in.(${ids})&tipo_pedido=eq.ferreteria&para_usuario_id=eq.${usuario.id}&leido=eq.false&select=pedido_id`);
          msjs.forEach(m=>conMsj.add(m.pedido_id));
        }catch{}
      }
      setMisPedidosFerreria(d.map(p=>({...p,_cantCot:conteo[p.id]||0,_msjNuevo:conMsj.has(p.id)})));
    }catch{}
  },[usuario.id]);
  const [ferrAbierta,setFerrAbierta]=useState(null);
  const abrirPedidoFerr=async(p)=>{
    setSelFerr(p);
    setFerrAbierta(null);
    try{
      const d=await db.select("cotizaciones_ferreteria",`?pedido_id=eq.${p.id}&order=created_at.asc`);
      const enr=await Promise.all(d.map(async ct=>{
        const fe=await db.select("usuarios",`?id=eq.${ct.ferreteria_id}&limit=1`);
        let items=[];
        try{ items=Array.isArray(ct.presupuesto_items)?ct.presupuesto_items:JSON.parse(ct.presupuesto_items||"[]"); }catch{items=[];}
        return{...ct,ferrNombre:fe[0]?.nombre||"Ferretería",ferrObj:fe[0]||{},items};
      }));
      setCotizacionesFerr(enr);
    }catch{}
  };
  const cargarMisPedidosPint=useCallback(async()=>{
    try{
      const d=await db.select("pedidos_pintureria",`?carpinteria_id=eq.${usuario.id}&order=created_at.desc`);
      let conteo={};
      let conMsj=new Set();
      if(d.length){
        try{
          const ids=d.map(p=>p.id).join(",");
          const cots=await db.select("cotizaciones_pintureria",`?pedido_id=in.(${ids})&select=pedido_id`);
          cots.forEach(c=>{conteo[c.pedido_id]=(conteo[c.pedido_id]||0)+1;});
        }catch{}
        try{
          const ids=d.map(p=>p.id).join(",");
          const msjs=await db.select("mensajes",`?pedido_id=in.(${ids})&tipo_pedido=eq.pintureria&para_usuario_id=eq.${usuario.id}&leido=eq.false&select=pedido_id`);
          msjs.forEach(m=>conMsj.add(m.pedido_id));
        }catch{}
      }
      setMisPedidosPint(d.map(p=>({...p,_cantCot:conteo[p.id]||0,_msjNuevo:conMsj.has(p.id)})));
    }catch{}
  },[usuario.id]);
  const [pintAbierta,setPintAbierta]=useState(null);
  const abrirPedidoPint=async(p)=>{
    setSelPint(p);
    setPintAbierta(null);
    try{
      const d=await db.select("cotizaciones_pintureria",`?pedido_id=eq.${p.id}&order=created_at.asc`);
      const enr=await Promise.all(d.map(async ct=>{
        const pe=await db.select("usuarios",`?id=eq.${ct.pintureria_id}&limit=1`);
        let items=[];
        try{ items=Array.isArray(ct.presupuesto_items)?ct.presupuesto_items:JSON.parse(ct.presupuesto_items||"[]"); }catch{items=[];}
        return{...ct,pintNombre:pe[0]?.nombre||"Pinturería",pintObj:pe[0]||{},items};
      }));
      setCotizacionesPint(enr);
    }catch{}
  };
  useEffect(()=>{cargar();cargarMisPedidosAserr();cargarMisPedidosFerreria();cargarMisPedidosPint();},[cargar,cargarMisPedidosAserr,cargarMisPedidosFerreria,cargarMisPedidosPint]);

  const enviarPresup=async()=>{
    if(!sel||enviando||yaEnvio)return;
    const itemsValidos=(presF.items||[]).filter(it=>it.descripcion.trim()&&nmb(it.precio)>0&&nmb(it.cantidad)>0);
    if(itemsValidos.length===0){alert("Cargá al menos un ítem con descripción, precio y cantidad.");return;}
    if(sel.fecha_limite&&new Date(sel.fecha_limite)<new Date()){alert("Este pedido venció: ya no se pueden enviar presupuestos.");return;}
    setEnviando(true);
    try{
      // Número correlativo por empresa: mayor número existente + 1
      let numero=1;
      try{
        const prev=await db.select("presupuestos",`?carpinteria_id=eq.${usuario.id}&select=numero&order=numero.desc.nullslast&limit=1`);
        if(prev&&prev.length>0&&prev[0].numero!=null) numero=Number(prev[0].numero)+1;
      }catch{}
      const calc=calcularPresup(itemsValidos,presF);
      const datos={
        pedido_id:sel.id, carpinteria_id:usuario.id, numero,
        monto:calc.total, total:calc.total, subtotal:calc.subtotal,
        descuento_tipo:presF.usarDesc?presF.descTipo:null,
        descuento_valor:presF.usarDesc?nmb(presF.descValor):null,
        iva_pct:presF.usarIva?nmb(presF.ivaPct):null,
        tiempo_entrega:presF.tiempo, incluye_flete:false, monto_flete:0, detalle:null
      };
      const creado=await db.insert("presupuestos",datos);
      const presId=Array.isArray(creado)?creado[0]?.id:creado?.id;
      if(presId){
        for(let i=0;i<itemsValidos.length;i++){
          const it=itemsValidos[i];
          await db.insert("presupuesto_items",{presupuesto_id:presId,descripcion:it.descripcion.trim(),precio:nmb(it.precio),cantidad:nmb(it.cantidad),importe:nmb(it.precio)*nmb(it.cantidad),orden:i});
        }
      }
      // NO se cambia el estado global del pedido: cada carpintería ve su propio estado.
      // (El pedido solo pasa a "aceptado" cuando el cliente elige, desde su vista.)
      notif("¡Presupuesto enviado correctamente!");
      // Aviso por mail al cliente que hizo el pedido (mejor esfuerzo, sin revelar monto ni romper sobre cerrado)
      (async()=>{try{
        const cli=await db.select("usuarios",`?id=eq.${sel.cliente_id}&recibir_avisos=eq.true&select=email,nombre`);
        if(cli&&cli[0]&&cli[0].email){
          const msg="<p>Recibiste un <strong>nuevo presupuesto</strong> de una carpintería en Encastre.</p>";
          db.avisarPorMail(cli[0].email,cli[0].nombre,"Recibiste un presupuesto - Encastre",msg);
        }
      }catch(e){}})();
      setPresF({items:[{descripcion:"",precio:"",cantidad:"1"}],tiempo:"",usarDesc:false,descTipo:"porcentaje",descValor:"",usarIva:false,ivaPct:"21"});
      setYaEnvio(true);
      setMiPresupuesto({...datos,id:presId,items:itemsValidos.map(it=>({...it,precio:nmb(it.precio),cantidad:nmb(it.cantidad),importe:nmb(it.precio)*nmb(it.cantidad)})),created_at:new Date().toISOString()});
      setPedidos(ps=>ps.map(p=>p.id===sel.id?{...p,_miEstado:"enviado"}:p));
    }catch(e){alert("Error: "+e.message);}
    setEnviando(false);
  };

  const construirItemsDesdeMuebles=(p)=>{
    const muebles=(p.items&&p.items.length>0)?p.items:[{descripcion:p.descripcion||""}];
    return muebles.map(it=>({descripcion:it.descripcion||"",precio:"",cantidad:"1"}));
  };

  const abrirPedidoCliente=async(p)=>{
    setSel(p); setYaEnvio(false); setMiPresupuesto(null);
    setPresF({items:construirItemsDesdeMuebles(p),tiempo:"",usarDesc:false,descTipo:"porcentaje",descValor:"",usarIva:false,ivaPct:"21"});
    if(p._nuevo){ marcarPedidoVisto("pedidos",p.id,usuario.id); setPedidos(ps=>ps.map(x=>x.id===p.id?{...x,_nuevo:false}:x)); }
    try{
      const d=await db.select("presupuestos",`?pedido_id=eq.${p.id}&carpinteria_id=eq.${usuario.id}&limit=1`);
      if(d&&d.length>0){
        let items=[];
        try{ items=await db.select("presupuesto_items",`?presupuesto_id=eq.${d[0].id}&order=orden.asc`); }catch{}
        setMiPresupuesto({...d[0],items});
        setYaEnvio(true);
      }
      // datos del cliente para el formato
      try{ const cl=await db.select("usuarios",`?id=eq.${p.cliente_id}&limit=1`); setClienteSel(cl[0]||{}); }catch{}
    }catch{}
  };

  const aplicarIA=(s)=>{
    const its=(s.items||[]).map(i=>({descripcion:i.detalle||i.concepto||"",precio:String(i.monto||""),cantidad:"1"}));
    if(its.length>0) setPresF(f=>({...f,items:its,tiempo:s.tiempo_entrega||f.tiempo}));
  };

  const abrirPedidoAserr=async(p)=>{
    setSelAserr(p);
    try{
      const d=await db.select("cotizaciones_aserradero",`?pedido_id=eq.${p.id}&order=created_at.asc`);
      const enr=await Promise.all(d.map(async ct=>{
        const as=await db.select("usuarios",`?id=eq.${ct.aserradero_id}&limit=1`);
        let items=[];
        try{ items=Array.isArray(ct.presupuesto_items)?ct.presupuesto_items:JSON.parse(ct.presupuesto_items||"[]"); }catch{items=[];}
        return{...ct,aserraderoNombre:as[0]?.nombre||"Aserradero",aserraderoObj:as[0]||{},items};
      }));
      setCotizacionesAserr(enr);
    }catch{}
  };
  const [enviandoPed,setEnviandoPed]=useState(false);
  const enviarAserr=async()=>{
    if(enviandoPed)return;
    const itemsValidos=(asF.items||[]).filter(it=>it.material.trim()&&Number(it.pies)>0&&Number(it.pulgadas)>0&&Number(it.cantidad)>0);
    if(itemsValidos.length===0){setIntAs(true);return;}
    setEnviandoPed(true);
    try{
      const itemsLimpios=itemsValidos.map(it=>({material:it.material.trim(),pies:Number(it.pies),pulgadas:Number(it.pulgadas),espesor:Number(it.espesor||0),cantidad:Number(it.cantidad)}));
      const resumen=itemsLimpios.map(it=>`${it.material} ${it.pies}'×${it.pulgadas}"${it.espesor?` esp.${it.espesor}"`:""} (${it.cantidad}u)`).join(", ");
      const primero=itemsLimpios[0];
      // Guardamos items (lista) + columnas del primer ítem por compatibilidad con lo ya existente
      await db.insert("pedidos_aserradero",{carpinteria_id:usuario.id,items:itemsLimpios,material:primero.material,pies:primero.pies,pulgadas:primero.pulgadas,espesor:primero.espesor,cantidad:itemsLimpios.reduce((a,it)=>a+it.cantidad,0),descripcion:asF.descripcion||resumen,fecha_limite:fechaLimiteISO(asF.fechaLimite)});
      notif("¡Pedido enviado a los aserraderos!");
      (async()=>{try{const ps=await db.select("usuarios","?tipo=eq.aserradero&recibir_avisos=eq.true&select=email,nombre");const msg="<p>Tenés un <strong>nuevo pedido para cotizar</strong> en Encastre.</p>";for(const c of (ps||[])){if(c.email)db.avisarPorMail(c.email,c.nombre,"Nuevo pedido para cotizar - Encastre",msg);}}catch(e){}})();
      setAsF({items:[{material:"",pies:"",pulgadas:"",espesor:"",cantidad:""}],descripcion:"",fechaLimite:""});
      setIntAs(false);
      cargarMisPedidosAserr();
      setSubAserr("mis");
    }catch(e){alert("Error: "+e.message);}
    setEnviandoPed(false);
  };

  if(sel){
    // Compatibilidad: pedidos viejos sin "items" arman un solo mueble con las columnas planas
    const muebles=(sel.items&&sel.items.length>0)?sel.items:[{descripcion:sel.descripcion,alto:sel.alto,ancho:sel.ancho,profundidad:sel.profundidad,material:sel.material,especie:sel.especie,terminacion:sel.terminacion,color:sel.color,notasCroquis:sel.notas_croquis,croquisImg:sel.croquis_imagen}];
    return(
      <div className="fade">
        <button style={{...S.btn("ghost"),marginBottom:14}} onClick={()=>setSel(null)}>← Volver</button>
        <div style={S.card}>
          <PedidoClienteFormato
            cliente={{nombre:sel._clienteNombre}}
            fecha={sel.created_at?new Date(sel.created_at).toLocaleDateString("es-AR"):null}
            fechaLimite={sel.fecha_limite?new Date(sel.fecha_limite).toLocaleDateString("es-AR"):null}
            items={muebles}
          />

        {/* IA de sugerencia desactivada temporalmente — reponer cuando esté el puente serverless de Netlify */}

        {(sel.estado==="aceptado"&&(!miPresupuesto||miPresupuesto.estado!=="aceptado"))?(
        <div style={{marginTop:20,paddingTop:20,borderTop:`2px dashed ${C.borde}`,textAlign:"center"}}>
          <div style={{fontSize:32,marginBottom:8}}>🔒</div>
          <div style={{fontFamily:"'Lato',sans-serif",fontSize:19,color:C.marron,fontWeight:700}}>Pedido cerrado</div>
          <div style={{fontSize:16,color:C.textoSuave,marginTop:6}}>El cliente ya eligió un presupuesto para este pedido.</div>
          {miPresupuesto&&<div style={{marginTop:12}}>
            <PresupuestoFormato empresa={usuario} cliente={clienteSel||{}} items={miPresupuesto.items||[]} opts={{descuento_tipo:miPresupuesto.descuento_tipo,descuento_valor:miPresupuesto.descuento_valor,iva_pct:miPresupuesto.iva_pct}} numero={miPresupuesto.numero!=null?miPresupuesto.numero:""} fecha={miPresupuesto.created_at?new Date(miPresupuesto.created_at).toLocaleDateString("es-AR"):null} tiempoEntrega={miPresupuesto.tiempo_entrega} esEmpresa={true} aceptado={false}/>
          </div>}
        </div>
        ):(sel.fecha_limite&&new Date(sel.fecha_limite)<new Date()&&!miPresupuesto)?(
        <div style={{marginTop:20,paddingTop:20,borderTop:`2px dashed ${C.borde}`,textAlign:"center"}}>
          <div style={{fontSize:32,marginBottom:8}}>⛔</div>
          <div style={{fontFamily:"'Lato',sans-serif",fontSize:19,color:"#B23A2E",fontWeight:700}}>Este pedido venció</div>
          <div style={{fontSize:16,color:C.textoSuave,marginTop:6}}>El cliente puso una fecha límite que ya pasó, así que no se pueden enviar presupuestos.</div>
        </div>
        ):miPresupuesto?(
        <div style={{marginTop:20,paddingTop:20,borderTop:`2px dashed ${C.borde}`}}>
          <div style={S.cardTitle}>✅ Presupuesto enviado</div>
          <div style={{fontSize:15,color:C.textoSuave,marginBottom:10}}>Ya le enviaste un presupuesto a este cliente. Así lo ve:</div>
          <PresupuestoFormato
            empresa={usuario}
            cliente={clienteSel||{}}
            items={miPresupuesto.items||[]}
            opts={{descuento_tipo:miPresupuesto.descuento_tipo,descuento_valor:miPresupuesto.descuento_valor,iva_pct:miPresupuesto.iva_pct}}
            numero={miPresupuesto.numero!=null?miPresupuesto.numero:""}
            fecha={miPresupuesto.created_at?new Date(miPresupuesto.created_at).toLocaleDateString("es-AR"):null}
            tiempoEntrega={miPresupuesto.tiempo_entrega}
            esEmpresa={true}
            aceptado={miPresupuesto.estado==="aceptado"}
          />
        </div>
        ):(
        <div style={{marginTop:20,paddingTop:20,borderTop:`2px dashed ${C.borde}`}}>
          <div style={S.cardTitle}>💰 Tu presupuesto</div>

          {(() => {
            const calc=calcularPresup(presF.items,presF);
            const setItem=(i,campo,val)=>setPresF(f=>{const its=[...f.items];its[i]={...its[i],[campo]:val};return{...f,items:its};});
            const addItem=()=>setPresF(f=>({...f,items:[...f.items,{descripcion:"",precio:"",cantidad:"1"}]}));
            const delItem=(i)=>setPresF(f=>({...f,items:f.items.length>1?f.items.filter((_,j)=>j!==i):f.items}));
            return(
            <div>
              <div style={{fontSize:14,color:C.textoSuave,marginBottom:10}}>Agregá un renglón por cada concepto (materiales, herrajes, mano de obra, flete si lo cobrás, etc.).</div>
              {presF.items.map((it,i)=>{
                const imp=nmb(it.precio)*nmb(it.cantidad);
                return(
                <div key={i} style={{padding:"12px 0",borderBottom:`1px dashed ${C.borde}`}}>
                  <div style={{marginBottom:8}}>
                    <label style={S.label}>Descripción</label>
                    <input value={it.descripcion} onChange={e=>setItem(i,"descripcion",e.target.value)} placeholder="Ej: Tablero de pino sin nudos" style={S.input}/>
                  </div>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end"}}>
                    <div style={{flex:1,minWidth:110}}>
                      <label style={S.label}>Precio ($)</label>
                      <input type="number" value={it.precio} onChange={e=>setItem(i,"precio",e.target.value)} placeholder="0" style={S.input}/>
                    </div>
                    <div style={{flex:"0 0 90px"}}>
                      <label style={S.label}>Cantidad</label>
                      <input type="number" value={it.cantidad} onChange={e=>setItem(i,"cantidad",e.target.value)} placeholder="1" style={S.input}/>
                    </div>
                    <div style={{flex:1,minWidth:110,textAlign:"right"}}>
                      <label style={S.label}>Importe</label>
                      <div style={{fontWeight:800,color:C.marron,fontSize:17,padding:"10px 0"}}>{fmtPeso(imp)}</div>
                    </div>
                  </div>
                  {presF.items.length>1&&<button onClick={()=>delItem(i)} style={{...S.btn("ghost"),color:C.error,borderColor:C.error,fontSize:14,padding:"5px 10px",marginTop:6,minHeight:"auto"}}>🗑️ Quitar renglón</button>}
                </div>
                );
              })}
              <button onClick={addItem} style={{...S.btn("ghost"),width:"100%",justifyContent:"center",marginBottom:14}}>＋ Agregar renglón</button>

              <div style={{marginBottom:12}}>
                <label style={S.label}>Tiempo de entrega <span style={{fontWeight:400,color:C.textoSuave}}>(opcional)</span></label>
                <input value={presF.tiempo} onChange={e=>setPresF(f=>({...f,tiempo:e.target.value}))} placeholder="Ej: 15 días" style={S.input}/>
              </div>

              {/* DESCUENTO */}
              <div style={{border:`1px solid ${C.borde}`,borderRadius:0,padding:10,marginBottom:10}}>
                <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:16,color:C.marron,fontWeight:700}}>
                  <input type="checkbox" checked={presF.usarDesc} onChange={e=>setPresF(f=>({...f,usarDesc:e.target.checked}))}/>
                  Aplicar descuento
                </label>
                {presF.usarDesc&&(
                  <div style={{display:"flex",gap:8,marginTop:8,alignItems:"flex-end"}}>
                    <div style={{flex:"0 0 140px"}}>
                      <label style={S.label}>Tipo</label>
                      <select value={presF.descTipo} onChange={e=>setPresF(f=>({...f,descTipo:e.target.value}))} style={S.input}>
                        <option value="porcentaje">Porcentaje (%)</option>
                        <option value="monto">Monto fijo ($)</option>
                      </select>
                    </div>
                    <div style={{flex:1}}>
                      <label style={S.label}>{presF.descTipo==="porcentaje"?"% de descuento":"Monto ($)"}</label>
                      <input type="number" value={presF.descValor} onChange={e=>setPresF(f=>({...f,descValor:e.target.value}))} placeholder="0" style={S.input}/>
                    </div>
                  </div>
                )}
              </div>

              {/* IVA */}
              <div style={{border:`1px solid ${C.borde}`,borderRadius:0,padding:10,marginBottom:14}}>
                <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:16,color:C.marron,fontWeight:700}}>
                  <input type="checkbox" checked={presF.usarIva} onChange={e=>setPresF(f=>({...f,usarIva:e.target.checked}))}/>
                  Agregar IVA
                </label>
                {presF.usarIva&&(
                  <div style={{marginTop:8}}>
                    <label style={S.label}>% de IVA</label>
                    <input type="number" value={presF.ivaPct} onChange={e=>setPresF(f=>({...f,ivaPct:e.target.value}))} placeholder="21" style={{...S.input,maxWidth:160}}/>
                  </div>
                )}
              </div>

              {/* TOTALES */}
              <div style={{background:C.suave,borderRadius:0,padding:12,border:`1px solid ${C.borde}`,marginBottom:12}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:6,fontSize:16}}><span style={{color:C.textoSuave}}>Subtotal</span><b>{fmtPeso(calc.subtotal)}</b></div>
                {presF.usarDesc&&calc.descuento>0&&<div style={{display:"flex",justifyContent:"space-between",marginBottom:6,fontSize:16,color:C.error}}><span>Descuento{presF.descTipo==="porcentaje"?` (${nmb(presF.descValor)}%)`:""}</span><b>− {fmtPeso(calc.descuento)}</b></div>}
                {presF.usarIva&&<div style={{display:"flex",justifyContent:"space-between",marginBottom:6,fontSize:16}}><span style={{color:C.textoSuave}}>IVA ({nmb(presF.ivaPct)}%)</span><b>{fmtPeso(calc.iva)}</b></div>}
                <div style={{display:"flex",justifyContent:"space-between",borderTop:`2px solid ${C.verde}`,paddingTop:8,marginTop:4}}><span style={{fontWeight:800,fontSize:19,color:C.marron}}>TOTAL</span><b style={{fontWeight:800,fontSize:22,color:C.verde}}>{fmtPeso(calc.total)}</b></div>
              </div>

              <button style={{...S.btn("dark"),opacity:enviando||yaEnvio?0.6:1}} onClick={enviarPresup} disabled={enviando||yaEnvio}>
                {enviando?"⟳ Enviando...":(yaEnvio?"✅ Presupuesto enviado":"📤 Enviar presupuesto")}
              </button>
              {yaEnvio&&<div style={{fontSize:17,color:C.verde,marginTop:6,fontWeight:700}}>✅ El cliente ya recibió tu presupuesto.</div>}
            </div>
            );
          })()}
        </div>
        )}

        <div style={{marginTop:20,paddingTop:20,borderTop:`2px dashed ${C.borde}`}}>
          <div style={S.cardTitle}>💬 Chat con cliente</div>
          <Chat pedidoId={sel.id} tipoPedido="cliente" miUsuario={usuario} otroUsuario={{id:sel.cliente_id}} onLeido={cargar}/>
        </div>
        <div style={{textAlign:"right",marginTop:12}}><button style={{...S.btn("ghost"),fontSize:14,padding:"8px 14px",color:C.textoSuave}} onClick={()=>archivarPedido(sel)}>🗑️ Archivar este pedido</button></div>
        </div>
      </div>
    );
  }

  const tabStyle=(id)=>({background:tab===id?C.marron:"transparent",color:tab===id?C.crema:C.textoSuave,border:tab===id?"none":`1px solid ${C.borde}`,borderRadius:0,padding:"7px 14px",cursor:"pointer",fontSize:17,fontWeight:700,fontFamily:"'Lato',sans-serif"});

  return(
    <div>
      <div style={{display:"flex",gap:7,marginBottom:18,flexWrap:"wrap"}}>
        {[["pedidos","📋 Pedidos recibidos"],["aserradero","🪵 Aserraderos"],["ferreteria","🔩 Ferreterías"],["pintureria","🎨 Pinturerías"]].map(([id,l])=>{
          const n=badges[id]||0;
          const est=tabStyle(id);
          return(
          <button key={id} style={{...est,fontWeight:n>0?900:est.fontWeight}} onClick={()=>setTab(id)}>{l}<Badge9 n={n}/></button>
          );
        })}
      </div>

      {tab==="pedidos"&&(
        <div>
          <div style={S.secTitle}>Pedidos de presupuesto de clientes</div>
          <div style={{position:"relative",marginBottom:14}}>
            <input value={buscarPedido} onChange={e=>setBuscarPedido(e.target.value)} placeholder="🔍 Buscar por cliente o por encargo..." style={{...S.input,paddingRight:buscarPedido?40:15}}/>
            {buscarPedido&&<button type="button" onClick={()=>setBuscarPedido("")} aria-label="Borrar búsqueda" style={{position:"absolute",right:6,top:"50%",transform:"translateY(-50%)",minHeight:"auto",background:"none",border:"none",cursor:"pointer",fontSize:18,padding:6,color:C.textoSuave}}>✕</button>}
          </div>
          {pedidos.length===0&&<div style={{...S.card,color:C.textoSuave,textAlign:"center",padding:28,fontStyle:"italic"}}>No hay pedidos aún</div>}
          {pedidos.length>0&&(()=>{
            const venc=p=>p.fecha_limite&&new Date(p.fecha_limite)<new Date();
            const cuenta={
              cotizar:pedidos.filter(p=>p.estado!=="aceptado"&&!venc(p)&&!p._miEstado).length,
              cotizados:pedidos.filter(p=>p._miEstado&&p.estado!=="aceptado").length,
              cerrados:pedidos.filter(p=>p.estado==="aceptado").length,
              vencido:pedidos.filter(p=>venc(p)&&p.estado!=="aceptado"&&!p._miEstado).length,
              todos:pedidos.length,
            };
            return(
              <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
                {[["cotizar","Para cotizar"],["cotizados","Cotizados"],["cerrados","Cerrados"],["vencido","Vencidos"],["todos","Todos"]].map(([id,l])=>(
                  <button key={id} style={{...S.btn(filtroCarp===id?"dark":"ghost"),fontSize:15,padding:"6px 12px"}} onClick={()=>setFiltroCarp(id)}>{l} {cuenta[id]}</button>
                ))}
              </div>
            );
          })()}
          {(()=>{
            const q=buscarPedido.trim().toLowerCase();
            const venc=p=>p.fecha_limite&&new Date(p.fecha_limite)<new Date();
            let lista=pedidos.filter(p=>{
              if(archivadosPed.has(p.id))return false;
              if(filtroCarp==="cotizar")return p.estado!=="aceptado"&&!venc(p)&&!p._miEstado;
              if(filtroCarp==="cotizados")return p._miEstado&&p.estado!=="aceptado";
              if(filtroCarp==="cerrados")return p.estado==="aceptado";
              if(filtroCarp==="vencido")return venc(p)&&p.estado!=="aceptado"&&!p._miEstado;
              return true;
            });
            if(q)lista=lista.filter(p=>(p.descripcion||"").toLowerCase().includes(q)||(p._clienteNombre||"").toLowerCase().includes(q));
            if(pedidos.length>0&&lista.length===0) return <div style={{...S.card,color:C.textoSuave,textAlign:"center",padding:24,fontStyle:"italic"}}>No hay pedidos en esta categoría{q?` para "${buscarPedido}"`:""}</div>;
            return lista.map(p=>{
            const mat=MATS.find(m=>m.id===p.material);
            const vencido=p.fecha_limite&&new Date(p.fecha_limite)<new Date();
            let et;
            if(p.estado==="aceptado"){ et=p._miEstado==="aceptado"?{t:"Aceptado ✓",bg:C.verde,fg:"#fff"}:{t:"Cerrado · adjudicado a otro",bg:"#8A7A6A",fg:"#fff"}; }
            else if(p._miEstado){ et={t:"Cotizado por mí",bg:C.acento,fg:C.marron}; }
            else if(vencido){ et={t:"Vencido",bg:"#B23A2E",fg:"#fff"}; }
            else { et={t:"Para cotizar",bg:C.marron,fg:C.crema}; }
            const cerradoParaMi = p.estado==="aceptado" && p._miEstado!=="aceptado";
            return(
              <div key={p.id} style={{...S.card,cursor:cerradoParaMi?"default":"pointer",transition:"all .15s",opacity:cerradoParaMi?0.7:1,borderColor:p._nuevo?"#009966":"#8B451399",borderWidth:p._nuevo?2:1}} onClick={()=>{ if(!cerradoParaMi) abrirPedidoCliente(p); }}
                onMouseEnter={e=>{if(!cerradoParaMi){e.currentTarget.style.borderColor=C.acento;e.currentTarget.style.transform="translateY(-1px)";}}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor=p._nuevo?"#009966":C.borde;e.currentTarget.style.transform="none";}}>
                <div style={{display:"flex",justifyContent:"space-between",gap:10}}>
                  <div>
                    <div style={{fontFamily:"'Lato',sans-serif",fontWeight:700,color:C.marron,fontSize:21}}>{p.descripcion}<TagNuevo on={p._nuevo}/><TagMsjNuevo on={p._msjNuevo}/></div>
                    {p._clienteNombre&&<div style={{fontSize:16,color:C.marron,marginTop:2}}>👤 {p._clienteNombre}</div>}
                    <div style={{fontSize:17,color:C.textoSuave,marginTop:3}}>{p.alto}×{p.ancho}×{p.profundidad}cm · {mat?.label} · {new Date(p.created_at).toLocaleDateString("es-AR")}{p.items&&p.items.length>1?` · +${p.items.length-1} mueble${p.items.length>2?"s":""} más`:""}</div>
                    {p.fecha_limite&&<div style={{marginTop:4}}><AvisoVence fechaLimite={p.fecha_limite}/></div>}
                  </div>
                  <span style={{alignSelf:"flex-start",whiteSpace:"nowrap",background:et.bg,color:et.fg,fontSize:13,fontWeight:700,padding:"5px 10px",borderRadius:0,fontFamily:"'Lato',sans-serif"}}>{et.t}</span>
                </div>
              </div>
            );
          });
          })()}
        </div>
      )}

      {tab==="aserradero"&&subAserr==="pedir"&&(
        <div style={S.card}>
          <button style={{...S.btn("ghost"),marginBottom:14}} onClick={()=>setSubAserr("mis")}>← Volver a mis pedidos</button>
          <div style={S.cardTitle}>🪵 Pedir madera al aserradero</div>
          <div style={{fontSize:17,color:C.textoSuave,marginBottom:14,fontStyle:"italic"}}>Las medidas van en pulgadas y pies (como trabaja el aserradero). Podés pedir varias maderas en un mismo pedido.</div>
          {asF.items.map((it,i)=>{
            const setIt=(campo,val)=>setAsF(f=>{const its=[...f.items];its[i]={...its[i],[campo]:val};return{...f,items:its};});
            const faltaMat=intAs&&!it.material.trim(), faltaPies=intAs&&!it.pies, faltaAncho=intAs&&!it.pulgadas, faltaCant=intAs&&!it.cantidad;
            return(
            <div key={i} style={{border:`1px solid ${C.borde}`,borderRadius:0,padding:10,marginBottom:8,background:C.suave}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div style={{fontWeight:700,color:C.marron}}>Madera {i+1}</div>
              </div>
              <label style={S.label}>Tipo de madera</label>
              <input value={it.material} onChange={e=>setIt("material",e.target.value)} placeholder="Ej: Roble, Pino, Cedro, Quebracho..." style={{...S.input,marginBottom:8,...marcaErr(intAs,!it.material)}}/>
              <div style={S.row}>
                <div style={S.col()}><label style={S.label}>Largo (pies)</label><input type="number" value={it.pies} onChange={e=>setIt("pies",e.target.value)} placeholder="0'" style={{...S.input,...marcaErr(intAs,!it.pies)}}/>{it.pies&&<div style={{fontSize:16,color:C.textoSuave,fontFamily:"monospace"}}>= {ftToCm(it.pies)}cm</div>}</div>
                <div style={S.col()}><label style={S.label}>Ancho (pulgadas)</label><input type="number" value={it.pulgadas} onChange={e=>setIt("pulgadas",e.target.value)} placeholder='0"' style={{...S.input,...marcaErr(intAs,!it.pulgadas)}}/>{it.pulgadas&&<div style={{fontSize:16,color:C.textoSuave,fontFamily:"monospace"}}>= {inToCm(it.pulgadas)}cm</div>}</div>
                <div style={S.col()}><label style={S.label}>Espesor (pulgadas)</label><input type="number" value={it.espesor||""} onChange={e=>setIt("espesor",e.target.value)} placeholder='0"' style={S.input}/>{it.espesor&&<div style={{fontSize:16,color:C.textoSuave,fontFamily:"monospace"}}>= {inToCm(it.espesor)}cm</div>}</div>
                <div style={S.col()}><label style={S.label}>Cantidad</label><input type="number" value={it.cantidad} onChange={e=>setIt("cantidad",e.target.value)} placeholder="0" style={{...S.input,...marcaErr(intAs,!it.cantidad)}}/></div>
              </div>
              {asF.items.length>1&&<button onClick={()=>setAsF(f=>({...f,items:f.items.filter((_,j)=>j!==i)}))} style={{...S.btn("ghost"),color:C.error,borderColor:C.error,fontSize:14,padding:"5px 10px",marginTop:6,minHeight:"auto"}}>🗑️ Quitar madera</button>}
            </div>
            );
          })}
          <button onClick={()=>setAsF(f=>({...f,items:[...f.items,{material:"",pies:"",pulgadas:"",espesor:"",cantidad:""}]}))} style={{...S.btn("ghost"),width:"100%",justifyContent:"center",marginBottom:14}}>＋ Agregar otra madera</button>
          <div style={{marginTop:0}}><label style={S.label}>Observaciones <span style={{fontWeight:400,color:C.textoSuave}}>(opcional)</span></label><textarea value={asF.descripcion} onChange={e=>setAsF(f=>({...f,descripcion:e.target.value}))} placeholder="Calidad, secado, escuadría..." style={{...S.input,minHeight:56,resize:"vertical"}}/></div>
          <BannerFalta activo={intAs} lista={[[asF.items.every(it=>!it.material.trim()||!it.pies||!it.pulgadas||!it.cantidad),"al menos una madera completa (tipo, largo, ancho y cantidad)"]]}/>
          <div style={{marginTop:12}}>
            <label style={S.label}>Fecha límite para recibir cotizaciones <span style={{fontWeight:400,color:C.textoSuave}}>(opcional)</span></label>
            <input type="date" min={minFechaLimite()} value={asF.fechaLimite||""} onChange={e=>setAsF(f=>({...f,fechaLimite:e.target.value}))} style={{...S.input,maxWidth:220}}/>
            <div style={{fontSize:14,color:C.textoSuave,marginTop:4}}>Pasada esa fecha el pedido se marca vencido y ya no se puede cotizar.</div>
          </div>
          <button style={{...S.btn("dark"),marginTop:12,opacity:enviandoPed?0.6:1}} disabled={enviandoPed} onClick={enviarAserr}>{enviandoPed?"⟳ Enviando...":"📤 Enviar a aserraderos"}</button>
        </div>
      )}

      {tab==="aserradero"&&subAserr==="mis"&&(
        <>
          <div style={{display:"flex",justifyContent:"flex-end",marginBottom:14}}>
            <button style={S.btn("dark")} onClick={()=>setSubAserr("pedir")}>➕ Nuevo pedido</button>
          </div>
          {misPedidosAserr.length===0&&(
          <div style={S.card}>
            <div style={{fontSize:17,color:C.textoSuave,fontStyle:"italic"}}>Todavía no enviaste pedidos de madera. Tocá "➕ Nuevo pedido" arriba para hacer el primero.</div>
          </div>
          )}

          {misPedidosAserr.length>0&&(
          <>
            <div style={{fontFamily:"'Lato',sans-serif",fontWeight:700,color:C.marron,fontSize:20,marginBottom:12}}>📋 Mis pedidos enviados ({misPedidosAserr.length})</div>
            {misPedidosAserr.map(p=>{
              const abierto=selAserr&&selAserr.id===p.id;

                        <div style={{fontWeight:700,fontSize:18,color:C.marron}}>{p.descripcion}{p._msjNuevo&&<span style={{marginLeft:8,fontSize:12,fontWeight:700,color:"#fff",background:"#009966",borderRadius:0,padding:"2px 8px",fontFamily:"'Lato',sans-serif",verticalAlign:"middle"}}>💬 Mensaje nuevo</span>}</div>
                        <div style={{fontSize:17,color:C.textoSuave}}>{Array.isArray(p.items)&&p.items.length>0?`${p.items.length} ítem${p.items.length>1?"s":""}`:([p.color&&`🎨 ${p.color}`,p.tono,p.litros&&`${p.litros} L`].filter(Boolean).join(" · ")||"Sin detalle")} · {new Date(p.created_at).toLocaleDateString("es-AR")}</div>
                        {p.fecha_limite&&<div style={{marginTop:4}}><AvisoVence fechaLimite={p.fecha_limite}/></div>}
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
