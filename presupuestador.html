<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Presupuesto automático · Encastre</title>
<link rel="icon" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Stardos+Stencil:wght@400;700&family=Lato:wght@400;700;900&display=swap">
<style>
/* Versión sencilla: tres hojas (el mueble, la madera, el presupuesto) y números redondos */
:root{
  --bg:#F4ECE1; --paper:#FFFBF5; --ink:#3A2412; --muted:#7A6654; --line:#DCCBB6;
  --wood:#7E3A22; --green:#4A7C3F; --green-soft:#E3EEDD; --warn:#9A5B00; --warn-soft:#FBEBD0; --input:#FFFFFF;
  --f-display:"Stardos Stencil","Arial Narrow",Impact,sans-serif;
  --f-body:"Lato",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E1611; --paper:#2A201A; --ink:#F1E6D8; --muted:#B9A794; --line:#4A3B30;
  --wood:#D98B63; --green:#8CC17C; --green-soft:#24331F; --warn:#F0B35A; --warn-soft:#3A2B14; --input:#1E1611; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E1611; --paper:#2A201A; --ink:#F1E6D8; --muted:#B9A794; --line:#4A3B30;
  --wood:#D98B63; --green:#8CC17C; --green-soft:#24331F; --warn:#F0B35A; --warn-soft:#3A2B14; --input:#1E1611; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-block:16px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.aviso{background:var(--warn-soft);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:15px}
.aviso b{color:var(--warn)}
section.hoja{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.hoja h2{font-family:var(--f-display);font-size:24px;margin:0;color:var(--wood)}
.nota{font-size:14px;color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
label.campo{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);font-weight:700}
input,select,textarea{font:inherit;color:var(--ink);background:var(--input);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical;font-size:15px}
input[type=number]{font-variant-numeric:tabular-nums}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.checks label{display:flex;align-items:center;gap:8px;font-size:16px}
.checks input{width:20px;height:20px}
.btn{font:inherit;font-weight:700;font-size:16px;border-radius:8px;padding:11px 18px;border:2px solid var(--green);background:transparent;color:var(--green);cursor:pointer}
.btn.lleno{background:var(--green);color:var(--paper)}
.btn:disabled{opacity:.5;cursor:wait}
.fila-btn{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.estado{font-size:15px;color:var(--muted)}
.estado.ok{color:var(--green)}
.estado.err{color:var(--warn)}
.tipos{display:flex;gap:8px;flex-wrap:wrap}
.tipos label{border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex;gap:8px;align-items:center;cursor:pointer;flex:1 1 140px;font-weight:700}
.tipos label:has(input:checked){border-color:var(--green);background:var(--green-soft)}
.tipos input{width:auto}
.renglon{display:grid;grid-template-columns:1fr 150px;gap:6px 12px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}
.renglon .nom{font-weight:700;font-size:17px}
.renglon .det{grid-column:1/-1;font-size:14px;color:var(--muted)}
.renglon input.monto{text-align:right;font-weight:700;font-size:17px}
.mini{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.mini input{width:84px;padding:4px 6px;font-size:14px;text-align:right}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;border-top:2px solid var(--ink)}
.total span:first-child{font-weight:900;font-size:20px}
.total span:last-child{font-family:var(--f-display);font-size:34px;color:var(--wood)}
.oculto{display:none!important}
@media (max-width:480px){.renglon{grid-template-columns:1fr 120px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="aviso oculto" id="avisoSesion"></div>

  <!-- 1. EL MUEBLE -->
  <section class="hoja">
    <h2>1 · El mueble</h2>
    <label class="campo oculto" id="campoMueble">Mueble del pedido<select id="mueble"></select></label>
    <label class="campo">Lo que pidió el cliente (o escribilo vos)
      <textarea id="texto">Guardado de 170 de alto por 230 de ancho y 30 de fondo, en MDF blanco. 2 puertas con 4 estantes y 25 casilleros. Se amura.</textarea>
    </label>
    <div class="fila-btn">
      <button class="btn lleno" id="btnInterpretar">Armar presupuesto</button>
      <span class="estado" id="estadoIA"></span>
    </div>
    <div class="tipos">
      <label><input type="radio" name="tipo" value="caja"> Mueble con puertas o cajones</label>
      <label><input type="radio" name="tipo" value="mesa"> Mesa o escritorio</label>
      <label><input type="radio" name="tipo" value="estante"> Estante o tapa</label>
    </div>
    <div class="grid">
      <label class="campo" id="lAlto">Alto (cm)<input id="alto" type="number"></label>
      <label class="campo" id="lAncho">Ancho (cm)<input id="ancho" type="number"></label>
      <label class="campo" id="lProf">Profundidad (cm)<input id="prof" type="number"></label>
      <label class="campo sCaja">Puertas<input id="puertas" type="number"></label>
      <label class="campo sCaja">Cajones<input id="cajones" type="number"></label>
      <label class="campo sCaja">Estantes<input id="estantes" type="number"></label>
      <label class="campo sCaja">Casilleros<input id="casilleros" type="number"></label>
    </div>
    <div class="checks">
      <label><input type="checkbox" id="instala"> Se instala en el lugar</label>
      <label><input type="checkbox" id="termina"> Lleva terminación (barniz, laca, aceite)</label>
    </div>
  </section>

  <!-- 2. LA MADERA -->
  <section class="hoja">
    <h2>2 · La madera</h2>
    <div class="grid">
      <label class="campo">Material<select id="material"></select></label>
      <label class="campo">La comprás por
        <select id="unidad">
          <option value="placa">Placa</option>
          <option value="pie">Pie</option>
          <option value="pieza">Pieza (tabla o tirante)</option>
        </select>
      </label>
      <label class="campo" id="lSeccion">Sección<select id="seccion"></select></label>
      <label class="campo" id="lLargo">Largo<select id="largo"></select></label>
      <label class="campo">Precio ($)<input id="precio" type="number"></label>
    </div>
    <p class="nota" id="notaMadera"></p>
  </section>

  <!-- 3. EL PRESUPUESTO -->
  <section class="hoja">
    <h2>3 · El presupuesto</h2>
    <p class="nota">Números redondos y orientativos. Cambiá cualquier monto.</p>
    <div id="renglones"></div>
    <div class="total"><span>Total</span><span id="total">$0</span></div>
    <div class="fila-btn">
      <button class="btn lleno" id="btnCargar">Cargar en "Tu presupuesto"</button>
      <span class="estado" id="estadoCargar"></span>
    </div>
  </section>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const num=v=>{const x=parseFloat(String(v??"").replace(",","."));return isFinite(x)?x:0};
const fmt=n=>"$"+Math.round(n||0).toLocaleString("es-AR");
const mil=n=>Math.ceil((n||0)/1000)*1000;           // renglones: a miles, para arriba
const cincoMil=n=>Math.ceil((n||0)/5000)*5000;      // total: a $5.000, para arriba
const coma=v=>String(v).replace(".",",");

/* ---------- datos fijos ---------- */
const MATS=[
  {id:"mdf_mel",nombre:"MDF melamina blanco 18 mm",tipo:"placa",esp:18,placa:[2600,1830],precio:99331,servicio:true},
  {id:"agl_mel",nombre:"Aglomerado melamina 18 mm",tipo:"placa",esp:18,placa:[2600,1830],servicio:true},
  {id:"mdf_crudo",nombre:"MDF crudo 18 mm",tipo:"placa",esp:18,placa:[2600,1830]},
  {id:"agl_crudo",nombre:"Aglomerado crudo 18 mm",tipo:"placa",esp:18,placa:[2600,1830]},
  {id:"fenolico",nombre:"Fenólico 18 mm",tipo:"placa",esp:18,placa:[2440,1220]},
  {id:"pino_tab",nombre:"Tablero de pino 20 mm",tipo:"placa",esp:20,placa:[3000,1200],precio:85000},
  {id:"pino",nombre:"Pino",tipo:"macizo",esp:22},
  {id:"eucalipto",nombre:"Eucalipto",tipo:"macizo",esp:22},
  {id:"paraiso",nombre:"Paraíso",tipo:"macizo",esp:22},
  {id:"kiri",nombre:"Kiri",tipo:"macizo",esp:22},
  {id:"cedro",nombre:"Cedro",tipo:"macizo",esp:22},
  {id:"roble",nombre:"Roble",tipo:"macizo",esp:22},
  {id:"dura",nombre:"Madera dura",tipo:"macizo",esp:22},
  {id:"semidura",nombre:"Madera semidura",tipo:"macizo",esp:22},
  {id:"blanda",nombre:"Madera blanda",tipo:"macizo",esp:22}
];
const NOM={"1":20,"1.5":30,"2":40,"3":65,"4":90,"6":140,"8":185,"10":235,"12":285}; // medida real (INTI)
const real=n=>NOM[String(n)]||Math.round(n*25.4*0.8);
const SECCIONES=["1x4","1x6","1x8","1x10","1x12","1.5x6","2x2","2x3","2x4","2x6","3x3","3x6"];
const LARGOS=[2.44,3.05,3.66,4.25,4.85,5.45];
const PIE_M3=0.00235974;
const OESTE={corte:1292,canto:395};       // precios del proveedor de placas (Oeste Maderas)
const HERR={bisagra:2200,manija:1800};    // precios reales por unidad (caja de 10)
const REF_TOPIC={"1x6|3.05":11000,"1x8|3.05":15100,"2x2|3.05":7700,"2x4|3.05":15000,"2x6|3.05":22500,"3x6|3.05":34800};

/* ---------- memoria por carpintería (solo en este dispositivo) ---------- */
const MEM_KEY="encastre_pres_simple";
let MEM={};try{MEM=JSON.parse(localStorage.getItem(MEM_KEY)||"{}")}catch(e){}
const guardarMem=()=>{try{localStorage.setItem(MEM_KEY,JSON.stringify(MEM))}catch(e){}};
const precioKey=()=>`${S.material}|${S.unidad}|${S.unidad==="pieza"?S.seccion+"|"+S.largo:""}`;

/* ---------- estado ---------- */
const S={tipo:"caja",alto:170,ancho:230,prof:30,puertas:2,cajones:0,estantes:4,casilleros:25,instala:true,termina:false,
  material:"mdf_mel",unidad:"placa",seccion:"1x6",largo:3.05,precio:99331,
  valorHora:MEM.valorHora||7100,ganancia:MEM.ganancia??30,horasDia:MEM.horasDia||3.5,
  herr:{bisagra:MEM.bisagra??HERR.bisagra,manija:MEM.manija??HERR.manija,corredera:MEM.corredera??0},
  litro:MEM.litro??0, montos:{}};
const matSel=()=>MATS.find(m=>m.id===S.material)||MATS[0];

/* ---------- cálculo ---------- */
function calcular(){
  const m=matSel(),macizo=m.tipo==="macizo";
  const e=S.unidad==="pieza"?real(S.seccion.split("x")[0]):m.esp;
  const H=S.alto*10,W=S.ancho*10,D=S.prof*10;
  let area=0,vol=0,piezas=0,canto=0,horas=0,horasInst=0,termM2=0;
  const herr={bisagras:0,manijas:0,correderas:0,soportes:0},det=[];
  const pieza=(cant,a,b,esp,lados)=>{if(cant<=0||a<=0||b<=0)return;const ar=cant*a*b/1e6;area+=ar;vol+=ar*esp/1000;piezas+=cant;canto+=lados===4?cant*2*(a+b)/1000:lados===1?cant*Math.max(a,b)/1000:0;termM2+=ar*1.5};
  if(S.tipo==="caja"){
    const zoc=H>=800?70:0,Hc=H-zoc,Hl=Hc-2*e;
    const mods=Math.max(1,Math.ceil(S.puertas/2)+(S.cajones>0&&S.puertas>0?0:0));
    const cas=Math.max(0,S.casilleros),modCas=cas>0?1:0;
    const totMods=mods+modCas;
    pieza(totMods+1,D,Hl,e,1);                 // laterales y divisores
    pieza(2,D,W,e,1);                          // tapa y piso
    const wMod=(W-(totMods+1)*e)/totMods;
    pieza(S.estantes,D-20,wMod,e,1);
    let divs=0,hors=0;
    if(cas){const f=Math.max(1,Math.round(Math.sqrt(cas))),c=Math.ceil(cas/f);hors=f-1;divs=(c-1)*f;pieza(hors,D,wMod,e,1);pieza(divs,D,(Hl-(f-1)*e)/f,e,1)}
    if(S.puertas>0){const ph=Hc-S.cajones*180;pieza(S.puertas,(wMod*mods+2*e)/S.puertas,ph,e,4);herr.bisagras=S.puertas*(ph<=1000?2:ph<=1700?3:4)}
    if(S.cajones>0){pieza(S.cajones,177,wMod+2*e,e,4);pieza(4*S.cajones,140,Math.max(D-60,wMod-30),e,1);herr.correderas=S.cajones}
    herr.manijas=S.puertas+S.cajones;
    if(zoc)pieza(1,zoc,W,e,4);
    const fondo=W*Hc/1e6;
    horas=3+3*totMods+0.45*(S.estantes+hors)+0.25*divs+1.5*S.puertas+2*S.cajones+(zoc?1.5:0)+1;
    horasInst=S.instala?2:0;
    det.fondo=fondo;
  } else if(S.tipo==="mesa"){
    const et=macizo?30:e,sp=65,L=W,A=D;
    pieza(1,A,L,et,macizo?0:4);
    const pv=4*sp*sp*(H-et)/1e9;vol+=pv;piezas+=4;            // patas
    pieza(2,100,L-2*40-2*sp+50,e,0);pieza(2,100,A-2*40-2*sp+50,e,0);
    horas=2+4+4+2.5*(L*A/1e6)+2;
    horasInst=S.instala?1:0;
  } else {
    const L=W,A=D;pieza(1,A,L,e,4);
    herr.soportes=Math.max(2,Math.ceil(L/800)+1);
    horas=1+2*(L*A/1e6);
    horasInst=S.instala?0.3*herr.soportes:0;
  }
  if(macizo)horas*=1.2;
  if(S.termina)horas+=0.4*termM2*1.5;
  // madera a comprar
  let usa=0,uTxt="";
  if(S.unidad==="placa"){const pl=m.placa||[2600,1830];usa=Math.ceil(area/(pl[0]*pl[1]/1e6*0.82));uTxt=usa===1?"placa":"placas"}
  else if(S.unidad==="pie"){usa=Math.ceil(vol/PIE_M3*1.3);uTxt="pies"}
  else{const [a,b]=S.seccion.split("x").map(Number);usa=Math.ceil(vol*1.3/(real(a)/1000*real(b)/1000*S.largo));uTxt=usa===1?"pieza":"piezas"}
  let madera=usa*num(S.precio);
  let extraMadera="";
  if(m.servicio&&S.unidad==="placa"){const cortes=Math.ceil(piezas*1.33),cm=Math.ceil(canto);madera+=cortes*OESTE.corte+cm*OESTE.canto;extraMadera=` + cortes y canto (${cortes} cortes, ${cm} m)`}
  if(S.tipo==="caja"&&det.fondo){madera+=Math.ceil(det.fondo/(2.6*1.8*0.9))*53000;extraMadera+=" + fondo de chapadur"}
  madera*=1.05; // cola, lijas y tornillería menor
  const herrajes=herr.bisagras*S.herr.bisagra+herr.manijas*S.herr.manija+herr.correderas*S.herr.corredera;
  const litros=S.termina?Math.ceil(termM2*3/10):0;
  const terminacion=litros*num(S.litro);
  const g=1+num(S.ganancia)/100;
  return {usa,uTxt,extraMadera,madera,herr,herrajes,litros,terminacion,termM2,
    horas:Math.round(horas*2)/2,horasInst:Math.round(horasInst*2)/2,
    mo:Math.round(horas*2)/2*num(S.valorHora)*g,inst:Math.round(horasInst*2)/2*num(S.valorHora)*g};
}

/* ---------- pantalla ---------- */
let C=null;
const RENGLONES=[
  {k:"madera",nom:"Madera"},
  {k:"herrajes",nom:"Herrajes"},
  {k:"terminacion",nom:"Terminación"},
  {k:"mo",nom:"Mano de obra"},
  {k:"inst",nom:"Instalación en el lugar"}
];
function visibles(){
  return RENGLONES.filter(r=>r.k==="madera"||r.k==="mo"||(r.k==="herrajes"&&(S.tipo!=="mesa"))||(r.k==="terminacion"&&S.termina)||(r.k==="inst"&&S.instala));
}
function sugerido(k){return mil(C[k]||0)}
function monto(k){return S.montos[k]!=null?S.montos[k]:sugerido(k)}
function detalle(k){
  const m=matSel();
  if(k==="madera")return `${C.usa} ${C.uTxt} de ${m.nombre}${S.precio?` × ${fmt(S.precio)}`:""}${C.extraMadera}. Incluye cola, lijas y tornillería.`+(num(S.precio)?"":` <b style="color:var(--warn)">Cargá el precio de la madera en el paso 2.</b>`);
  if(k==="herrajes"){
    const h=C.herr,p=[];
    if(h.bisagras)p.push(`${h.bisagras} bisagras × <span class="mini">$<input data-h="bisagra" type="number" value="${S.herr.bisagra}"></span>`);
    if(h.manijas)p.push(`${h.manijas} manijas × <span class="mini">$<input data-h="manija" type="number" value="${S.herr.manija}"></span>`);
    if(h.correderas)p.push(`${h.correderas} pares de correderas × <span class="mini">$<input data-h="corredera" type="number" value="${S.herr.corredera}"></span>`);
    if(h.soportes)p.push(`${h.soportes} soportes (poné el monto a la derecha)`);
    return p.length?p.join(" · "):"Sumá lo que lleve.";
  }
  if(k==="terminacion")return `Unos ${C.litros} ${C.litros===1?"litro":"litros"} para ${coma(C.termM2.toFixed(1))} m² a 3 manos × <span class="mini">$<input data-l="1" type="number" value="${S.litro}"></span> el litro.`;
  if(k==="mo")return `${coma(C.horas)} horas (unos ${coma(Math.ceil(C.horas/S.horasDia))} días de <span class="mini"><input data-c="horasDia" type="number" step="0.5" value="${S.horasDia}"></span> h) × <span class="mini">$<input data-c="valorHora" type="number" value="${S.valorHora}"></span> la hora + <span class="mini"><input data-c="ganancia" type="number" value="${S.ganancia}"></span> % de ganancia y gastos del taller.`;
  if(k==="inst")return `${coma(C.horasInst)} horas en el lugar, al mismo valor.`;
  return "";
}
function pintarPresupuesto(){
  C=calcular();
  $("estadoCargar").textContent="";
  const vis=visibles();
  $("renglones").innerHTML=vis.map(r=>`<div class="renglon" data-k="${r.k}"><span class="nom">${r.nom}</span><input class="monto" type="number" step="1000" value="${monto(r.k)}" aria-label="Monto ${r.nom}"><span class="det">${detalle(r.k)}</span></div>`).join("");
  pintarTotal();
}
function totalRedondo(){const vis=visibles();const s=vis.reduce((a,r)=>a+monto(r.k),0);return {s,t:cincoMil(s),vis}}
function pintarTotal(){$("total").textContent=fmt(totalRedondo().t)}
$("renglones").addEventListener("input",ev=>{
  const t=ev.target,row=t.closest(".renglon");
  if(t.classList.contains("monto")){S.montos[row.dataset.k]=num(t.value);pintarTotal();return}
});
$("renglones").addEventListener("change",ev=>{
  const t=ev.target,row=t.closest(".renglon");if(!row)return;
  if(t.dataset.h){S.herr[t.dataset.h]=num(t.value);MEM[t.dataset.h]=S.herr[t.dataset.h];delete S.montos.herrajes}
  else if(t.dataset.l){S.litro=num(t.value);MEM.litro=S.litro;delete S.montos.terminacion}
  else if(t.dataset.c){S[t.dataset.c]=num(t.value);MEM[t.dataset.c]=S[t.dataset.c];delete S.montos.mo;delete S.montos.inst}
  else return;
  guardarMem();pintarPresupuesto();
});

function pintarMueble(){
  document.querySelectorAll('input[name="tipo"]').forEach(r=>r.checked=r.value===S.tipo);
  ["alto","ancho","prof","puertas","cajones","estantes","casilleros"].forEach(k=>$(k).value=S[k]);
  $("instala").checked=S.instala;$("termina").checked=S.termina;
  document.querySelectorAll(".sCaja").forEach(x=>x.classList.toggle("oculto",S.tipo!=="caja"));
  $("lAlto").classList.toggle("oculto",S.tipo==="estante");
  $("lAncho").firstChild.textContent=S.tipo==="mesa"?"Largo (cm)":"Ancho (cm)";
  $("lProf").firstChild.textContent=S.tipo==="mesa"?"Ancho (cm)":"Profundidad (cm)";
}
function pintarMadera(){
  const m=matSel();

async function tokenActual(){
  if(!SES||!SES.token)return null;
  if(SES.expira&&Date.now()>SES.expira-120000){
    try{const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,{method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:SES.refresh})});
      const d=await r.json();
      if(r.ok&&d.access_token){SES.token=d.access_token;SES.refresh=d.refresh_token||SES.refresh;SES.expira=Date.now()+(d.expires_in||3600)*1000;try{localStorage.setItem("encastre_sesion",JSON.stringify(SES))}catch(e){}}
      else return null;
    }catch(e){return null}
  }
  return SES.token;
}
async function leer(tabla,q){
  const tk=await tokenActual();if(!tk)throw new Error("sin sesión");
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${tabla}${q}`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${tk}`}});
  if(!r.ok)throw new Error(await r.text());return r.json();
}
async function pedirIA(p){
  try{
    const r=await fetch("/.netlify/functions/claude",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:[{role:"user",content:p}]})});
    const d=await r.json();const t=(d.content||[]).map(i=>i.text||"").join("").replace(/```json|```/g,"").trim();
    const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<a)return null;return JSON.parse(t.slice(a,b+1));
  }catch(e){return null}
}

/* ---------- pedido del cliente ---------- */
const MAP_MAT={mdf_melamina:"mdf_mel",aglomerado_melamina:"agl_mel",mdf:"mdf_crudo",aglomerado:"agl_crudo",fenolico:"fenolico"};
const MAP_ESP={"Pino":"pino","Paraíso":"paraiso","Kiri":"kiri","Eucalipto":"eucalipto","Cedro":"cedro","Roble":"roble"};
const MAP_GRUPO={madera_dura:"dura",madera_semidura:"semidura",madera_blanda:"blanda"};
const NOM_MAT={madera_dura:"madera dura",madera_semidura:"madera semidura",madera_blanda:"madera blanda",aglomerado:"aglomerado",aglomerado_melamina:"aglomerado con melamina",mdf:"MDF",mdf_melamina:"MDF con melamina",fenolico:"fenólico"};
const NOM_TERM={crudo:"en crudo",pintado:"pintado",lacheado:"laqueado o barnizado",melamina_color:"melamina de color",enchapado:"enchapado"};
const LLEVA_TERM={pintado:true,lacheado:true,enchapado:true,crudo:false,melamina_color:false};
let MUEBLES=[];
function matDePedido(it){
  if(MAP_MAT[it.material])return MAP_MAT[it.material];
  if(MAP_GRUPO[it.material]){
    if(it.especie&&MAP_ESP[it.especie])return MAP_ESP[it.especie];
    const id=MAP_GRUPO[it.material],m=MATS.find(x=>x.id===id);
    if(m&&it.especie)m.nombre=`${m.nombre.split(" (")[0]} (${it.especie})`;
    return id;
  }
  return null;
}
function textoDe(it){
  const p=[];
  if(it.descripcion)p.push(String(it.descripcion).trim().replace(/\.$/,"")+".");
  const md=[];if(num(it.alto))md.push(`${num(it.alto)} cm de alto`);if(num(it.ancho))md.push(`${num(it.ancho)} cm de ancho`);if(num(it.profundidad))md.push(`${num(it.profundidad)} cm de profundidad`);
  if(md.length)p.push("Medidas: "+md.join(", ")+".");
  if(it.material)p.push(`Material: ${NOM_MAT[it.material]||it.material}${it.especie?" ("+it.especie+")":""}.`);
  if(it.terminacion)p.push(`Terminación: ${NOM_TERM[it.terminacion]||it.terminacion}${it.color?", color "+it.color:""}.`);
  if(it.tieneCajones&&num(it.cantidadCajones))p.push(`Con ${num(it.cantidadCajones)} cajones${it.medidasCajones?" ("+it.medidasCajones+")":""}.`);
  if(it.notasCroquis)p.push("Notas del cliente: "+String(it.notasCroquis).trim());
  return p.join(" ");
}
function prompt(texto){
  return `Sos una carpintera argentina. Leé este pedido de un mueble y devolvé SOLO un objeto JSON, sin texto alrededor:
{"tipo":"caja"|"mesa"|"estante","material":uno de ${JSON.stringify(MATS.map(m=>m.id))},"alto":cm,"ancho":cm,"prof":cm,"puertas":n,"cajones":n,"estantes":n,"casilleros":n,"instala":bool,"termina":bool,"dudas":string}
- "caja": muebles de placas o tablas con puertas, cajones o estantes (guardado, alacena, bajo mesada, placard, biblioteca, cómoda, mesa de luz).
- "mesa": mesa, escritorio o banco (patas, faldones y tapa). "ancho" es el largo y "prof" el ancho de la tapa.
- "estante": una sola pieza (estante de pared, tapa, mesada).
- Medidas en centímetros. Si faltan: mesa de comedor 75 de alto y 60 cm por persona (para 6: 150×100); escritorio 75×120×60; bajo mesada 90×60 de profundidad; alacena 70×30; placard 60 de profundidad; cómoda 80×45; estante de pared 25 de profundidad.
- "instala": true si se amura, se cuelga o se coloca en el lugar. "termina": true si lleva barniz, laca, pintura o aceite.
- Si no dicen material, pino. Melamina o MDF blanco = "mdf_mel".
- En "dudas", una frase con lo que supusiste. No inventes precios.

Pedido: """${texto.slice(0,1500)}"""`;
}
function interpretarLocal(texto){
  const t=texto.toLowerCase(),r={};
  const mats=[["roble","roble"],["cedro","cedro"],["kiri","kiri"],["para[ií]so","paraiso"],["eucal","eucalipto"],["fen[oó]lico","fenolico"],["aglomerado","agl_mel"],["mdf crudo","mdf_crudo"],["melamina|mdf","mdf_mel"],["pino","pino"]];
  r.material=(mats.find(([re])=>new RegExp(re).test(t))||[,"pino"])[1];
  const n=+((t.match(/para\s*(\d+)/)||[])[1]||0);
  if(/escritorio/.test(t))Object.assign(r,{tipo:"mesa",alto:75,ancho:120,prof:60});
  else if(/\bmesa\b(?! de luz)|banco/.test(t))Object.assign(r,{tipo:"mesa",alto:75,ancho:n===6?150:n?Math.max(120,Math.ceil(n/2)*60):150,prof:n>4||!n?100:80});
  else if(/estante|repisa|mesada(?!.*bajo)|tapa/.test(t)&&!/bajo ?mesada/.test(t))Object.assign(r,{tipo:"estante",ancho:100,prof:25});
  else Object.assign(r,{tipo:"caja",alto:/bajo ?mesada/.test(t)?90:/alacena/.test(t)?70:/c[oó]moda/.test(t)?80:170,ancho:100,prof:/bajo ?mesada|placard|ropero/.test(t)?60:/c[oó]moda/.test(t)?45:35,puertas:/c[oó]moda|cajonera/.test(t)?0:2,estantes:/c[oó]moda/.test(t)?0:2});
  const g=(re)=>{const m=t.match(re);return m?(/un/.test(m[1])?1:+m[1]):null};
  const pu=g(/(\d+)\s*puertas?/),cj=g(/(\d+|un|una)\s*caj[oó]n/),es=g(/(\d+)\s*estantes?/),ca=g(/(\d+)\s*casilleros?/);
  if(pu!=null)r.puertas=pu;if(cj!=null)r.cajones=cj;if(es!=null)r.estantes=es;if(ca!=null)r.casilleros=ca;
  const al=t.match(/(\d+)\s*(?:cm)?\s*de\s*alto/),an=t.match(/(\d+)\s*(?:cm)?\s*de\s*(?:ancho|largo)/),pr=t.match(/(\d+)\s*(?:cm)?\s*de\s*(?:fondo|profundidad)/);
  if(al)r.alto=+al[1];if(an)r.ancho=+an[1];if(pr)r.prof=+pr[1];
  r.instala=/amur|colg|instal|coloca/.test(t);r.termina=/barniz|laca|pint|aceite|lustr/.test(t);
  return r;
}
function aplicar(r,it){
  if(!r)return;
  if(["caja","mesa","estante"].includes(r.tipo))S.tipo=r.tipo;
  if(r.material&&MATS.some(m=>m.id===r.material))S.material=r.material;
  ["alto","ancho","prof","puertas","cajones","estantes","casilleros"].forEach(k=>{if(r[k]!=null&&isFinite(num(r[k])))S[k]=Math.max(0,Math.round(num(r[k])))});
  if(S.tipo!=="caja"){S.puertas=0;S.cajones=0;S.estantes=0;S.casilleros=0}
  if(typeof r.instala==="boolean")S.instala=r.instala;
  if(typeof r.termina==="boolean")S.termina=r.termina;
  if(it){ // lo que dice el pedido manda
    const mid=matDePedido(it);if(mid)S.material=mid;
    if(num(it.alto)>0)S.alto=num(it.alto);if(num(it.ancho)>0)S.ancho=num(it.ancho);if(num(it.profundidad)>0)S.prof=num(it.profundidad);
    if(it.terminacion in LLEVA_TERM)S.termina=LLEVA_TERM[it.terminacion];
    if(S.tipo==="caja"&&it.tieneCajones&&num(it.cantidadCajones)>0)S.cajones=num(it.cantidadCajones);
  }
  if(matSel().tipo==="placa"&&S.tipo==="caja")S.termina=S.termina&&!/mel/.test(S.material);
  S.unidad=matSel().tipo==="placa"?"placa":"pie";
  S.precio=precioRecordado();S.montos={};
  todo();
}
async function interpretar(){
  const texto=$("texto").value.trim();if(!texto)return;
  const btn=$("btnInterpretar"),est=$("estadoIA"),it=MUEBLES[+$("mueble").value||0];
  btn.disabled=true;est.className="estado";est.textContent="Leyendo el pedido…";
  const clave=`encastre_pres_simple_${PEDIDO_ID||"x"}_${$("mueble").value||0}_${texto.length}`;
  let r=null;try{r=JSON.parse(sessionStorage.getItem(clave)||"null")}catch(e){}
  if(!r){r=await pedirIA(prompt(texto));if(r){try{sessionStorage.setItem(clave,JSON.stringify(r))}catch(e){}}}
  if(r){aplicar(r,it);est.className="estado ok";est.textContent=r.dudas?"Supuse: "+r.dudas:"Listo. Revisá las medidas."}
  else{aplicar(interpretarLocal(texto),it);est.className="estado err";est.textContent="Lo armé con reglas simples. Revisá las medidas."}
  btn.disabled=false;
}
$("btnInterpretar").addEventListener("click",interpretar);
$("mueble").addEventListener("change",()=>{const it=MUEBLES[+$("mueble").value];if(it){$("texto").value=textoDe(it);interpretar()}});

  if(!num(S.precio)&&!confirm("Falta el precio de la madera. ¿Lo cargás igual?"))return;
  const it=MUEBLES[+$("mueble").value||0]||{};
  const pref=MUEBLES.length>1&&it.descripcion?it.descripcion.trim()+" — ":"";
  const {t,vis}=totalRedondo();
  const items=vis.map(r=>({descripcion:pref+r.nom,precio:monto(r.k)})).filter(x=>x.precio>0);
  const dif=t-items.reduce((a,x)=>a+x.precio,0);
  const mo=items.find(x=>/Mano de obra$/.test(x.descripcion));if(mo)mo.precio+=dif;
  const calculo={version:"simple-1",fecha:new Date().toISOString(),mueble:it.descripcion||"",texto:$("texto").value,
    mueble_datos:{tipo:S.tipo,alto:S.alto,ancho:S.ancho,prof:S.prof,puertas:S.puertas,cajones:S.cajones,estantes:S.estantes,casilleros:S.casilleros,instala:S.instala,termina:S.termina},
    madera:{material:matSel().nombre,unidad:S.unidad,seccion:S.unidad==="pieza"?S.seccion:null,largo:S.unidad==="pieza"?S.largo:null,precio:S.precio,cantidad:C.usa},
    herrajes:{cantidades:C.herr,precios:S.herr},horas:C.horas,horas_instalacion:C.horasInst,valor_hora:S.valorHora,ganancia_pct:S.ganancia,
    renglones:items,total:t};
  window.parent.postMessage({tipo:"encastre-presupuesto",accion:"cargar",pedidoId:PEDIDO_ID,mueble:it.descripcion||"",items,calculo},location.origin);
  est.className="estado ok";est.textContent="Cargado.";
});

  todo();
  if(!PEDIDO_ID)return;
  const av=$("avisoSesion");
  if(!SES||!SES.token){av.innerHTML="<b>No encontré tu sesión.</b> Entrá a Encastre con tu cuenta y abrí el presupuesto desde el pedido.";av.classList.remove("oculto");return}
  try{
    const r=await leer("pedidos",`?id=eq.${encodeURIComponent(PEDIDO_ID)}&select=*`);
    const p=r&&r[0];if(!p)throw new Error("no encontrado");
    MUEBLES=Array.isArray(p.items)&&p.items.length?p.items:[{descripcion:p.descripcion,alto:p.alto,ancho:p.ancho,profundidad:p.profundidad,material:p.material,especie:p.especie,terminacion:p.terminacion,color:p.color,tieneCajones:p.tiene_cajones,cantidadCajones:p.cantidad_cajones,medidasCajones:p.medidas_cajones,notasCroquis:p.notas_croquis}];
    $("mueble").innerHTML=MUEBLES.map((m,i)=>`<option value="${i}">${(m.descripcion||"Mueble "+(i+1)).replace(/</g,"&lt;")}</option>`).join("");
    $("campoMueble").classList.toggle("oculto",MUEBLES.length<2);
    $("texto").value=textoDe(MUEBLES[0]);

  }catch(e){av.innerHTML="<b>No pude leer el pedido.</b> Escribí el mueble y tocá \"Armar presupuesto\".";av.classList.remove("oculto");$("texto").value=""}
}
iniciar();
